<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Antropología</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1C2236; --muted:#4f5a78; --line:#DAE1F2; --accent:#364775; --accent-ink:#ffffff;
  --track:#e9edf7; --warn-bg:#fff4e5; --warn-line:#FECA8E; --hero1:#1C2236; --hero2:#222D4E;
  --c1:#364775; --c2:#F36F0F; --c3:#96B3DF; --c4:#C23319; --c5:#FEAA46;
  --shadow:0 1px 2px rgba(28,34,54,.06),0 2px 8px rgba(28,34,54,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
    --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
    --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
  --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
  --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Verdana,Geneva,sans-serif}
header{background:var(--hero1);color:#fff;position:sticky;top:0;z-index:5;border-bottom:3px solid #F36F0F}
header .sub{color:rgba(255,255,255,.85)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
h1{font-size:clamp(15px,3.2vw,20px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:7px 14px;font:inherit;font-size:13px;color:#DAE1F2;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.12)}
nav button[aria-selected="true"]{background:#fff;color:#1C2236;font-weight:700;border-color:#fff}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-top:-6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav[hidden]{display:none}
.subnav button{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;color:#c4cde6;cursor:pointer;white-space:nowrap}
.subnav button:hover{background:rgba(255,255,255,.1)}
.subnav button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.55);font-weight:700}
.inicio-grupo{font-size:16px;margin:24px 0 2px}
.inicio-grupo-sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:74ch}
.intro-f{margin-bottom:16px}
.intro-kpis{margin:2px 0 14px}
.intro-kpis .kpi{flex:1 1 170px}
.intro-kpis .kpi-num{font-size:26px}
.intro-f p{margin:0 0 8px;font-size:13.5px;line-height:1.55;color:var(--ink);max-width:90ch}
.intro-f p:last-child{margin-bottom:0;color:var(--muted)}
.analisis{margin:10px 0 2px;padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 6px 6px 0}
.analisis p{margin:0 0 6px;font-size:12.5px;line-height:1.5}
.analisis p:last-child{margin-bottom:0}
.analisis .ana-b{padding-left:14px;position:relative}
.analisis .ana-b::before{content:"•";position:absolute;left:2px;color:var(--accent)}
.texto-bloque .txt-p{margin:0 0 9px;font-size:13.5px;line-height:1.55}
.texto-bloque .txt-b{margin:0 0 6px;padding-left:16px;position:relative;font-size:13px;line-height:1.5}
.texto-bloque .txt-b::before{content:"•";position:absolute;left:3px;color:var(--accent)}
.hm-wrap{overflow-x:auto;margin-top:4px}
.hm{border-collapse:collapse;font-size:11.5px;min-width:100%}
.hm th,.hm td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.hm .hm-h{font-weight:600;color:var(--muted);font-size:10.5px;max-width:92px;white-space:normal;line-height:1.2}
.hm .hm-row{text-align:left;font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1}
.hm .hm-esq{background:var(--panel);position:sticky;left:0;z-index:2}
.hm .hm-cell{font-variant-numeric:tabular-nums}
.apil-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.apil-lab{flex:0 0 160px;font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.apil-bar{flex:1;display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--track)}
.apil-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:0}
.dv-row{display:flex;align-items:center;gap:10px;margin:11px 0}
.bic{display:flex;flex-wrap:wrap;gap:18px}
.bic-panel{flex:1 1 320px;min-width:0}
.bic-t{margin:0 0 4px;font-size:14px}
.dv-lab{flex:0 0 160px;font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.dv-bars{flex:1;display:flex;flex-direction:column;gap:5px}
.dv-track{position:relative;height:15px;background:var(--track);border-radius:3px}
.dv-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--muted)}
.dv-seg{position:absolute;top:0;height:100%;border-radius:3px}
.dv-num{position:absolute;top:0;font-size:10.5px;line-height:15px;font-weight:600;color:var(--ink)}
.chart-card.full{grid-column:1/-1}
.chart-card.full .texto-bloque{columns:2;column-gap:28px}
@media (max-width:760px){.chart-card.full .texto-bloque{columns:1}.apil-lab{flex-basis:110px}}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
header button.ghost{background:transparent;color:#DAE1F2;border-color:rgba(255,255,255,.28)}
button.ghost:hover{border-color:var(--accent)}
button.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:20px 0 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel{padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 8px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:3px 0}
.warn{background:var(--warn-bg);border-color:var(--warn-line)}
details.panel summary{cursor:pointer;font-weight:600;font-size:15px}
details.panel[open] summary{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.grid.doc{grid-template-columns:1fr;max-width:1000px}
.chart-card{padding:16px 18px 14px;display:flex;flex-direction:column;min-width:0;border-top:3px solid var(--accent)}
.chart-card h3{font-size:13.5px;margin:0 0 2px;line-height:1.3}
.nota{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.clave{font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--fa,var(--accent));background:color-mix(in srgb,var(--fa,var(--accent)) 12%,transparent);border-left:3px solid var(--fa,var(--accent));border-radius:6px;padding:8px 10px;margin:0 0 12px}
.filtros{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:0 0 14px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--panel);box-shadow:var(--shadow)}
.fgrupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flab{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.fbtn{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fbtn.comparar{margin-left:10px}
.fbtn.comparar.on{background:#F36F0F;border-color:#F36F0F;color:#fff}
.fhint{flex-basis:100%;font-size:11.5px;color:var(--muted);margin:0}
.nmini{font-size:11.5px;color:var(--muted);margin:-2px 0 6px}
.nmini .peque{color:var(--accent)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.kpi{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi-num{font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpi-lab{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tema{margin-top:26px;scroll-margin-top:130px}
.tema[hidden]{display:none}
.tema-t{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.tema-t::before{content:"";width:6px;height:22px;border-radius:1px;background:#F36F0F}
.tema-t span{font-size:12px;font-weight:600;background:var(--track);color:var(--muted);border-radius:3px;padding:1px 8px;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search]{flex:1 1 220px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.hbar .pistas{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.pista{display:flex;align-items:center;gap:6px}
.pista .tr{flex:1;background:var(--track);border-radius:2px;height:14px}
.pista .rel{height:100%;border-radius:2px;min-width:3px}
.pista .val{min-width:46px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink)}
.vbar{display:flex;align-items:flex-end;gap:6px;height:240px;padding-top:18px;border-bottom:1px solid var(--line)}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vgrp{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.vgrp div{flex:1;max-width:44px;border-radius:2px 2px 0 0;position:relative;min-height:2px}
.vgrp span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.vlabs{display:flex;gap:6px;margin-top:5px}
.vlabs div{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.pie-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pie{flex:0 0 180px;max-width:180px}
.pie svg{width:100%;height:auto;display:block}
.pie svg path,.pie svg circle{stroke:var(--panel);stroke-width:1.5}
.pie-leg{flex:1 1 180px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.pie-item{display:flex;align-items:center;gap:8px;line-height:1.25}
.pie-item i{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.pie-lab{flex:1;color:var(--ink)}
.pie-val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:340px;overflow:auto}
.chart-img{margin-top:6px}
.chart-img img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0;width:min(980px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px 0}
.dlg-head h3{margin:0;font-size:17px}
.dlg-body{padding:12px 20px 20px;overflow:auto;max-height:calc(90vh - 80px)}
.hero{padding:24px 22px}
.hero h2{font-size:22px;margin:0 0 8px}
.hero .sub{font-size:14.5px;line-height:1.5}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.inicio .card{transition:box-shadow .15s,transform .15s}
.inicio .card:hover{box-shadow:0 6px 18px rgba(28,34,54,.12);transform:translateY(-2px)}
.inicio .card{padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent);min-height:150px}
.inicio h2{margin:0;font-size:15px}
.inicio .n{font-size:34px;font-weight:700;line-height:1;color:var(--accent);margin-top:6px}
.inicio button{margin-top:auto;align-self:flex-start}
.vacio{color:var(--muted);padding:30px;text-align:center}
.nb-frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px;display:block}
footer{color:var(--muted);font-size:12.5px;padding:0 0 30px}
@media (max-width:560px){.hbar{grid-template-columns:minmax(80px,40%) 1fr}.wrap{padding:0 12px}.top{flex-wrap:wrap}.tools .ghost{flex:1 1 auto;text-align:center}.vbar{height:200px}.grid{gap:12px}dialog{width:98vw}.dlg-body{padding:10px 12px 16px}}

/* ---- Rediseño "dashboard vivo" ---- */
:root{--ga:#364775;--r:14px;--shadow:0 1px 2px rgba(28,34,54,.06),0 6px 18px rgba(28,34,54,.07)}
header{background:linear-gradient(120deg,var(--hero1) 0%,#2b3a6b 60%,#3b4f93 100%);border-bottom:3px solid #F36F0F}
h1{letter-spacing:.2px}
nav button{border-radius:999px}
nav button[aria-selected="true"]{box-shadow:0 2px 10px rgba(243,111,15,.45);background:#F36F0F;color:#fff;border-color:#F36F0F}
body{background:radial-gradient(1100px 380px at 85% -80px,color-mix(in srgb,#F36F0F 10%,transparent),transparent),radial-gradient(900px 400px at 0% 0,color-mix(in srgb,#364775 10%,transparent),transparent),var(--bg);background-attachment:fixed}
.card{border-radius:var(--r)}
.hero{position:relative;overflow:hidden;padding:30px 28px 26px;border:0!important;color:#fff;background:linear-gradient(125deg,#1C2236 0%,#2f3f78 55%,#F36F0F 140%)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(254,170,70,.45),transparent 70%)}
.hero h2{font-size:clamp(22px,4vw,32px);line-height:1.15;margin:0 0 10px;color:#fff;position:relative}
.hero .sub{color:rgba(255,255,255,.88);position:relative}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(3px);border-radius:12px;padding:12px 14px}
.hero-stat b{display:block;font-size:clamp(26px,4vw,38px);line-height:1;color:#FEAA46;font-variant-numeric:tabular-nums}
.hero-stat span{display:block;margin-top:6px;font-size:12px;color:rgba(255,255,255,.86);line-height:1.25}
.inicio-grupo{display:flex;align-items:center;gap:10px;font-size:19px;margin:34px 0 4px}
.inicio-grupo .ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:18px;background:color-mix(in srgb,var(--ga) 16%,transparent)}
.inicio .card{border-top:0;border-left:5px solid var(--ga);background:linear-gradient(160deg,color-mix(in srgb,var(--ga) 9%,var(--panel)),var(--panel) 55%);min-height:170px}
.inicio .card:hover{box-shadow:0 12px 28px rgba(28,34,54,.18);transform:translateY(-4px)}
.inicio .card h2{font-size:16px}
.inicio .card button.ghost{border-radius:999px;background:var(--ga);border-color:var(--ga);color:#fff;padding:6px 16px;font-weight:700}
.inicio .card button.ghost:hover{filter:brightness(1.12)}
.chart-card{border-top:0;position:relative;overflow:hidden;animation:subir .5s ease both}
.chart-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#364775,#F36F0F)}
.chart-card{padding-top:20px}
.chart-card:hover{box-shadow:0 10px 26px rgba(28,34,54,.14)}
.chart-card h3{font-size:14.5px}
.tema-t{font-size:15px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,#F36F0F 14%,var(--panel)),transparent)}
.tema-t::before{width:8px;height:26px;border-radius:4px;background:linear-gradient(#F36F0F,#FEAA46)}
.kpi{border-radius:14px;border:0;color:#fff;background:linear-gradient(135deg,#364775,#4b63a8);box-shadow:0 6px 16px rgba(54,71,117,.28);animation:subir .5s ease both}
.kpi:nth-child(3n+2){background:linear-gradient(135deg,#d85a05,#F36F0F 60%,#FEAA46)}
.kpi:nth-child(3n){background:linear-gradient(135deg,#2a8a8a,#3ab0a4)}
.kpi-num{color:#fff;font-size:34px}
.kpi-lab{color:rgba(255,255,255,.9)}
.kpi *{color:inherit}
.fbtn{transition:all .15s}.fbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.filtros{border-radius:14px;box-shadow:0 6px 20px rgba(28,34,54,.12)}
.pista .rel,.apil-seg,.dv-seg,.vgrp div{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.pista .rel{transform-origin:left;animation:crece .8s cubic-bezier(.2,.7,.2,1) both}
.vgrp div{transform-origin:bottom;animation:creceV .8s cubic-bezier(.2,.7,.2,1) both}
.apil-seg{animation:fade .8s ease both}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes creceV{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.abs{font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap}
.abs-hm{display:block;font-size:9.5px;font-weight:400;opacity:.85}
.comp .tablewrap{max-height:420px;margin-top:6px}
.apil-tot{flex:0 0 auto;font-size:12px;font-weight:700;min-width:70px}
.kpi-sub{font-size:12px;margin-top:2px;opacity:.9}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Antropología Uniandes: tablero de estudios</h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="ghost" id="tema" aria-pressed="false" title="Cambiar entre claro y oscuro">Modo oscuro</button>
    </div>
    <nav id="tabs" role="tablist" aria-label="Secciones"></nav>
    <nav id="subtabs" class="subnav" aria-label="Subsecciones" hidden></nav>
  </div>
</header>
<main class="wrap" id="vista"></main>
<div class="wrap"><footer id="pie"></footer></div>
<dialog id="ventana" aria-labelledby="vt">
  <div class="dlg-head"><div><h3 id="vt"></h3><p class="nota" id="vn"></p></div>
    <button class="ghost" id="cerrar" aria-label="Cerrar">Cerrar</button></div>
  <div class="dlg-body" id="vc"></div>

ología (grados 2021 a 2025): lo que hicieron en la universidad (doble titulación, opciones académicas, tiempo para graduarse, prácticas, posgrados, retiros y reintegros) y lo que hicieron después en el mercado laboral, según su perfil de LinkedIn. El objetivo es identificar qué aspectos de la formación se asocian con una mejor inserción laboral y en qué medida los egresados se desempeñan como antropólogos.", "doc": true, "hallazgos": [], "advertencias": [], "graficas": [{"titulo": "¿A quiénes cubre el análisis?", "cab": ["Paso", "Egresados", "Qué significa"], "filas": [["Egresados del programa", "190", "Total de graduados de Antropología 2021-2025."], ["Registran experiencia en LinkedIn", "149 (78,4 %)", "Son el universo del análisis: todos los porcentajes se calculan sobre ellos. Los 41 restantes no tienen experiencias registradas; eso no significa que estén desempleados, por eso no se incluyen."], ["Tienen alguna experiencia profesional", "139", "Los otros 10 solo registran monitorías, prácticas o pasantías."], ["Tienen experiencia profesional después del grado", "130 (87,2 %)", "Experiencia vigente o iniciada después de la fecha de grado."], ["Tienen hoy un empleo profesional", "98 (65,8 %)", "Base de los análisis sobre el empleo actual."]], "nota": "", "tipo": "tabla", "tema": ""}, {"titulo": "¿Qué se cuenta como experiencia profesional?", "tipo": "texto", "texto": ["Los 149 egresados registran 901 experiencias en LinkedIn. De ellas, 283 no se cuentan como empleo profesional: 141 monitorías o asistencias académicas, 124 prácticas o pasantías y 18 experiencias con nivel de practicante o con contrato de prácticas o de formación.", "Quedan 618 experiencias profesionales, de las cuales 384 son posteriores al grado. Sobre estas se calculan los indicadores.", "Las prácticas sí se analizan, pero aparte: en la sección de prácticas se revisa si el egresado continuó trabajando en la organización donde hizo su práctica."], "cab": [], "filas": [], "nota": "", "tema": ""}, {"titulo": "¿Cuándo se considera que un empleo es «de Antropología»?", "tipo": "texto", "texto": ["Cuando el cargo es explícito (antropólogo, etnógrafo, arqueólogo) o cuando corresponde a investigación social o a gestión social o cultural. Para quienes tienen doble titulación, una IA clasificó con criterio estricto si el cargo exige el otro pregrado."], "cab": [], "filas": [], "nota": "", "tema": ""}, {"titulo": "Reglas base (aplican a todos los indicadores)", "cab": ["Regla", "Definición"], "filas": [["Empleo profesional", "Toda experiencia, excepto las que tengan: CARGO_GRUPO = «Monitoría y asistencia académica» o «Practicante o pasante»; NIVEL_CARGO = practicante; o TIPO_EMPLEO = «Contrato de prácticas» o «Contrato de formación»."], ["Empleo después del grado", "Cumple al menos una de estas condiciones: es actual (ES_ACTUAL); termina en la fecha de grado o después; o no tiene fecha de fin y empieza en la fecha de grado o después."], ["Empleo actual principal", "Entre los empleos profesionales con ES_ACTUAL = true, el de menor ORDEN, es decir, el primero del perfil."], ["Nivel del cargo (NIVEL_CARGO)", "1 = asistente; 2 = profesional; 3 = coordinador; 4 = director, socio o C-level. Los cargos sin nivel clasificado no puntúan."], ["Relación con Antropología", "CORRESPONDE_ANTROPOLOGIA = «Sí», que agrupa directa, afín por investigación y afín por gestión social o cultural."]], "nota": "", "tipo": "tabla", "tema": ""}, {"titulo": "Indicadores", "cab": ["Indicador", "Cuenta como 1 si…", "Detalles"], "filas": [["Empleo profesional después del grado", "Tiene al menos 1 empleo profesional después del grado.", ""], ["Empleo profesional actual", "Tiene al menos 1 empleo profesional con ES_ACTUAL = true.", "Incluye empleos actuales que empezaron antes del grado."], ["Inserción en 6 meses o menos", "Su primer empleo profesional después del grado empezó 6 meses o menos después de la fecha de grado.", "meses = (inicio − fecha de grado) / 30,44, redondeado. Si ya trabajaba (empezó antes del grado) cuenta como 0, es decir, como inserción. Se toma el mínimo entre sus empleos; los que no tienen fecha de inicio no entran, y si ninguno tiene fecha la persona cuenta como 0."], ["Coordinación o superior", "El nivel máximo entre sus empleos profesionales después del grado es ≥ 3 (coordinador, director, socio o C-level).", "Se considera cualquier empleo después del grado, no solo el actual. Los cargos sin nivel clasificado no suman."], ["Empleo actual afín a Antropología", "Al menos uno de sus empleos profesionales actuales tiene CORRESPONDE_ANTROPOLOGIA = «Sí».", "Se revisan todos los empleos actuales, no solo el principal. Quien no tiene empleo actual cuenta como 0."]], "nota": "", "tipo": "tabla", "tema": ""}], "descripcion": "Qué cubre el análisis integrado, cómo se define el empleo profesional y qué significan los indicadores. Léelo antes de la sección de Análisis.", "clave": ""}, {"id": "cruces", "pestana": "Análisis", "titulo": "Análisis integrado: trayectoria académica y laboral", "fuente": "Fuente: caracterización académica cruzada con LinkedIn (Recruiter), posgrados y productos de mercado", "intro": "", "intro_kpis": [{"num": "149 / 190", "lab": "egresados con experiencia en LinkedIn (grados 2021–2025)", "kpi": "lk", "fmt": "frac"}, {"num": "98 / 149", "lab": "egresados con empleo actual (no cuentan prácticas, pasantías ni monitorías)", "kpi": "ea", "fmt": "frac"}, {"num": "158 / 190", "lab": "egresados registran formación en LinkedIn (grados 2021–2025)", "kpi": "ed", "fmt": "frac"}, {"num": "901", "lab": "experiencias registradas por los egresados en LinkedIn", "kpi": "expn", "fmt": "count"}, {"num": "87,2 %", "lab": "registra empleo profesional después del grado", "kpi": "ea_post", "fmt": "pct"}, {"num": "71,9 %", "lab": "se insertó en 6 meses o menos (LinkedIn + encuesta)", "kpi": "ins6", "fmt": "pct"}, {"num": "21,5 %", "lab": "tiene al menos un empleo actual relacionado con Antropología", "kpi": "afin", "fmt": "pct"}], "hallazgos": [], "advertencias": [], "graficas": [{"titulo": "Inserción laboral de los egresados de Antropología", "cab": ["Indicador", "% de egresados con dato"], "filas": [["Empleo después del grado", 87.2], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 71.9], ["Empleo actual", 65.8], ["Ha trabajado alguna vez en Antropología", 48.3]], "nota": "Contexto general de la transición al mercado laboral. Solo empleo profesional (se excluyen prácticas, pasantías, monitorías y contratos de formación). La inserción en ≤ 6 meses integra LinkedIn con la encuesta (para no subestimar la inserción temprana); los demás indicadores son sobre los 149 con LinkedIn.", "tema": "I1. ¿Cómo es la inserción laboral de los egresados?", "tipo": "horizontal", "analisis": "• La mayoría logra entrar al mercado laboral, pero ese resultado se reduce al pasar de «alguna vez trabajó» a «trabaja hoy».", "full": true, "slices": {"T|T": {"filas": [["Empleo después del grado", 130, 149], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 120, 167], ["Empleo actual", 98, 149], ["Ha trabajado alguna vez en Antropología", 72, 149]], "n": 190}, "T|2021": {"filas": [["Empleo después del grado", 22, 22], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 15, 25], ["Empleo actual", 18, 22], ["Ha trabajado alguna vez en Antropología", 13, 22]], "n": 28}, "T|2022": {"filas": [["Empleo después del grado", 27, 28], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 23, 34], ["Empleo actual", 17, 28], ["Ha trabajado alguna vez en Antropología", 20, 28]], "n": 37}, "T|2023": {"filas": [["Empleo después del grado", 33, 41], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 33, 45], ["Empleo actual", 24, 41], ["Ha trabajado alguna vez en Antropología", 18, 41]], "n": 48}, "T|2024": {"filas": [["Empleo después del grado", 27, 32], ["Inserción en ≤ 6 meses (LinkedIn + encuesta)", 28, 37], ["Empleo actual", 21, 32], ["Ha trabajado alguna vez en Antropología", 12, 32]], "n": 42}, "T|2025": {"filas": [["Empleo después del grado", 21, 26], erción ≤ 6 meses", 3, 4, 4, 9], ["Opción académica | Empleo actual", 1, 3, 5, 7]], "n": 14}, "M|2023": {"filas": [["Doble titulación | Alguna vez en Antropología", 3, 5, 1, 3], ["Doble titulación | Inserción ≤ 6 meses", 3, 5, 3, 4], ["Doble titulación | Empleo actual", 2, 5, 1, 3], ["Opción académica | Alguna vez en Antropología", 1, 2, 3, 6], ["Opción académica | Inserción ≤ 6 meses", 2, 2, 4, 7], ["Opción académica | Empleo actual", 1, 2, 2, 6]], "n": 11}, "M|2024": {"filas": [["Doble titulación | Alguna vez en Antropología", 0, 2, 3, 6], ["Doble titulación | Inserción ≤ 6 meses", 1, 2, 6, 7], ["Doble titulación | Empleo actual", 1, 2, 6, 6], ["Opción académica | Alguna vez en Antropología", 3, 7, 0, 1], ["Opción académica | Inserción ≤ 6 meses", 6, 7, 1, 2], ["Opción académica | Empleo actual", 7, 7, 0, 1]], "n": 11}, "M|2025": {"filas": [["Doble titulación | Alguna vez en Antropología", 0, 3, 3, 4], ["Doble titulación | Inserción ≤ 6 meses", 3, 3, 4, 4], ["Doble titulación | Empleo actual", 2, 3, 4, 4], ["Opción académica | Alguna vez en Antropología", 1, 2, 2, 5], ["Opción académica | Inserción ≤ 6 meses", 2, 2, 5, 5], ["Opción académica | Empleo actual", 2, 2, 4, 5]], "n": 11}}, "n": 190, "filtrable": true}, {"titulo": "Nota I6a. Cómo leer la gráfica: afinidad, intervalo de confianza y valor p", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "I6a. ¿La doble titulación reduce la afinidad? (y opción académica)", "texto": ["Afinidad («Alguna vez en Antropología»): haber tenido al menos un empleo profesional después del grado relacionado con Antropología (cargo explícito de antropólogo, investigación o gestión social o cultural). Se mide con LinkedIn, sobre los 149 egresados con perfil. Ejemplo: 36/80 = de 80 egresados con doble titulación y LinkedIn, 36 han trabajado alguna vez en algo relacionado.", "Intervalo de confianza del 95 % (líneas negras): cada porcentaje sale de un grupo pequeño; con otro grupo parecido de egresados habría salido algo distinto por azar. El intervalo es el rango donde es razonable que esté el valor «real», con 95 % de confianza. Ejemplo: con doble titulación, 45 % (entre 35 % y 56 %); sin doble titulación, 52 % (entre 41 % y 63 %). Los rangos se cruzan casi por completo, así que no se puede decir que uno sea realmente más alto. Mientras más pequeño el grupo, más larga la línea.", "Valor p (prueba exacta de Fisher): responde, si en realidad no hubiera diferencia entre los grupos, ¿qué tan probable sería ver una diferencia como la observada, o mayor, solo por azar? Doble titulación y afinidad, p = 0,41: una diferencia de 7 puntos saldría por azar 41 de cada 100 veces. Opción académica e inserción rápida, p = 0,09: una diferencia de 13 puntos saldría por azar 9 de cada 100 veces; es poco común, pero no alcanza el umbral habitual del 5 %, por eso se lee como tendencia.", "Cómo se lee el p: menor a 0,05, diferencia significativa (es poco probable que sea azar); entre 0,05 y 0,10, tendencia (señal a tener en cuenta, no concluyente); mayor a 0,10, no significativa (la diferencia puede ser azar).", "Precauciones: «no significativo» no es lo mismo que «no hay efecto»; con estos tamaños de grupo no alcanza para afirmarlo. Y un p bajo no indica causa: que la opción académica se asocie con mejor inserción no prueba que la cause, porque quienes toman opción pueden tener otras características que les ayudan."], "full": true}, {"titulo": "¿La práctica o el tiempo para graduarse cambian los resultados laborales?", "cab": ["Resultado", "Grupo 1 (k)", "Grupo 1 (n)", "Grupo 2 (k)", "Grupo 2 (n)", "Grupo 3 (k)", "Grupo 3 (n)"], "filas": [["Práctica | Alguna vez en Antropología", 34, 57, 32, 80, 6, 12], ["Práctica | Inserción ≤ 6 meses", 48, 65, 59, 88, 13, 14], ["Práctica | Empleo actual", 40, 57, 48, 80, 10, 12], ["Tiempo para el grado | Alguna vez en Antropología", 33, 68, 17, 33, 22, 48], ["Tiempo para el grado | Inserción ≤ 6 meses", 59, 75, 26, 35, 35, 57], ["Tiempo para el grado | Empleo actual", 44, 68, 25, 33, 29, 48]], "nota": "Solo empleo profesional. Líneas negras = IC 95 % (Wilson). p = Fisher contra el grupo de referencia (el primero); en rojo si p < 0,10. Afinidad y empleo actual: solo LinkedIn; inserción ≤ 6 meses: LinkedIn + encuesta.", "tema": "I6b. Práctica y tiempo de grado", "analisis": "• Práctica (referencia: sin práctica): quienes hicieron práctica sin continuidad tienen menos afinidad (40 %, p = 0,03). Quienes continuaron insertan más rápido (93 %, p = 0,17), pero son muy pocos y su intervalo es muy amplio.\n• Tiempo para el grado (referencia: a tiempo): con 2 o más semestres adicionales la inserción rápida baja a 61 % (p = 0,03). En afinidad y empleo actual no hay diferencias claras.\n• Diferencias con p < 0,10: práctica sin continuidad en afinidad y 2+ semestres adicionales en inserción.\n• Mismas reglas de lectura que en la nota de I6a: un p bajo indica que la diferencia es poco probable por azar, pero no prueba causa.", "tipo": "barras_ic", "ic": {"modo": "ref", "paneles": {"Práctica": {"grupos": ["Sin práctica", "Práctica sin continuidad", "Práctica con continuidad"], "colores": ["#b0b0b0", "#81c784", "#2e7d32"]}, "Tiempo para el grado": {"grupos": ["A tiempo", "1 semestre adicional", "2+ semestres adicionales"], "colores": ["#b0b0b0", "#64b5f6", "#1565c0"]}}}, "sinComparar": true, "full": true, "slices": {"T|T": {"filas": [["Práctica | Alguna vez en Antropología", 34, 57, 32, 80, 6, 12], ["Práctica | Inserción ≤ 6 meses", 48, 65, 59, 88, 13, 14], ["Práctica | Empleo actual", 40, 57, 48, 80, 10, 12], ["Tiempo para el grado | Alguna vez en Antropología", 33, 68, 17, 33, 22, 48], ["Tiempo para el grado | Inserción ≤ 6 meses", 59, 75, 26, 35, 35, 57], ["Tiempo para el grado | Empleo actual", 44, 68, 25, 33, 29, 48]], "n": 190}, "T|2021": {"filas": [["Práctica | Alguna vez en Antropología", 9, 12, 4, 10, 0, 0], ["Práctica | Inserción ≤ 6 meses", 10, 15, 5, 10, 0, 0], ["Práctica | Empleo actual", 10, 12, 8, 10, 0, 0], ["Tiempo para el grado     const seg = el("span", {class: "dv-seg",
      style: `width:${w}%;background:${COLORES[i % 5]};` + (n < 0 ? "right:50%" : "left:50%")});
    const num = el("span", {class: "dv-num", style: n < 0 ? "left:2px" : "right:2px"}, (n > 0 ? "+" : "") + fmt(n));
    return el("div", {class: "dv-track"}, seg, num);
  };
  const rows = g.filas.map((f) => el("div", {class: "dv-row"},
    el("div", {class: "dv-lab"}, String(f[0])),
    el("div", {class: "dv-bars"}, ...f.slice(1).map((v, i) => barra(v, i)))));
  return el("div", {class: "dv"}, el("div", {}, ...rows), leyenda(g));
}

// Estadística para las barras con intervalo de confianza (I6a, I6b): Wilson al 95 % y prueba exacta de Fisher.
function wilson(k, n) {
  const z = 1.959964, p = k / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - h) * 100, Math.min(1, c + h) * 100];
}
const _lf = (() => { const t = [0]; for (let i = 1; i <= 1000; i++) t[i] = t[i - 1] + Math.log(i); return t; })();
function fisher(a, b, c, d) {
  const n = a + b + c + d, r1 = a + b, c1 = a + c;
  const lp = (x) => _lf[r1] + _lf[n - r1] + _lf[c1] + _lf[n - c1] - _lf[n] - _lf[x] - _lf[r1 - x] - _lf[c1 - x] - _lf[n - r1 - c1 + x];
  const lo = Math.max(0, c1 - (n - r1)), hi = Math.min(r1, c1), po = lp(a);
  let s = 0;
  for (let x = lo; x <= hi; x++) if (lp(x) <= po + 1e-7) s += Math.exp(lp(x));
  return Math.min(1, s);
}

function barrasIC(g) {
  // Barras agrupadas por resultado, con intervalo de confianza del 95 %, n/denominador en cada barra y p de Fisher.
  // Cada fila: ["Panel | Resultado", k1, n1, k2, n2, ...]. modo "par": Con vs Sin; modo "ref": cada grupo vs el primero.
  const cfg = g.ic, wrap = el("div", {class: "bic"});
  const pc2 = (v) => v.toFixed(2).replace(".", ",");
  const paneles = [...new Set(g.filas.map((f) => String(f[0]).split(" | ")[0]))];
  for (const pn of paneles) {
    const pc = cfg.paneles[pn], G = pc.grupos.length;
    const filas = g.filas.filter((f) => String(f[0]).split(" | ")[0] === pn);
    const W = cfg.ancho ? 760 : 380, H = 262, x0 = 34, x1 = W - 8, yb = 205, yt = 30, esc = 125;
    const Y = (v) => yb - (yb - yt) * v / esc;
    const cw = (x1 - x0) / filas.length, bw = (cw - 22) / G;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${pn}" style="width:100%;height:auto;max-width:${cfg.ancho ? 980 : 540}px">`;
    for (let t = 0; t <= 100; t += 20)
      s += `<line x1="${x0}" x2="${x1}" y1="${Y(t)}" y2="${Y(t)}" stroke="currentColor" stroke-opacity=".12"/>` +
           `<text x="${x0 - 4}" y="${Y(t) + 3}" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".6">${t}</text>`;
    filas.forEach((f, ci) => {
      const met = String(f[0]).split(" | ")[1];
      const cx0 = x0 + ci * cw + 11;
      const datos = pc.grupos.map((_, gi) => ({k: f[1 + 2 * gi], n: f[2 + 2 * gi]}));
      let topCluster = 0;
      datos.forEach((d, gi) => {
        if (!d.n) return;
        const pct = 100 * d.k / d.n, [lo, hi] = wilson(d.k, d.n);
        const x = cx0 + gi * bw, xc = x + bw / 2;
        topCluster = Math.max(topCluster, hi);
        s += `<rect x="${x + 1}" y="${Y(pct)}" width="${bw - 2}" height="${yb - Y(pct)}" fill="${pc.colores[gi]}"/>` +
             `<line x1="${xc}" x2="${xc}" y1="${Y(lo)}" y2="${Y(hi)}" stroke="currentColor" stroke-opacity=".75"/>` +
             `<line x1="${xc - 3}" x2="${xc + 3}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="currentColor" stroke-opacity=".75"/>` +
             `<line x1="${xc - 3}" x2="${xc + 3}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="currentColor" stroke-opacity=".75"/>` +
             `<text x="${xc}" y="${yb - 3}" font-size="8" text-anchor="middle" fill="#222" stroke="#fff" stroke-width="2.5" paint-order="stroke">${d.k}/${d.n}</text>`;
        let etq = `${Math.round(pct)}%`, linea2 = "", rojo = false;
        if (cfg.modo === "ref") {
          if (gi === 0) linea2 = "(ref.)";
          else if (datos[0].n) {
            const p = fisher(d.k, d.n - d.k, datos[0].k, datos[0].n - datos[0].k);
            linea2 = "p=" + pc2(p); rojo = p < 0.10;
          }
        }
        s += `<text x="${xc}" y="${Y(hi) - 4}" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">${etq}</text>`;
        if (linea2) s += `<text x="${xc}" y="${Y(hi) - 15}" font-size="8" text-anchor="middle" font-style="italic" fill="${rojo ? "#c62828" : "currentColor"}" fill-opacity="${rojo ? 1 : .75}">${linea2}</text>`;
      });
      if (cfg.modo === "par" && datos.every((d) => d.n)) {
        const p = fisher(datos[0].k, datos[0].n - datos[0].k, datos[1].k, datos[1].n - datos[1].k);
        const lect = p < 0.05 ? "significativa" : (p < 0.10 ? "tendencia" : "no significativa");
        const cx = cx0 + bw, yy = Y(topCluster) - 20;
        if (datos[0].n < 10) s += `<text x="${cx}" y="${yy - 22}" font-size="8.5" font-weight="700" text-anchor="middle" fill="#c62828">muy pocos casos</text>`;
        s += `<text x="${cx}" y="${yy - 10}" font-size="8.5" text-anchor="middle" font-style="italic" fill="${p < 0.10 ? "#c62828" : "currentColor"}">p = ${pc2(p)}</text>` +
             `<text x="${cx}" y="${yy}" font-size="8" text-anchor="middle" font-style="italic" fill="${p < 0.10 ? "#c62828" : "currentColor"}" fill-opacity=".85">(${lect})</text>`;
      }
      const palabras = met.split(" "), l1 = [], l2 = [];
      palabras.forEach((w) => ((l1.join(" ") + " " + w).length <= 16 && !l2.length ? l1 : l2).push(w));
      const cxm = x0 + ci * cw + cw / 2;
      s += `<text x="${cxm}" y="${yb + 14}" font-size="9" text-anchor="middle" fill="currentColor">${l1.join(" ")}</text>`;
      if (l2.length) s += `<text x="${cxm}" y="${yb + 25}" font-size="9" text-anchor="middle" fill="currentColor">${l2.join(" ")}</text>`;
    });
    s += "</svg>";
    const caja = el("div", {class: "bic-panel"}, el("h4", {class: "bic-t"}, pn));
    const sv = el("div", {}); sv.innerHTML = s; caja.append(sv);
    caja.append(el("div", {class: "legend"}, pc.grupos.map((nm, i) =>
      el("span", {}, el("i", {style: `background:${pc.colores[i]}`}), nm + (cfg.modo === "ref" && i === 0 ? " (referencia)" : "")))));
    wrap.append(caja);
  }
  return wrap;
}

// Mapa de burbujas (I3): inserción en ≤ 6 meses (x) vs afinidad con Antropología (y); tamaño = n; cuadrantes según
// los promedios generales (primera fila "Total"). Cada fila: ["Tipo | Grupo", n, k inserción, k afinidad, k directo].
function burbujasDatos(g) {
  const tot = g.filas.find((f) => String(f[0]).startsWith("Total | "));
  const pct = (k, n) => (n ? 100 * k / n : 0);
  const pi = tot ? pct(tot[2], tot[1]) : 0, pa = tot ? pct(tot[3], tot[1]) : 0;
  const items = g.filas.filter((f) => f !== tot).map((f) => {
    const [tp, grupo] = String(f[0]).split(" | ");
    const n = f[1], ins = pct(f[2], n), afin = pct(f[3], n), dir = pct(f[4], n);
    const perfil = ins >= pi && afin >= pa ? "Más inserción y más afinidad"
      : ins >= pi ? "Más inserción y menos afinidad"
      : afin >= pa ? "Menos inserción y más afinidad" : "Menos de ambas";
    return {tipo: tp, grupo, n, ins, afin, dir, perfil};
  }).filter((d) => d.n >= (g.minN || 1));
  return {pi, pa, items};
}

function burbujasTabla(g) {
  const d = burbujasDatos(g), r1 = (v) => (Math.round(v * 10) / 10).toFixed(1).replace(".", ",");
  const filas = d.items.slice().sort((a, b) => b.ins - a.ins || b.afin - a.afin)
    .map((x) => [x.tipo, x.grupo, x.n, r1(x.ins), r1(x.afin), r1(x.dir), x.perfil]);
  return {...g, cab: ["Tipo", "Grupo", "n", "% inserción", "% afinidad", "% alguna vez cargo directo", "Perfil"], filas};
}

function burbujas(g) {
  const {pi, pa, items} = burbujasDatos(g);
  if (!items.length) return el("div", {class: "vacio"}, "Sin grupos con suficientes personas para este filtro.");
  const W = 760, H = 520, x0 = 52, x1 = 746, y0 = 14, y1 = 470;
  const xmin = Math.max(0, Math.floor((Math.min(...items.map((d) => d.ins)) - 10) / 10) * 10), xmax = 120;
  const ymin = Math.max(0, Math.min(...items.map((d) => d.afin)) - 15), ymax = 115;
  const X = (v) => x0 + (x1 - x0) * (v - xmin) / (xmax - xmin), Y = (v) => y1 - (y1 - y0) * (v - ymin) / (ymax - ymin);
  const COL = {"Doble programa": "#f28e2b", "Opción": "#1f77b4"};
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dobles programas y opciones: inserción vs afinidad" style="width:100%;height:auto">`;
  s += `<rect x="${X(pi)}" y="${Y(ymax)}" width="${X(100) - X(pi)}" height="${Y(pa) - Y(ymax)}" fill="#2e7d32" fill-opacity=".12"/>`;
  for (let t = Math.ceil(xmin / 10) * 10; t <= 100; t += 10)
    s += `<text x="${X(t)}" y="${y1 + 14}" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">${t}</text>`;
  for (let t = Math.ceil(ymin / 10) * 10; t <= 100; t += 10)
    s += `<text x="${x0 - 6}" y="${Y(t) + 3}" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".7">${t}</text>`;
  s += `<line x1="${X(pi)}" x2="${X(pi)}" y1="${y0}" y2="${y1}" stroke="currentColor" stroke-dasharray="2 3" stroke-opacity=".6"/>` +
       `<line x1="${x0}" x2="${x1}" y1="${Y(pa)}" y2="${Y(pa)}" stroke="currentColor" stroke-dasharray="2 3" stroke-opacity=".6"/>`;
  s += `<text x="${X(pi) + 4}" y="${y1 - 3}" font-size="9" fill="currentColor" fill-opacity=".7">Promedio inserción ${Math.round(pi)}%</text>` +
       `<text x="${x0 + 4}" y="${Y(pa) - 4}" font-size="9" fill="currentColor" fill-opacity=".7">Promedio afinidad ${Math.round(pa)}%</text>`;
  const ocupados = [];
  const rect = (x, y, w, h) => ({x0: x, y0: y, x1: x + w, y1: y + h});
  const cuad = [
    ["Más inserción y más afinidad", X(99), Y(ymax - 2), "end", "#1b5e20", "#c8e6c9", 1],
    ["Menos inserción y más afinidad", X(pi) - 6, Y(ymax - 2), "end", "#6a1b9a", "#f3e5f5", 1],
    ["Menos inserción y menos afinidad", X(pi) - 6, y1 - 22, "end", "#b71c1c", "#ffebee", 0],
    ["Más inserción y menos afinidad", X(99), y1 - 22, "end", "#e65100", "#fff3e0", 0]];
  for (const [txt, cx, cy, anc, col, fondo, arriba] of cuad) {
    const w = txt.length * 6.1 + 12, h = 18, xx = anc === "end" ? cx - w : cx;
    s += `<rect x="${xx}" y="${cy}" width="${w}" height="${h}" rx="4" fill="${fondo}" stroke="${col}"/>` +
         `<text x="${xx + w / 2}" y="${cy + 12.5}" font-size="10.5" font-weight="700" text-anchor="middle" fill="${col}">${txt}</text>`;
    ocupados.push(rect(xx, cy, w, h));
  }
  // burbujas: las categorías con exactamente el mismo punto se separan un poco y comparten etiqueta
  const clusters = new Map();
  items.forEach((d) => { const k = d.ins.toFixed(1) + "|" + d.afin.toFixed(1); (clusters.get(k) || clusters.set(k, []).get(k)).push(d); });
  const rad = (n) => 2.6 * Math.sqrt(n) + 3;
  const info = [];
  for (const grp of clusters.values()) {
    const k = grp.length, cx0 = X(grp[0].ins), cy = Y(grp[0].afin);
    grp.forEach((d, j) => {
      const cx = cx0 + (j - (k - 1) / 2) * 14, r = rad(d.n);
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${COL[d.tipo]}" fill-opacity=".75" stroke="#000" stroke-width=".6"/>`;
      ocupados.push(rect(cx - r, cy - r, 2 * r, 2 * r));
    });
    info.push({cx: cx0, cy, k, rmax: Math.max(...grp.map((d) => rad(d.n))) + (k - 1) * 7,
      lineas: grp.map((d) => `${d.grupo} (${d.tipo === "Doble programa" ? "DP" : "Op"}, n=${d.n})`)});
  }
  const cands = (r) => [[r + 4, -4], [r + 4, 12], [-(r + 4), -4], [-(r + 4), 12], [0, -(r + 8)], [0, r + 20],
    [r + 14, -26], [-(r + 14), -26], [r + 14, 30], [-(r + 14), 30], [r + 36, -8], [-(r + 36), -8], [0, -(r + 30)], [0, r + 38]];
  const choca = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  for (const c of info.sort((a, b) => a.cy - b.cy || b.cx - a.cx)) {
    const w = Math.max(...c.lineas.map((t) => t.length)) * 5.1 + 6, h = c.lineas.length * 11.5 + 4;
    let elegido = null;
    for (const [dx, dy] of cands(c.rmax)) {
      const xx = dx > 0 ? c.cx + dx : dx < 0 ? c.cx + dx - w : c.cx - w / 2;
      const yy = dy > 0 ? c.cy + dy - h + 4 : dy < 0 ? c.cy + dy - h + 4 : c.cy - h / 2;
      const rc = rect(xx, yy, w, h);
      if (rc.x0 >= x0 && rc.x1 <= x1 + 8 && rc.y0 >= y0 && rc.y1 <= y1 && !ocupados.some((o) => choca(rc, o))) { elegido = rc; break; }
    }
    if (!elegido) { const [dx, dy] = cands(c.rmax)[0]; elegido = rect(c.cx + dx, c.cy + dy - h + 4, w, h); }
    ocupados.push(elegido);
    s += `<rect x="${elegido.x0}" y="${elegido.y0}" width="${w}" height="${h}" rx="3" fill="#fff" fill-opacity=".85"/>`;
    c.lineas.forEach((t, i) => { s += `<text x="${elegido.x0 + 3}" y="${elegido.y0 + 10 + i * 11.5}" font-size="9.5" fill="#222">${t}</text>`; });
  }
  s += `<text x="${(x0 + x1) / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="currentColor">% inserción en ≤ 6 meses</text>` +
       `<text transform="rotate(-90)" x="${-(y0 + y1) / 2}" y="14" font-size="11" text-anchor="middle" fill="currentColor">% que ha trabajado alguna vez en Antropología</text></svg>`;
  const cont = el("div", {}); cont.innerHTML = s;
  return el("div", {class: "bbl"}, cont, el("div", {class: "legend"},
    el("span", {}, el("i", {style: "background:#f28e2b"}), "Doble programa (DP)"),
    el("span", {}, el("i", {style: "background:#1f77b4"}), "Opción académica (Op)"),
    el("span", {}, "Tamaño de la burbuja = n")));
}

// Demanda vs perfil (I5): para cada familia de habilidades, % de avisos (naranja) y % de perfiles Uniandes (azul),
// unidos por una línea. Cada fila: [familia, % avisos, % perfiles, 1 si está en el top 100 de aptitudes, brecha].
function dumbbell(g) {
  const filas = g.filas, n = filas.length, W = 760, rowH = 34, x0 = 270, x1 = 735, top = 14, H = top + n * rowH + 30;
  // el eje arranca en un valor negativo para dejar espacio a la etiqueta «fuera del top 100» de los puntos en 0 %
  const max = Math.max(...filas.flatMap((f) => [f[1], f[2]])) + 6, xmin = -17, X = (v) => x0 + (x1 - x0) * (v - xmin) / (max - xmin);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Demanda de habilidades frente al perfil de antropólogos Uniandes" style="width:100%;height:auto">`;
  for (let t = 0; t <= max; t += 10)
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="${top}" y2="${H - 24}" stroke="currentColor" stroke-opacity=".1"/>` +
         `<text x="${X(t)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">${t}%</text>`;
  filas.forEach((f, i) => {
    const y = top + i * rowH + rowH / 2, a = f[1], p = f[2], top100 = f[3] === "Sí";
    const menor = Math.min(a, p), mayor = Math.max(a, p);
    s += `<text x="${x0 - 12}" y="${y + 4}" font-size="11.5" text-anchor="end" fill="currentColor">${f[0]}</text>` +
         `<line x1="${X(menor)}" x2="${X(mayor)}" y1="${y}" y2="${y}" stroke="#b0b0b0" stroke-width="2.5"/>` +
         `<circle cx="${X(p)}" cy="${y}" r="5" fill="#1f77b4"/><circle cx="${X(a)}" cy="${y}" r="5" fill="#f28e2b"/>`;
    const etqP = top100 ? `${Math.round(p)}%` : "fuera del top 100", etqA = g.n_av ? `${Math.round(a)}% (${Math.round(a * g.n_av / 100)}/${g.n_av})` : `${Math.round(a)}%`;
    const izq = p <= a ? {v: p, t: etqP, c: "#1f77b4"} : {v: a, t: etqA, c: "#f28e2b"};
    const der = p <= a ? {v: a, t: etqA, c: "#f28e2b"} : {v: p, t: etqP, c: "#1f77b4"};
    s += `<text x="${X(izq.v) - 9}" y="${y + 4}" font-size="10.5" font-weight="700" text-anchor="end" fill="${izq.c}">${izq.t}</text>` +
         `<text x="${X(der.v) + 9}" y="${y + 4}" font-size="10.5" font-weight="700" text-anchor="start" fill="${der.c}">${der.t}</text>`;
  });
  s += "</svg>";
  const cont = el("div", {}); cont.innerHTML = s;
  return el("div", {class: "bbl"}, el("div", {class: "legend"},
    el("span", {}, el("i", {style: "background:#1f77b4"}), "Perfil Uniandes"), el("span", {}, el("i", {style: "background:#f28e2b"}), "Avisos")), cont);
}

function dibujar(g, modo) {
  if (tipo(g) === "texto") return texto(g);
  if (tipo(g) === "tarjetas" && modo !== "tabla") return tarjetas(g);
  if (tipo(g) === "dumbbell" && modo !== "tabla") return dumbbell(g);
  if (tipo(g) === "burbujas") return modo === "tabla" ? tabla(burbujasTabla(g)) : burbujas(g);
  if (tipo(g) === "barras_ic" && modo !== "tabla") return barrasIC(g);
  if (tipo(g) === "divergente" && modo !== "tabla") return divergente(g);
  if (tipo(g) === "apilada" && modo !== "tabla") return apilada(g);
  if (tipo(g) === "heatmap" && modo !== "tabla") return heatmap(g);
  if (modo === "tabla" || tipo(g) === "tabla") return tabla(g);
  if (tipo(g) === "cajas") return cajas(g);
  if (tipo(g) === "imagen") return imagen(g);
  if (tipo(g) === "torta") return torta(g);
  const base = tipo(g) === "vertical" ? vertical(g) : horizontal(g);
  const lg = leyenda(g);
  return el("div", {}, lg, base);
}

function csv(g) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = [g.cab, ...g.filas].map((f) => f.map(esc).join(",")).join("\n");
  const a = el("a", {href: URL.createObjectURL(new Blob(["﻿" + txt], {type: "text/csv;charset=utf-8"})),
                     download: g.titulo.replace(/[^\w]+/g, "_").slice(0, 60) + ".csv"});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function ampliar(g, modo) {
  $("#vt").textContent = g.titulo;
  $("#vn").textContent = g.nota;
  const c = $("#vc");
  c.replaceChildren(dibujar(g, modo));
  $("#ventana").showModal();
}

function color(f) { return "var(--accent)"; }

// --- Filtros por genero y año (multi-año y comparar Mujeres vs Hombres) ---
const ANIOS = ["2021", "2022", "2023", "2024", "2025"];
// sexo: "T" | "F" | "M"; anios: Set vacío = todos; comparar: muestra Mujeres vs Hombres lado a lado.
const FILTRO = {sexo: "T", anios: new Set(), comparar: false};
function aniosSel() { return (FILTRO.anios.size === 0) ? ANIOS.slice() : ANIOS.filter((a) => FILTRO.anios.has(a)); }
function sexosSel() { return FILTRO.sexo === "T" ? ["F", "M"] : [FILTRO.sexo]; }

// Suma (o promedia, si avg) las celdas base seleccionadas, respetando el orden de la vista completa (T|T).
function mezclar(g, pares) {
  // las celdas con g.disp guardan más columnas (conteos) que g.cab; se dimensiona por la fila guardada
  const ncol = ((g.slices["T|T"].filas || [])[0] || []).length - 1, orden = (g.slices["T|T"].filas || []).map((f) => String(f[0]));
  const acc = new Map(), peso = new Map();
  let n = 0;
  for (const k of pares) {
    const c = g.slices[k]; if (!c) continue; n += c.n;
    for (const fila of c.filas) {
      const lab = String(fila[0]); if (!acc.has(lab)) { acc.set(lab, new Array(Math.max(ncol, fila.length - 1)).fill(0)); peso.set(lab, 0); }
      const a = acc.get(lab);
      for (let j = 0; j < fila.length - 1; j++) { const v = fila[j + 1]; if (typeof v === "number") a[j] += g.avg ? v * c.n : v; }
      peso.set(lab, peso.get(lab) + c.n);
    }
  }
  const labels = orden.filter((l) => acc.has(l)).concat([...acc.keys()].filter((l) => !orden.includes(l)));
  let filas = labels.map((l) => {
    const a = acc.get(l), w = peso.get(l) || 1;
    return [l, ...a.map((v) => g.avg ? Math.round(v / w) : v)];
  });
  if (g.topN) filas = filas.slice(0, g.topN);
  return {filas, n};
}
// Modo comparar: valor por categoría para Mujeres y Hombres (el % de g.disp, o el total si es conteo).
function comparar(g) {
  const years = aniosSel(), orden = (g.slices["T|T"].filas || []).map((f) => String(f[0]));
  const tot = (sx) => {
    const m = new Map(); let n = 0;
    for (const a of years) { const c = g.slices[sx + "|" + a]; if (!c) continue; n += c.n;
      for (const fila of c.filas) { const lab = String(fila[0]);
        const cur = m.get(lab) || new Array(fila.length - 1).fill(0);
        for (let j = 1; j < fila.length; j++) if (typeof fila[j] === "number") cur[j - 1] += fila[j];
        m.set(lab, cur); } }
    return {m, n};
  };
  const valor = (cols) => {
    if (g.disp) { const d = g.disp[0];
      if ("sum" in d) return cols[d.sum - 1];
      const [n, de] = d.pct; return cols[de - 1] ? Math.round(1000 * cols[n - 1] / cols[de - 1]) / 10 : 0; }
    if (g.avg) { return 0; }   // (los promedios no se comparan por total)
    return cols.reduce((a, b) => a + (typeof b === "number" ? b : 0), 0);
  };
  const F = tot("F"), M = tot("M");
  let labels = orden.filter((l) => F.m.has(l) || M.m.has(l));
  for (const l of [...F.m.keys(), ...M.m.keys()]) if (!labels.includes(l)) labels.push(l);
  let filas = labels.map((l) => [l, F.m.has(l) ? valor(F.m.get(l)) : 0, M.m.has(l) ? valor(M.m.get(l)) : 0]);
  if (g.topN) filas = filas.slice(0, g.topN);
  return {cab: [g.cab[0], "Mujeres", "Hombres"], filas, n: F.n + M.n};
}
// Convierte filas de conteos a filas de visualización (% o sumas) según g.disp.
function aplicarDisp(g, filas) {
  return filas.map((row) => {
    const out = [row[0]]; out.ab = [];
    for (const d of g.disp) {
      if ("sum" in d) { out.push(row[d.sum]); out.ab.push(null); }
      else { const [n, de] = d.pct; out.push(row[de] ? Math.round(1000 * row[n] / row[de]) / 10 : 0); out.ab.push([row[n], row[de]]); }
    }
    return out;
  });
}
function aplicarRebanadas(f) {
  const ss = sexosSel(), years = aniosSel();
  for (const g of f.graficas) {
    if (!g.slices) continue;
    if (!g._cab0) { g._cab0 = g.cab.slice(); g._tipo0 = g.tipo; }
    g.cab = g._cab0.slice(); g.tipo = g._tipo0;           // restaurar antes de cada render
    if (FILTRO.comparar && !g.sinComparar) {
      const r = comparar(g); g.cab = r.cab; g.tipo = undefined; g.filas = r.filas; g._n = r.n;
    } else {
      // atajo exacto cuando la selección coincide con una celda precalculada
      const ak = (years.length === 5) ? "T" : (years.length === 1 ? years[0] : null);
      const sk = (ss.length === 2) ? "T" : ss[0];
      let raw;
      if (ak !== null && g.slices[sk + "|" + ak]) { const c = g.slices[sk + "|" + ak]; raw = {filas: c.filas, n: c.n}; }
      else { const pares = []; for (const s of ss) for (const a of years) pares.push(s + "|" + a); raw = mezclar(g, pares); }
      g._n = raw.n;
      g.filas = g.disp ? aplicarDisp(g, raw.filas) : raw.filas;
    }
  }
}
// Valor de una tarjeta KPI segun el filtro actual (si tiene datos por rebanada); si no, el valor fijo.
function kpiNum(f, k) {
  if (!k.kpi || !f.kpi_slices) return k.num;
  const ss = sexosSel(), years = aniosSel();
  let num = 0, den = 0;
  for (const s of ss) for (const a of years) {
    const c = f.kpi_slices[s + "|" + a]; if (!c || !c.filas) continue;
    const row = c.filas.find((r) => r[0] === k.kpi); if (!row) continue;
    num += row[1]; den += row[2];
  }
  if (k.fmt === "count") return String(num);
  if (!den) return "–";
  return k.fmt === "pct" ? (Math.round(1000 * num / den) / 10).toFixed(1).replace(".", ",") + " %" : num + " / " + den;
}
// Conteo bajo una tarjeta de porcentaje ("k de n"), segun el filtro actual.
function kpiSub(f, k) {
  if (!k.kpi || !f.kpi_slices || k.fmt !== "pct") return null;
  let num = 0, den = 0;
  for (const s of sexosSel()) for (const a of aniosSel()) {
    const c = f.kpi_slices[s + "|" + a]; if (!c || !c.filas) continue;
    const row = c.filas.find((r) => r[0] === k.kpi); if (row) { num += row[1]; den += row[2]; }
  }
  return den ? el("div", {class: "kpi-sub"}, `${num} de ${den}`) : null;
}
function barraFiltros(f) {
  const bar = el("div", {class: "filtros"});
  const gen = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Género"));
  [["T", "Ambos"], ["F", "Mujeres"], ["M", "Hombres"]].forEach(([v, txt]) => gen.append(
    el("button", {class: "fbtn" + (!FILTRO.comparar && FILTRO.sexo === v ? " on" : ""),
      onclick: () => { FILTRO.sexo = v; FILTRO.comparar = false; ir(f.id, true); }}, txt)));
  gen.append(el("button", {class: "fbtn comparar" + (FILTRO.comparar ? " on" : ""),
    onclick: () => { FILTRO.comparar = !FILTRO.comparar; ir(f.id, true); }}, "⇄ Comparar M/H"));
  bar.append(gen);
  const an = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Año de grado"));
  an.append(el("button", {class: "fbtn" + (FILTRO.anios.size === 0 ? " on" : ""),
    onclick: () => { FILTRO.anios.clear(); ir(f.id, true); }}, "Todos"));
  ANIOS.forEach((a) => an.append(el("button", {class: "fbtn" + (FILTRO.anios.has(a) ? " on" : ""),
    onclick: () => { FILTRO.anios.has(a) ? FILTRO.anios.delete(a) : FILTRO.anios.add(a);
                     if (FILTRO.anios.size === ANIOS.length) FILTRO.anios.clear(); ir(f.id, true); }}, a)));
  bar.append(an);
  bar.append(el("p", {class: "fhint"},
    FILTRO.comparar
      ? "Comparando Mujeres vs Hombres (total por categoría). Puedes combinar varios años; con muy pocos casos se oculta por privacidad."
      : "Puedes elegir varios años a la vez. Muestra el n del subgrupo; con muy pocos casos se oculta por privacidad."));
  return bar;
}

function tarjeta(g) {
  let modo = "grafica";
  const vacio = g.slices && (!g.filas || g.filas.length === 0);
  const cuerpo = el("div", {}, vacio
    ? el("div", {class: "vacio"}, "Muestra demasiado pequeña para este filtro; se oculta por privacidad.")
    : dibujar(g, modo));
  const bt = el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
    modo = modo === "grafica" ? "tabla" : "grafica";
    e.currentTarget.setAttribute("aria-pressed", modo === "tabla");
    e.currentTarget.textContent = modo === "tabla" ? "Ver gráfica" : "Ver tabla";
    cuerpo.replaceChildren(dibujar(g, modo));
  }}, "Ver tabla");
  if (tipo(g) === "tabla" || tipo(g) === "cajas" || tipo(g) === "texto" || vacio) bt.style.display = "none";
  const badge = g.slices
    ? el("p", {class: "nmini"}, `n = ${g._n}`, g._n > 0 && g._n < 20
        ? el("span", {class: "peque"}, "  ·  muestra pequeña") : null)
    : null;
  // Panel de "Ver análisis": la lectura de resultados del notebook, oculta hasta pulsar el botón.
  const ana = g.analisis
    ? el("div", {class: "analisis", hidden: true}, g.analisis.split("\n").map((l) =>
        el("p", {class: l.trim().startsWith("•") ? "ana-b" : "ana-p"}, l.replace(/^\s*•\s*/, ""))))
    : null;
  const bta = g.analisis
    ? el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
        const mostrar = ana.hidden; ana.hidden = !mostrar;
        e.currentTarget.setAttribute("aria-pressed", mostrar);
        e.currentTarget.textContent = mostrar ? "Ocultar análisis" : "Ver análisis";
      }}, "Ver análisis")
    : null;
  const comp = g.complemento
    ? el("div", {class: "analisis comp", hidden: true},
        el("p", {class: "ana-p"}, el("b", {}, g.complemento.titulo)),
        el("p", {class: "ana-p"}, g.complemento.nota), tabla({cab: g.complemento.cab, filas: g.complemento.filas}))
    : null;
  const btc = comp
    ? el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
        const mostrar = comp.hidden; comp.hidden = !mostrar;
        e.currentTarget.setAttribute("aria-pressed", mostrar);
        e.currentTarget.textContent = mostrar ? "Ocultar mapeo" : g.complemento.boton;
      }}, g.complemento.boton)
    : null;
  return el("article", {class: "card chart-card" + ((tipo(g) === "texto" || g.full) ? " full" : ""),
      style: g.acento ? `border-top-color:${g.acento}` : ""},
    el("h3", {}, g.titulo), badge, cuerpo, g.nota ? el("p", {class: "nota"}, g.nota) : null, ana, comp,
    el("div", {class: "tools"}, bt, bta, btc,
      el("button", {class: "ghost", onclick: () => ampliar(g, modo)}, "Ampliar"),
      el("button", {class: "ghost", onclick: () => csv(g)}, "Descargar CSV")));
}

function vistaFuente(f) {
  const cont = el("div", {style: `--fa:${color(f)}`});
  cont.append(el("div", {class: "panel card", style: "border-top:3px solid var(--accent)"}, el("h2", {}, f.titulo), el("div", {class: "sub"}, f.fuente.split(".")[0])));
  if (f.intro || f.intro_kpis) {
    const sec = el("section", {class: "panel card intro-f"});
    if (f.intro_kpis) sec.append(el("div", {class: "kpis intro-kpis"}, f.intro_kpis.map((k) =>
      el("div", {class: "kpi"}, el("div", {class: "kpi-num"}, kpiNum(f, k)), el("div", {class: "kpi-lab"}, k.lab), kpiSub(f, k)))));
    if (f.intro) f.intro.split("\n\n").forEach((p) => sec.append(el("p", {}, p)));
    cont.append(sec);
  }
  const hayFiltro = f.graficas.some((g) => g.slices);
  if (hayFiltro) { aplicarRebanadas(f); cont.append(barraFiltros(f)); }
  const buscador = el("input", {type: "search", placeholder: "Buscar en las gráficas…", "aria-label": "Buscar"});
  const cuenta = el("span", {class: "sub"});
  if (!f.doc) cont.append(el("div", {class: "barra"}, buscador, cuenta));
  const tarjetas = f.graficas.map((g) => ({g, nodo: tarjeta(g),
    texto: (g.titulo + " " + g.nota + " " + g.filas.map((x) => x[0]).join(" ")).toLowerCase()}));
  const temas = [...new Set(f.graficas.map((g) => g.tema))];
  const secciones = temas.map((tm) => {
    const grilla = el("div", {class: f.doc ? "grid doc" : "grid"});
    const mias = tarjetas.filter((t) => t.g.tema === tm);
    mias.forEach((t) => grilla.append(t.nodo));
    const sec = el("section", {class: "tema", id: "tema-" + temas.indexOf(tm)},
      tm ? el("h2", {class: "tema-t"}, tm, el("span", {}, `${mias.length}`)) : null, grilla);
    return {sec, mias, tm};
  });
  if (temas.length > 1) cont.append(el("div", {class: "chips"}, secciones.map((x) =>
    el("button", {class: "chip", onclick: () => x.sec.scrollIntoView({behavior: "smooth", block: "start"})}, x.tm))));
  const filtrar = () => {
    const q = buscador.value.trim().toLowerCase();
    let n = 0;
    tarjetas.forEach((t) => { const ok = !q || t.texto.includes(q); t.nodo.hidden = !ok; n += ok; });
    secciones.forEach((x) => { x.sec.hidden = x.mias.every((t) => t.nodo.hidden); });
    cuenta.textContent = `${n} de ${tarjetas.length} gráficas`;
  };
  buscador.addEventListener("input", filtrar);
  filtrar();
  secciones.forEach((x) => cont.append(x.sec));
  return cont;
}

function vistaInicio() {
  const stats = [["190", "egresados caracterizados"], ["149", "perfiles de LinkedIn analizados"],
    ["86", "respuestas de la encuesta"], ["175", "vacantes analizadas"]];
  const intro = el("section", {class: "panel card hero"},
    el("h2", {}, "Empleabilidad de los egresados de Antropología"),
    el("p", {class: "sub", style: "margin:0;max-width:62ch"},
      "Trayectoria laboral y formación de los egresados del programa, con datos agregados de LinkedIn, " +
      "bolsas de empleo, registros institucionales y la encuesta de seguimiento. Elige una sección."),
    el("div", {class: "hero-stats"}, ...stats.map(([n, l]) => el("div", {class: "hero-stat"}, el("b", {}, n), el("span", {}, l)))));
  const cont = el("div", {});
  const cardFuente = (f) => el("div", {class: "card", style: `--fa:${color(f)}`}, el("h2", {}, f.pestana),
    el("div", {class: "sub", style: "flex:1"}, f.descripcion || f.fuente.replace("Fuente: ", "")),
    f.clave ? el("p", {class: "clave"}, f.clave) : null,
    el("button", {class: "ghost", onclick: () => ir(f.id)}, "Ver gráficas"));
  const cardSec = (sec) => el("div", {class: "card"}, el("h2", {}, sec.pestana),
    el("div", {class: "sub", style: "flex:1"}, sec.intro || ""),
    el("button", {class: "ghost", onclick: () => ir(sec.id)}, "Abrir"));
  for (const gr of GRUPOS) {
    if (gr.gid === "inicio") continue;
    const items = gr.ids.map((id) => DATA.fuentes.find((x) => x.id === id) ||
      (DATA.secciones_nb || []).find((x) => x.id === id)).filter(Boolean);
    if (!items.length) continue;
    const ga = {fuente: "#364775", integrado: "#F36F0F", recursos: "#2a8a8a"}[gr.gid] || "#364775";
    const ico = {fuente: "📊", integrado: "🔗", recursos: "📚"}[gr.gid] || "";
    cont.append(el("h2", {class: "inicio-grupo", style: `--ga:${ga}`}, el("span", {class: "ico"}, ico), gr.lab));
    if (gr.desc) cont.append(el("p", {class: "inicio-grupo-sub"}, gr.desc));
    const grid = el("div", {class: "inicio", style: `--ga:${ga}`});
    items.forEach((it) => grid.append(DATA.fuentes.includes(it) ? cardFuente(it) : cardSec(it)));
    cont.append(grid);
  }
  const aviso = el("section", {class: "panel card warn", style: "margin-top:16px"}, el("h2", {}, "Antes de interpretar"),
    el("ul", {},
      el("li", {}, "En «Análisis por fuente», cada fuente mide algo distinto y en su propia fecha: no se comparan ni se suman cifras entre fuentes."),
      el("li", {}, "En «Análisis integrado» sí se cruza la información de los egresados (trayectoria académica frente a resultados laborales); con cerca de 150 personas, esas relaciones se leen como señales, no como causas."),
      el("li", {}, "Una persona puede aparecer en varias fuentes o búsquedas."),
      el("li", {}, "Solo hay datos agregados; ninguna gráfica identifica personas.")));
  return el("div", {}, intro, cont, aviso);
}

function vistaSeccionNb(sec) {
  const nbs = sec.items || [];
  const cont = el("div", {});
  cont.append(el("section", {class: "panel card", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, sec.pestana),
    el("p", {class: "sub", style: "margin:0"}, sec.intro || "")));
  if (!nbs.length) { cont.append(el("div", {class: "vacio"}, "Aún no hay contenido disponible.")); return cont; }
  const marco = el("iframe", {class: "nb-frame", title: sec.pestana, loading: "lazy"});
  const embebibles = nbs.filter((n) => n.archivo);
  const cards = el("div", {class: "inicio"});
  const pintar = (nb) => {
    marco.src = nb.archivo;
    cards.querySelectorAll(".card").forEach((c) => c.style.outline = c.dataset.id === nb.id ? "2px solid var(--accent)" : "none");
  };
  nbs.forEach((nb) => {
    const tools = el("div", {class: "tools"});
    if (nb.archivo) {
      tools.append(el("button", {class: "ghost", onclick: () => pintar(nb)}, "Ver aquí"));
      tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.archivo, "_blank", "noopener")}, "Abrir en pestaña nueva"));
    }
    if (nb.url) tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.url, "_blank", "noopener")}, "Abrir en Databricks"));
    cards.append(el("div", {class: "card", "data-id": nb.id, style: "border-top:3px solid var(--accent)"},
      el("h2", {}, nb.titulo), el("div", {class: "sub", style: "flex:1"}, nb.descripcion), tools));
  });
  cont.append(cards);
  if (embebibles.length) { cont.append(marco); pintar(embebibles[0]); }
  return cont;
}

// Navegación de dos niveles: grupos arriba, subpestañas debajo.
const GRUPOS = [
  {gid: "inicio", lab: "Inicio", ids: ["inicio"]},
  {gid: "fuente", lab: "Análisis por fuente",
   desc: "Cada fuente mide algo distinto y en su propia fecha. Aquí va cada una por separado, sin cruzarse entre sí.",
   ids: ["ti", "jobs", "egr", "inst", "encuesta"]},
  {gid: "integrado", lab: "Análisis integrado",
   desc: "Aquí se cruzan las fuentes: la trayectoria académica de los egresados frente a sus resultados laborales.",
   ids: ["contexto", "cruces"]},
  {gid: "recursos", lab: "Recursos",
   desc: "Material de apoyo y cuadernos interactivos sobre los egresados.", ids: ["ficha"]},
];
const ultimoSub = {};
let PORID = new Map();
function grupoDe(id) { return GRUPOS.find((g) => g.ids.includes(id)) || GRUPOS[0]; }

function ir(id, conservar) {
  const y = scrollY;
  const f = DATA.fuentes.find((x) => x.id === id);
  const sec = (DATA.secciones_nb || []).find((x) => x.id === id);
  const activo = f ? id : sec ? sec.id : "inicio";
  const gr = grupoDe(activo);
  ultimoSub[gr.gid] = activo;
  $("#vista").replaceChildren(f ? vistaFuente(f) : sec ? vistaSeccionNb(sec) : vistaInicio());
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.gid === gr.gid));
  const sub = $("#subtabs");
  sub.replaceChildren();
  const subs = gr.ids.filter((sid) => PORID.has(sid));
  if (subs.length > 1) {
    sub.hidden = false;
    subs.forEach((sid) => sub.append(el("button", {role: "tab", "data-id": sid,
      "aria-selected": sid === activo ? "true" : "false", onclick: () => ir(sid)}, PORID.get(sid).pestana)));
  } else {
    sub.hidden = true;
  }
  history.replaceState(null, "", "#" + activo);
  scrollTo(0, conservar ? y : 0);
}

function iniciar() {
  const tabs = $("#tabs");
  PORID = new Map([{id: "inicio", pestana: "Inicio"}, ...DATA.fuentes, ...(DATA.secciones_nb || [])].map((f) => [f.id, f]));
  // Barra superior: solo los grupos. Las subpestañas aparecen debajo al entrar a cada grupo.
  GRUPOS.forEach((gr) => {
    if (!gr.ids.some((id) => PORID.has(id))) return;
    tabs.append(el("button", {role: "tab", "data-gid": gr.gid,
      onclick: () => ir(ultimoSub[gr.gid] || gr.ids.find((id) => PORID.has(id)))}, gr.lab));
  });
  $("#sub").textContent = `Datos agregados de LinkedIn, bolsas de empleo y registros institucionales. Generado el ${DATA.generado}.`;
  $("#pie").textContent = "Fuentes: LinkedIn Talent Insights, Recruiter y Jobs, bolsas de empleo colombianas y registros institucionales. Cifras agregadas, sin datos de personas.";
  $("#cerrar").addEventListener("click", () => $("#ventana").close());
  $("#ventana").addEventListener("click", (e) => { if (e.target.id === "ventana") e.target.close(); });
  const tema = $("#tema");
  const raiz = document.documentElement;
  const oscuro = () => raiz.dataset.theme === "dark" || (!raiz.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const pintar = () => { tema.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  tema.addEventListener("click", () => { raiz.dataset.theme = oscuro() ? "light" : "dark"; pintar(); });
  pintar();
  const cab = document.querySelector("header");
  const altoCab = () => document.documentElement.style.setProperty("--hh", cab.offsetHeight + "px");
  altoCab();
  addEventListener("resize", altoCab);
  if (window.ResizeObserver) new ResizeObserver(altoCab).observe(cab);
  ir(location.hash.slice(1) || "inicio");
}
iniciar();
