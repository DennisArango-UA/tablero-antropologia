<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Antropología</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1C2236; --muted:#4f5a78; --line:#DAE1F2; --accent:#364775; --accent-ink:#ffffff;
  --track:#e9edf7; --warn-bg:#fff4e5; --warn-line:#FECA8E; --hero1:#1C2236; --hero2:#222D4E;
  --c1:#364775; --c2:#F36F0F; --c3:#96B3DF; --c4:#C23319; --c5:#FEAA46;
  --shadow:0 1px 2px rgba(28,34,54,.06),0 2px 8px rgba(28,34,54,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
    --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
    --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
  --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
  --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Verdana,Geneva,sans-serif}
header{background:var(--hero1);color:#fff;position:sticky;top:0;z-index:5;border-bottom:3px solid #F36F0F}
header .sub{color:rgba(255,255,255,.85)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
h1{font-size:clamp(15px,3.2vw,20px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:7px 14px;font:inherit;font-size:13px;color:#DAE1F2;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.12)}
nav button[aria-selected="true"]{background:#fff;color:#1C2236;font-weight:700;border-color:#fff}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-top:-6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav[hidden]{display:none}
.subnav button{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;color:#c4cde6;cursor:pointer;white-space:nowrap}
.subnav button:hover{background:rgba(255,255,255,.1)}
.subnav button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.55);font-weight:700}
.inicio-grupo{font-size:16px;margin:24px 0 2px}
.inicio-grupo-sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:74ch}
.intro-f{margin-bottom:16px}
.intro-kpis{margin:2px 0 14px}
.intro-kpis .kpi{flex:1 1 170px}
.intro-kpis .kpi-num{font-size:26px}
.intro-f p{margin:0 0 8px;font-size:13.5px;line-height:1.55;color:var(--ink);max-width:90ch}
.intro-f p:last-child{margin-bottom:0;color:var(--muted)}
.analisis{margin:10px 0 2px;padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 6px 6px 0}
.analisis p{margin:0 0 6px;font-size:12.5px;line-height:1.5}
.analisis p:last-child{margin-bottom:0}
.analisis .ana-b{padding-left:14px;position:relative}
.analisis .ana-b::before{content:"•";position:absolute;left:2px;color:var(--accent)}
.texto-bloque .txt-p{margin:0 0 9px;font-size:13.5px;line-height:1.55}
.texto-bloque .txt-b{margin:0 0 6px;padding-left:16px;position:relative;font-size:13px;line-height:1.5}
.texto-bloque .txt-b::before{content:"•";position:absolute;left:3px;color:var(--accent)}
.hm-wrap{overflow-x:auto;margin-top:4px}
.hm{border-collapse:collapse;font-size:11.5px;min-width:100%}
.hm th,.hm td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.hm .hm-h{font-weight:600;color:var(--muted);font-size:10.5px;max-width:92px;white-space:normal;line-height:1.2}
.hm .hm-row{text-align:left;font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1}
.hm .hm-esq{background:var(--panel);position:sticky;left:0;z-index:2}
.hm .hm-cell{font-variant-numeric:tabular-nums}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
header button.ghost{background:transparent;color:#DAE1F2;border-color:rgba(255,255,255,.28)}
button.ghost:hover{border-color:var(--accent)}
button.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:20px 0 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel{padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 8px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:3px 0}
.warn{background:var(--warn-bg);border-color:var(--warn-line)}
details.panel summary{cursor:pointer;font-weight:600;font-size:15px}
details.panel[open] summary{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.chart-card{padding:16px 18px 14px;display:flex;flex-direction:column;min-width:0;border-top:3px solid var(--accent)}
.chart-card h3{font-size:13.5px;margin:0 0 2px;line-height:1.3}
.nota{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.clave{font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--fa,var(--accent));background:color-mix(in srgb,var(--fa,var(--accent)) 12%,transparent);border-left:3px solid var(--fa,var(--accent));border-radius:6px;padding:8px 10px;margin:0 0 12px}
.filtros{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:0 0 14px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--panel);box-shadow:var(--shadow)}
.fgrupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flab{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.fbtn{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fbtn.comparar{margin-left:10px}
.fbtn.comparar.on{background:#F36F0F;border-color:#F36F0F;color:#fff}
.fhint{flex-basis:100%;font-size:11.5px;color:var(--muted);margin:0}
.nmini{font-size:11.5px;color:var(--muted);margin:-2px 0 6px}
.nmini .peque{color:var(--accent)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.kpi{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi-num{font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpi-lab{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tema{margin-top:26px;scroll-margin-top:130px}
.tema[hidden]{display:none}
.tema-t{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.tema-t::before{content:"";width:6px;height:22px;border-radius:1px;background:#F36F0F}
.tema-t span{font-size:12px;font-weight:600;background:var(--track);color:var(--muted);border-radius:3px;padding:1px 8px;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search]{flex:1 1 220px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.hbar .pistas{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.pista{display:flex;align-items:center;gap:6px}
.pista .tr{flex:1;background:var(--track);border-radius:2px;height:14px}
.pista .rel{height:100%;border-radius:2px;min-width:3px}
.pista .val{min-width:46px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink)}
.vbar{display:flex;align-items:flex-end;gap:6px;height:240px;padding-top:18px;border-bottom:1px solid var(--line)}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vgrp{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.vgrp div{flex:1;max-width:44px;border-radius:2px 2px 0 0;position:relative;min-height:2px}
.vgrp span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.vlabs{display:flex;gap:6px;margin-top:5px}
.vlabs div{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.pie-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pie{flex:0 0 180px;max-width:180px}
.pie svg{width:100%;height:auto;display:block}
.pie svg path,.pie svg circle{stroke:var(--panel);stroke-width:1.5}
.pie-leg{flex:1 1 180px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.pie-item{display:flex;align-items:center;gap:8px;line-height:1.25}
.pie-item i{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.pie-lab{flex:1;color:var(--ink)}
.pie-val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:340px;overflow:auto}
.chart-img{margin-top:6px}
.chart-img img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0;width:min(980px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px 0}
.dlg-head h3{margin:0;font-size:17px}
.dlg-body{padding:12px 20px 20px;overflow:auto;max-height:calc(90vh - 80px)}
.hero{padding:24px 22px}
.hero h2{font-size:22px;margin:0 0 8px}
.hero .sub{font-size:14.5px;line-height:1.5}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.inicio .card{transition:box-shadow .15s,transform .15s}
.inicio .card:hover{box-shadow:0 6px 18px rgba(28,34,54,.12);transform:translateY(-2px)}
.inicio .card{padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent);min-height:150px}
.inicio h2{margin:0;font-size:15px}
.inicio .n{font-size:34px;font-weight:700;line-height:1;color:var(--accent);margin-top:6px}
.inicio button{margin-top:auto;align-self:flex-start}
.vacio{color:var(--muted);padding:30px;text-align:center}
.nb-frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px;display:block}
footer{color:var(--muted);font-size:12.5px;padding:0 0 30px}
@media (max-width:560px){.hbar{grid-template-columns:minmax(80px,40%) 1fr}.wrap{padding:0 12px}.top{flex-wrap:wrap}.tools .ghost{flex:1 1 auto;text-align:center}.vbar{height:200px}.grid{gap:12px}dialog{width:98vw}.dlg-body{padding:10px 12px 16px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Antropología Uniandes: tablero de estudios</h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="ghost" id="tema" aria-pressed="false" title="Cambiar entre claro y oscuro">Modo oscuro</button>
    </div>
    <nav id="tabs" role="tablist" aria-label="Secciones"></nav>
    <nav id="subtabs" class="subnav" aria-label="Subsecciones" hidden></nav>

</header>
<main class="wrap" id="vista"></main>
<div class="wrap"><footer id="pie"></footer></div>
<dialog id="ventana" aria-labelledby="vt">

    <button class="ghost" id="cerrar" aria-label="Cerrar">Cerrar</button></div>
  <div class="dlg-body" id="vc"></div>
</dialog>

sados con su experiencia y formación en LinkedIn, el registro de posgrados y los productos de mercado (Talent Insights y LinkedIn Jobs), usando el código de estudiante como llave.\n\nUniverso: los 149 de los 190 egresados (grados 2021–2025) con al menos una experiencia en LinkedIn; no aparecer en LinkedIn no significa estar sin empleo, por eso esas personas no entran en los denominadores. Las 283 experiencias que no son empleo profesional (141 + 124 + 18) se excluyen; todos los indicadores se calculan después de la fecha de grado.\n\nCon cerca de 150 egresados, las diferencias se leen como señales, no como relaciones causales; cada cruce reporta el número de casos (n) y, cuando aplica, un valor p.", "intro_kpis": [{"num": "149 / 190", "lab": "egresados con experiencia en LinkedIn (grados 2021–2025)"}, {"num": "901", "lab": "experiencias registradas en LinkedIn"}, {"num": "283", "lab": "experiencias que NO se cuentan como empleo profesional"}, {"num": "141", "lab": "monitorías o asistencias académicas"}, {"num": "124", "lab": "prácticas o pasantías"}, {"num": "18", "lab": "nivel de practicante o contrato de prácticas / formación"}], "hallazgos": [], "advertencias": [], "graficas": [{"titulo": "Resumen laboral del universo (149 egresados con LinkedIn)", "cab": ["Indicador", "% de egresados"], "filas": [["Empleo profesional después del grado", 87.2], ["Empleo profesional actual", 65.8], ["Inserción en ≤ 6 meses", 67.1], ["Cargo de coordinación o superior", 29.5], ["Empleo actual relacionado con Antropología", 21.5]], "nota": "Indicadores sobre los 149 egresados con experiencia en LinkedIn. La mediana de meses al primer empleo es 0.", "tema": "Panorama y factores", "tipo": "horizontal", "analisis": "• Universo: 149 de los 190 egresados (78 %) con al menos una experiencia en LinkedIn; no representa a quienes no tienen perfil.\n• Se usan las 901 experiencias registradas.\n• El 87,2 % registra empleo profesional después del grado y el 65,8 % lo tiene hoy. La mediana de meses al primer empleo es 0 porque muchos ya trabajaban al graduarse.\n• El 67,1 % se insertó en 6 meses o menos y el 29,5 % llegó a coordinación o superior.\n• Solo el 21,5 % tiene al menos un empleo actual relacionado con Antropología.\n• 324 experiencias no tienen fecha de inicio, lo que limita los indicadores de tiempo.\n• 39 egresados tienen posgrado graduado: 12 en el registro de graduados (11 también en LinkedIn) y 27 solo en LinkedIn."}, {"titulo": "Mayores brechas entre grupos (resumen)", "cab": ["Factor", "Indicador", "Grupo más alto", "Grupo más bajo", "Brecha (p.p.)", "p-valor", "Lectura"], "filas": [["Tiempo para grado", "Inserción ≤ 6 meses", "A tiempo (75,0 %)", "2+ semestres (52,1 %)", 22.9, "0,026", "Significativa"], ["Opción académica", "Inserción ≤ 6 meses", "Con opción (80,4 %)", "Sin opción (61,2 %)", 19.2, "0,024", "Significativa"], ["Tiempo para grado", "Empleo actual", "1 sem. adicional (75,8 %)", "2+ semestres (60,4 %)", 15.4, "0,349", "No concluyente"], ["Tiempo para grado", "Empleo afín", "1 sem. adicional (30,3 %)", "2+ semestres (16,7 %)", 13.6, "0,330", "No concluyente"], ["Práctica CTP", "Empleo afín", "Sin práctica (29,8 %)", "Con práctica (16,3 %)", 13.5, "0,065", "Indicio"], ["Opción académica", "Empleo afín", "Con opción (30,4 %)", "Sin opción (17,5 %)", 12.9, "0,087", "Indicio"], ["Tiempo para grado", "Coordinación o +", "2+ semestres (33,3 %)", "1 sem. adicional (21,2 %)", 12.1, "0,475", "No concluyente"], ["Opción académica", "Empleo actual", "Con opción (73,9 %)", "Sin opción (62,1 %)", 11.8, "0,193", "No concluyente"], ["Posgrado", "Inserción ≤ 6 meses", "En curso (75,0 %)", "Graduado (64,1 %)", 10.9, "0,694", "No concluyente"], ["Práctica CTP", "Empleo post-grado", "Sin práctica (93,0 %)", "Con práctica (83,7 %)", 9.3, "0,131", "No concluyente"], ["Opción académica", "Empleo post-grado", "Con opción (93,5 %)", "Sin opción (84,5 %)", 9.0, "0,184", "No concluyente"], ["Doble titulación", "Empleo afín", "Sin doble (26,1 %)", "Con d ía de cada persona.\n• Doble titulación: el 17,5 % se desempeña hoy en Antropología vs 26,1 % sin ella (alguna vez 45 % vs 52,2 %); no significativo (p = 0,233).\n• Opción académica: 30,4 % vs 17,5 % (p = 0,087, indicio); orienta hacia la gestión social o cultural (21,7 % vs 2,9 %).\n• Por perfil, 'solo opción académica' es el grupo más alto (32,5 % hoy, 60 % alguna vez) y 'doble titulación + opción' el más bajo (16,7 %).\n• Con la definición acordada, el 32,7 % se desempeña hoy en Antropología (32 de 98 con empleo actual) y el 55,4 % alguna vez; solo el 4,1 % tiene un cargo explícito de antropólogo, etnógrafo o arqueólogo.\n• De los egresados con doble titulación y empleo actual (n=52), el 57,7 % no trabaja en ninguno de sus dos programas.\n• Por programa, ejercen su profesión Derecho (3 de 4), Arquitectura (2 de 2), Arte (2 de 3) e Historia (2 de 3); no lo hacen Ciencia Política (0 de 10), Economía (0 de 6) ni Lenguas y Cultura (0 de 5).\n• La relación del cargo con el otro programa la clasificó una IA con criterio estricto (219 experiencias).", "slices": {"T|T": {"filas": [["Solo Antropología", 5, 29], ["Solo opción académica", 13, 40], ["Solo doble titulación", 13, 74], ["Doble titulación + opción", 1, 6]], "n": 149}, "T|2021": {"filas": [["Solo Antropología", 0, 4], ["Solo opción académica", 2, 2], ["Solo doble titulación", 5, 15], ["Doble titulación + opción", 0, 1]], "n": 22}, "T|2022": {"filas": [["Solo Antropología", 1, 7], ["Solo opción académica", 2, 10], ["Solo doble titulación", 2, 10], ["Doble titulación + opción", 0, 1]], "n": 28}, "T|2023": {"filas": [["Solo Antropología", 1, 5], ["Solo opción académica", 2, 11], ["Solo doble titulación", 4, 24], ["Doble titulación + opción", 1, 1]], "n": 41}, "T|2024": {"filas": [["Solo Antropología", 0, 7], ["Solo opción académica", 3, 12], ["Solo doble titulación", 1, 12], ["Doble titulación + opción", 0, 1]], "n": 32}, "T|2025": {"filas": [["Solo Antropología", 3, 6], ["Solo opción académica", 4, 5], ["Solo doble o para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Práctica CTP", "cab": ["Indicador", "No (n=57)", "Sí (n=92)"], "filas": [["Empleo post-grado", 93.0, 83.7], ["Empleo actual", 70.2, 63.0], ["Inserción ≤ 6 meses", 70.2, 65.2], ["Coordinación o +", 29.8, 29.3], ["Empleo afín", 29.8, 16.3]], "nota": "Quienes no hicieron práctica muestran un indicio de más empleo afín (29,8 % vs 16,3 %, p = 0,065).", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Posgrado", "cab": ["Indicador", "En curso (n=20)", "Graduado (n=39)", "Sin posgrado (n=90)"], "filas": [["Empleo post-grado", 90.0, 87.2, 86.7], ["Empleo actual", 65.0, 61.5, 67.8], ["Inserción ≤ 6 meses", 75.0, 64.1, 66.7], ["Coordinación o +", 30.0, 25.6, 31.1], ["Empleo afín", 25.0, 25.6, 18.9]], "nota": "El posgrado no muestra diferencias concluyentes en estos indicadores.", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Continuidad en la organización de práctica", "cab": ["Nivel de continuidad", "Egresados (de 88 con sitio de práctica)"], "filas": [["Registra alguna experiencia en la organización", 74], ["Empleo profesional post-grado en ella", 12], ["Trabaja actualmente en ella", 5]], "nota": "De 88 egresados con sitio de práctica, 74 (84,1 %) registran alguna experiencia allí; solo 12 (13,6 %) un empleo profesional post-grado y 5 (5,7 %) hoy.", "tema": "Prácticas y continuidad", "analisis": "• La organización de práctica se compara con las empresas de LinkedIn con reglas flexibles de nombre (palabras en común, nombre compacto, siglas y palabras distintivas).\n• De los 88 egresados con sitio de práctica, el 84,1 % (74) registra en LinkedIn alguna experiencia en esa organización, casi siempre la propia práctica.\n• Solo 12 (13,6 %) tuvieron empleo profesional post-grado allí y 5 (5,7 %) trabajan hoy en ella.\n• De los 12 con continuidad, el 83,3 % tiene empleo actual y el 25 % empleo afín; sin continuidad caen a 60 % de empleo actual y 15 % de empleo afín.\n• Quienes no hicieron práctica tienen más empleo actual (70,2 %), pero el 52,6 % ya trabajaba al graduarse (vs 43,5 %): la práctica es la vía de entrada de quienes no tenían experiencia."}, {"titulo": "Resultados laborales según práctica y continuidad", "cab": ["Indicador", "Con continuidad (n=12)", "Sin continuidad (n=80)", "Sin práctica (n=57)"], "filas": [["Empleo actual %", 83.3, 60.0, 70.2], ["Inserción ≤ 6 meses %", 91.7, 61.3, 70.2], ["Coordinación o superior %", 16.7, 31.2, 29.8], ["Empleo afín a Antropología %", 25.0, 15.0, 29.8]], "nota": "'Con continuidad' = tuvo empleo profesional post-grado en la organización de la práctica.", "tema": "Prácticas y continuidad", "analisis": "• La organización de práctica se compara con las empresas de LinkedIn con reglas flexibles de nombre (palabras en común, nombre compacto, siglas y palabras distintivas).\n• De los 88 egresados con sitio de práctica, el 84,1 % (74) registra en LinkedIn alguna experiencia en esa organización, casi siempre la propia práctica.\n• Solo 12 (13,6 %) tuvieron empleo profesional post-grado allí y 5 (5,7 %) trabajan hoy en ella.\n• De los 12 con continuidad, el 83,3 % tiene empleo actual y el 25 % empleo afín; sin continuidad caen a 60 % de empleo actual y 15 % de empleo afín.\n• Quienes no hicieron práctica tienen más empleo actual (70,2 %), pero el 52,6 % ya trabajaba al graduarse (vs 43,5 %): la práctica es la vía de entrada de quienes no tenían experiencia."}, {"titulo": "Nivel de cargo alcanzado según posgrado", "cab": ["Estado de posgrado", "% coordinación o superior"], "filas": [["Sin posgrado (n=78)", 35.9], ["Posgrado en curso (n=18)", 33.3], ["Posgrado graduado (n=34)", 29.4]], "nota": "No hay evidencia de que el posgrado lleve a cargos de mayor nivel (OR ajustado 0,67; p = 0,386). Nivel actual promedio (1 asistente a 4 dirección): 2,45 sin posgrado, 2,44 en curso, 2,00 graduado.", "tema": "Posgrado", "tipo": "vertical", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %; y más investigación afín (29,2 % vs 4,9 %).\n• No hay evidencia de que lleve a mejores cargos: coordinación o superior 29,4 % vs 35,9 %; nivel actual promedio 2,0 vs 2,45 (OR ajustado 0,67; p = 0,386).\n• Los graduados de posgrado llevan 45 meses desde el grado de Antropología pero solo 15 desde el posgrado: poco tiempo para notar un efecto.\n• El posgrado se asocia más con un cambio de sector que con un ascenso jerárquico.\n• Inserción desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo; el 25,6 % termina en 2026 y no se puede evaluar aún. Solo 24 graduados de posgrado tienen empleo actual: leer con cautela."}, {"titulo": "Tipo de organización del empleo actual según posgrado", "cab": ["Estado de posgrado", "Educación %", "Entidad pública %", "Empresa %", "ONG / internacional %"], "filas": [["Sin posgrado", 8.2, 9.8, 70.5, 8.2], ["Posgrado en curso", 7.7, 30.8, 46.2, 0.0], ["Posgrado graduado", 29.2, 25.0, 41.7, 4.2]], "nota": "El posgrado se asocia con un cambio de sector (más educación y sector público, menos empresa).", "tema": "Posgrado", "tipo": "vertical", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) n.append(h.nodeType ? h : document.createTextNode(h));
  return n;
};
const fmt = (v, pct) => {
  if (v == null || v === "") return "";
  if (typeof v !== "number") return String(v);
  const t = Number.isInteger(v) ? v.toLocaleString("es-CO") : v.toLocaleString("es-CO", {maximumFractionDigits: 1});
  return pct ? t + "%" : t;
};
const esPct = (h) => /%/.test(h);
const COLORES = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
// las graficas de una sola serie pueden llevar un acento propio (p. ej. LinkedIn vs otras bolsas); las de varias series usan la paleta
const colorSerie = (g, i) => (g.acento && g.cab.length <= 2) ? g.acento : COLORES[i % 5];

function tipo(g) {
  if (g.tipo) return g.tipo;   // estilo fijado a mano desde el generador
  const num = g.filas.every((f) => f.slice(1).every((v) => v == null || typeof v === "number"));
  if (!num) return "tabla";
  const cats = g.filas.map((f) => String(f[0]));
  const anios = cats.every((c) => /^\d{4}$/.test(c));
  const cortas = g.filas.length >= 2 && g.filas.length <= 6 && cats.every((c) => c.length <= 34);
  return anios || cortas ? "vertical" : "horizontal";
}

function leyenda(g) {
  if (g.cab.length <= 2) return null;
  return el("div", {class: "legend"}, g.cab.slice(1).map((c, i) =>
    el("span", {}, el("i", {style: `background:${COLORES[i % 5]}`}), c)));
}

function horizontal(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const caja = el("div", {class: "hbar", role: "list"});
  for (const f of g.filas) {
    caja.append(el("div", {class: "lab", title: String(f[0]), role: "listitem"}, String(f[0])));
    caja.append(el("div", {class: "pistas"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {class: "pista", title: `${g.cab[i + 1]}: ${fmt(v, pct)}`},
        el("div", {class: "tr"}, el("div", {class: "rel", style: `width:${(100 * (v || 0) / max).toFixed(1)}%;background:${colorSerie(g, i)}`})),
        el("span", {class: "val"}, fmt(v, pct)));
    })));
  }
  return caja;
}

function vertical(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const cols = el("div", {class: "vbar"});
  const labs = el("div", {class: "vlabs"});
  for (const f of g.filas) {
    cols.append(el("div", {class: "vcol"}, el("div", {class: "vgrp"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {style: `height:${(100 * (v || 0) / max * 0.86).toFixed(1)}%;background:${colorSerie(g, i)}`,
                        title: `${f[0]} / ${g.cab[i + 1]}: ${fmt(v, pct)}`}, el("span", {}, fmt(v, pct)));
    }))));
    labs.append(el("div", {}, String(f[0])));
  }
  return el("div", {}, cols, labs);
}

function tabla(g) {
  const numCol = g.cab.map((_, j) => g.filas.every((f) => f[j] == null || typeof f[j] === "number") && j > 0);
  const t = el("table", {class: "t"},
    el("thead", {}, el("tr", {}, g.cab.map((c, j) => el("th", {class: numCol[j] ? "n" : ""}, c)))),
    el("tbody", {}, g.filas.map((f) => el("tr", {}, f.map((v, j) => el("td", {class: numCol[j] ? "n" : ""}, fmt(v, esPct(g.cab[j]))))))));
  return el("div", {class: "tablewrap"}, t);
}

function torta(g) {
  // Torta de la primera columna numerica: una porcion por fila, con leyenda de categoria, valor y porcentaje.
  const vals = g.filas.map((f) => (typeof f[1] === "number" ? f[1] : 0));
  const total = vals.reduce((a, b) => a + b, 0);
  if (total <= 0) return tabla(g);
  const cx = 100, cy = 100, r = 94;
  const punto = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const activos = g.filas.map((f, i) => [String(f[0]), vals[i], i]).filter((x) => x[1] > 0);
  let acc = 0;
  const trozos = activos.map(([lab, v, i]) => {
    const col = COLORES[i % 5];
    if (activos.length === 1 || v >= total) return `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${col}"/>`;
    const a0 = 2 * Math.PI * acc / total;
    acc += v;
    const a1 = 2 * Math.PI * acc / total;
    const [x0, y0] = punto(a0), [x1, y1] = punto(a1);
    const grande = (a1 - a0) > Math.PI ? 1 : 0;
    return `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${grande} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" style="fill:${col}"/>`;
  }).join("");
  const pie = el("div", {class: "pie"});
  pie.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${g.titulo}">${trozos}</svg>`;
  const pct = esPct(g.cab[1]);
  const leg = el("div", {class: "pie-leg"}, activos.map(([lab, v, i]) =>
    el("div", {class: "pie-item"},
      el("i", {style: `background:${COLORES[i % 5]}`}),
      el("span", {class: "pie-lab"}, lab),
      el("span", {class: "pie-val"}, `${fmt(v, pct)} · ${Math.round(100 * v / total)}%`))));
  return el("div", {class: "pie-wrap"}, pie, leg);
}

function imagen(g) {
  // Grafica del informe institucional mostrada tal cual (imagen original); la tabla transcrita queda en "Ver tabla".
  return el("div", {class: "chart-img"}, el("img", {src: g.src, alt: g.titulo, loading: "lazy"}));
}

function cajas(g) {
  // Tarjetas de texto con un numero grande por fila (KPIs), en vez de una imagen.
  const pct = esPct(g.cab[1]);
  return el("div", {class: "kpis"}, g.filas.map((f) =>
    el("div", {class: "kpi"}, el("div", {class: "kpi-num"}, fmt(f[1], pct)), el("div", {class: "kpi-lab"}, String(f[0])))));
}

function texto(g) {
  // Bloque de texto (hallazgos y conclusiones): cada linea es un parrafo o una vineta.
  return el("div", {class: "texto-bloque"}, (g.texto || []).map((p) =>
    el("p", {class: String(p).startsWith("•") ? "txt-b" : "txt-p"}, String(p).replace(/^•\s*/, ""))));
}

function heatmap(g) {
  // Mapa de calor: tabla con el color de cada celda proporcional al valor (% de la fila).
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const head = el("tr", {}, g.cab.map((h, j) => el("th", {class: j === 0 ? "hm-esq" : "hm-h"}, String(h))));
  const body = g.filas.map((f) => el("tr", {}, f.map((v, j) => {
    if (j === 0) return el("th", {class: "hm-row"}, String(v));
    const n = typeof v === "number" ? v : 0, op = n / max;
    return el("td", {class: "hm-cell",
      style: `background:color-mix(in srgb, var(--accent) ${Math.round(op * 82)}%, transparent);` +
             (op > 0.55 ? "color:#fff" : "")}, n ? fmt(n) : "");
  })));
  return el("div", {class: "hm-wrap"}, el("table", {class: "hm"}, el("thead", {}, head), el("tbody", {}, body)));
}

function dibujar(g, modo) {
  if (tipo(g) === "texto") return texto(g);
  if (tipo(g) === "heatmap" && modo !== "tabla") return heatmap(g);
  if (modo === "tabla" || tipo(g) === "tabla") return tabla(g);
  if (tipo(g) === "cajas") return cajas(g);
  if (tipo(g) === "imagen") return imagen(g);
  if (tipo(g) === "torta") return torta(g);
  const base = tipo(g) === "vertical" ? vertical(g) : horizontal(g);
  const lg = leyenda(g);
  return el("div", {}, lg, base);
}

function csv(g) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;

}

  let filas = labels.map((l) => {
    const a = acc.get(l), w = peso.get(l) || 1;
    return [l, ...a.map((v) => g.avg ? Math.round(v / w) : v)];
  });
  if (g.topN) filas = filas.slice(0, g.topN);
  return {filas, n};
}
// Modo comparar: valor por categoría para Mujeres y Hombres (el % de g.disp, o el total si es conteo).
function comparar(g) {
  const years = aniosSel(), orden = (g.slices["T|T"].filas || []).map((f) => String(f[0]));
  const tot = (sx) => {
    const m = new Map(); let n = 0;
    for (const a of years) { const c = g.slices[sx + "|" + a]; if (!c) continue; n += c.n;
      for (const fila of c.filas) { const lab = String(fila[0]);
        const cur = m.get(lab) || new Array(fila.length - 1).fill(0);
        for (let j = 1; j < fila.length; j++) if (typeof fila[j] === "number") cur[j - 1] += fila[j];
        m.set(lab, cur); } }
    return {m, n};
  };
  const valor = (cols) => {
    if (g.disp) { const d = g.disp[0];
      if ("sum" in d) return cols[d.sum - 1];
      const [n, de] = d.pct; return cols[de - 1] ? Math.round(1000 * cols[n - 1] / cols[de - 1]) / 10 : 0; }
    if (g.avg) { return 0; }   // (los promedios no se comparan por total)
    return cols.reduce((a, b) => a + (typeof b === "number" ? b : 0), 0);
  };
  const F = tot("F"), M = tot("M");
  let labels = orden.filter((l) => F.m.has(l) || M.m.has(l));
  for (const l of [...F.m.keys(), ...M.m.keys()]) if (!labels.includes(l)) labels.push(l);
  let filas = labels.map((l) => [l, F.m.has(l) ? valor(F.m.get(l)) : 0, M.m.has(l) ? valor(M.m.get(l)) : 0]);
  if (g.topN) filas = filas.slice(0, g.topN);
  return {cab: [g.cab[0], "Mujeres", "Hombres"], filas, n: F.n + M.n};
}
// Convierte filas de conteos a filas de visualización (% o sumas) según g.disp.
function aplicarDisp(g, filas) {
  return filas.map((row) => {
    const out = [row[0]];
    for (const d of g.disp) {
      if ("sum" in d) out.push(row[d.sum]);
      else { const [n, de] = d.pct; out.push(row[de] ? Math.round(1000 * row[n] / row[de]) / 10 : 0); }
    }
    return out;
  });
}
function aplicarRebanadas(f) {
  const ss = sexosSel(), years = aniosSel();
  for (const g of f.graficas) {
    if (!g.slices) continue;
    if (!g._cab0) { g._cab0 = g.cab.slice(); g._tipo0 = g.tipo; }
    g.cab = g._cab0.slice(); g.tipo = g._tipo0;           // restaurar antes de cada render
    if (FILTRO.comparar) {
      const r = comparar(g); g.cab = r.cab; g.tipo = undefined; g.filas = r.filas; g._n = r.n;
    } else {
      // atajo exacto cuando la selección coincide con una celda precalculada
      const ak = (years.length === 5) ? "T" : (years.length === 1 ? years[0] : null);
      const sk = (ss.length === 2) ? "T" : ss[0];
      let raw;
      if (ak !== null && g.slices[sk + "|" + ak]) { const c = g.slices[sk + "|" + ak]; raw = {filas: c.filas, n: c.n}; }
      else { const pares = []; for (const s of ss) for (const a of years) pares.push(s + "|" + a); raw = mezclar(g, pares); }
      g._n = raw.n;
      g.filas = g.disp ? aplicarDisp(g, raw.filas) : raw.filas;
    }
  }
}
function barraFiltros(f) {
  const bar = el("div", {class: "filtros"});
  const gen = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Género"));
  [["T", "Ambos"], ["F", "Mujeres"], ["M", "Hombres"]].forEach(([v, txt]) => gen.append(
    el("button", {class: "fbtn" + (!FILTRO.comparar && FILTRO.sexo === v ? " on" : ""),
      onclick: () => { FILTRO.sexo = v; FILTRO.comparar = false; ir(f.id); }}, txt)));
  gen.append(el("button", {class: "fbtn comparar" + (FILTRO.comparar ? " on" : ""),
    onclick: () => { FILTRO.comparar = !FILTRO.comparar; ir(f.id); }}, "⇄ Comparar M/H"));
  bar.append(gen);
  const an = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Año de grado"));
  an.append(el("button", {class: "fbtn" + (FILTRO.anios.size === 0 ? " on" : ""),
    onclick: () => { FILTRO.anios.clear(); ir(f.id); }}, "Todos"));
  ANIOS.forEach((a) => an.append(el("button", {class: "fbtn" + (FILTRO.anios.has(a) ? " on" : ""),
    onclick: () => { FILTRO.anios.has(a) ? FILTRO.anios.delete(a) : FILTRO.anios.add(a);
                     if (FILTRO.anios.size === ANIOS.length) FILTRO.anios.clear(); ir(f.id); }}, a)));
  bar.append(an);
  bar.append(el("p", {class: "fhint"},
    FILTRO.comparar
      ? "Comparando Mujeres vs Hombres (total por categoría). Puedes combinar varios años; con muy pocos casos se oculta por privacidad."
      : "Puedes elegir varios años a la vez. Muestra el n del subgrupo; con muy pocos casos se oculta por privacidad."));
  return bar;
}

function tarjeta(g) {
  let modo = "grafica";
  const vacio = g.slices && (!g.filas || g.filas.length === 0);
  const cuerpo = el("div", {}, vacio
    ? el("div", {class: "vacio"}, "Muestra demasiado pequeña para este filtro; se oculta por privacidad.")
    : dibujar(g, modo));
  const bt = el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
    modo = modo === "grafica" ? "tabla" : "grafica";
    e.currentTarget.setAttribute("aria-pressed", modo === "tabla");
    e.currentTarget.textContent = modo === "tabla" ? "Ver gráfica" : "Ver tabla";
    cuerpo.replaceChildren(dibujar(g, modo));
  }}, "Ver tabla");
  if (tipo(g) === "tabla" || tipo(g) === "cajas" || tipo(g) === "texto" || vacio) bt.style.display = "none";
  const badge = g.slices
    ? el("p", {class: "nmini"}, `n = ${g._n}`, g._n > 0 && g._n < 20
        ? el("span", {class: "peque"}, "  ·  muestra pequeña") : null)
    : null;
  // Panel de "Ver análisis": la lectura de resultados del notebook, oculta hasta pulsar el botón.
  const ana = g.analisis
    ? el("div", {class: "analisis", hidden: true}, g.analisis.split("\n").map((l) =>
        el("p", {class: l.trim().startsWith("•") ? "ana-b" : "ana-p"}, l.replace(/^\s*•\s*/, ""))))
    : null;
  const bta = g.analisis
    ? el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
        const mostrar = ana.hidden; ana.hidden = !mostrar;
        e.currentTarget.setAttribute("aria-pressed", mostrar);
        e.currentTarget.textContent = mostrar ? "Ocultar análisis" : "Ver análisis";
      }}, "Ver análisis")
    : null;
  return el("article", {class: "card chart-card", style: g.acento ? `border-top-color:${g.acento}` : ""},
    el("h3", {}, g.titulo), badge, cuerpo, g.nota ? el("p", {class: "nota"}, g.nota) : null, ana,
    el("div", {class: "tools"}, bt, bta,
      el("button", {class: "ghost", onclick: () => ampliar(g, modo)}, "Ampliar"),
      el("button", {class: "ghost", onclick: () => csv(g)}, "Descargar CSV")));
}

function vistaFuente(f) {
  const cont = el("div", {style: `--fa:${color(f)}`});
  cont.append(el("div", {class: "panel card", style: "border-top:3px solid var(--accent)"}, el("h2", {}, f.titulo), el("div", {class: "sub"}, f.fuente.split(".")[0])));
  if (f.intro || f.intro_kpis) {
    const sec = el("section", {class: "panel card intro-f"});
    if (f.intro_kpis) sec.append(el("div", {class: "kpis intro-kpis"}, f.intro_kpis.map((k) =>
      el("div", {class: "kpi"}, el("div", {class: "kpi-num"}, k.num), el("div", {class: "kpi-lab"}, k.lab)))));
    if (f.intro) f.intro.split("\n\n").forEach((p) => sec.append(el("p", {}, p)));
    cont.append(sec);
  }
  const hayFiltro = f.graficas.some((g) => g.slices);
  if (hayFiltro) { aplicarRebanadas(f); cont.append(barraFiltros(f)); }
  const buscador = el("input", {type: "search", placeholder: "Buscar en las gráficas…", "aria-label": "Buscar"});
  const cuenta = el("span", {class: "sub"});
  cont.append(el("div", {class: "barra"}, buscador, cuenta));
  const tarjetas = f.graficas.map((g) => ({g, nodo: tarjeta(g),
    texto: (g.titulo + " " + g.nota + " " + g.filas.map((x) => x[0]).join(" ")).toLowerCase()}));
  const temas = [...new Set(f.graficas.map((g) => g.tema))];
  const secciones = temas.map((tm) => {
    const grilla = el("div", {class: "grid"});
    const mias = tarjetas.filter((t) => t.g.tema === tm);
    mias.forEach((t) => grilla.append(t.nodo));
    const sec = el("section", {class: "tema", id: "tema-" + temas.indexOf(tm)},
      el("h2", {class: "tema-t"}, tm, el("span", {}, `${mias.length}`)), grilla);
    return {sec, mias, tm};
  });
  if (temas.length > 1) cont.append(el("div", {class: "chips"}, secciones.map((x) =>
    el("button", {class: "chip", onclick: () => x.sec.scrollIntoView({behavior: "smooth", block: "start"})}, x.tm))));
  const filtrar = () => {
    const q = buscador.value.trim().toLowerCase();
    let n = 0;
    tarjetas.forEach((t) => { const ok = !q || t.texto.includes(q); t.nodo.hidden = !ok; n += ok; });
    secciones.forEach((x) => { x.sec.hidden = x.mias.every((t) => t.nodo.hidden); });
    cuenta.textContent = `${n} de ${tarjetas.length} gráficas`;
  };
  buscador.addEventListener("input", filtrar);
  filtrar();
  secciones.forEach((x) => cont.append(x.sec));
  return cont;
}

function vistaInicio() {
  const intro = el("section", {class: "panel card hero", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, "Empleabilidad de los egresados de Antropología"),
    el("p", {class: "sub", style: "margin:0;max-width:62ch"},
      "Trayectoria laboral y formación de los egresados del programa, con datos agregados de LinkedIn, " +
      "bolsas de empleo, registros institucionales y la encuesta de seguimiento. Elige una sección."));
  const cont = el("div", {});
  const cardFuente = (f) => el("div", {class: "card", style: `--fa:${color(f)}`}, el("h2", {}, f.pestana),
    el("div", {class: "sub", style: "flex:1"}, f.descripcion || f.fuente.replace("Fuente: ", "")),
    f.clave ? el("p", {class: "clave"}, f.clave) : null,
    el("button", {class: "ghost", onclick: () => ir(f.id)}, "Ver gráficas"));
  const cardSec = (sec) => el("div", {class: "card"}, el("h2", {}, sec.pestana),
    el("div", {class: "sub", style: "flex:1"}, sec.intro || ""),
    el("button", {class: "ghost", onclick: () => ir(sec.id)}, "Abrir"));
  for (const gr of GRUPOS) {
    if (gr.gid === "inicio") continue;
    const items = gr.ids.map((id) => DATA.fuentes.find((x) => x.id === id) ||
      (DATA.secciones_nb || []).find((x) => x.id === id)).filter(Boolean);
    if (!items.length) continue;
    cont.append(el("h2", {class: "inicio-grupo"}, gr.lab));
    if (gr.desc) cont.append(el("p", {class: "inicio-grupo-sub"}, gr.desc));
    const grid = el("div", {class: "inicio"});
    items.forEach((it) => grid.append(DATA.fuentes.includes(it) ? cardFuente(it) : cardSec(it)));
    cont.append(grid);
  }
  const aviso = el("section", {class: "panel card warn", style: "margin-top:16px"}, el("h2", {}, "Antes de interpretar"),
    el("ul", {},
      el("li", {}, "En «Análisis por fuente», cada fuente mide algo distinto y en su propia fecha: no se comparan ni se suman cifras entre fuentes."),
      el("li", {}, "En «Análisis integrado» sí se cruza la información de los egresados (trayectoria académica frente a resultados laborales); con cerca de 150 personas, esas relaciones se leen como señales, no como causas."),
      el("li", {}, "Una persona puede aparecer en varias fuentes o búsquedas."),
      el("li", {}, "Solo hay datos agregados; ninguna gráfica identifica personas.")));
  return el("div", {}, intro, cont, aviso);
}

function vistaSeccionNb(sec) {
  const nbs = sec.items || [];
  const cont = el("div", {});
  cont.append(el("section", {class: "panel card", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, sec.pestana),
    el("p", {class: "sub", style: "margin:0"}, sec.intro || "")));
  if (!nbs.length) { cont.append(el("div", {class: "vacio"}, "Aún no hay contenido disponible.")); return cont; }
  const marco = el("iframe", {class: "nb-frame", title: sec.pestana, loading: "lazy"});
  const embebibles = nbs.filter((n) => n.archivo);
  const cards = el("div", {class: "inicio"});
  const pintar = (nb) => {
    marco.src = nb.archivo;
    cards.querySelectorAll(".card").forEach((c) => c.style.outline = c.dataset.id === nb.id ? "2px solid var(--accent)" : "none");
  };
  nbs.forEach((nb) => {
    const tools = el("div", {class: "tools"});
    if (nb.archivo) {
      tools.append(el("button", {class: "ghost", onclick: () => pintar(nb)}, "Ver aquí"));
      tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.archivo, "_blank", "noopener")}, "Abrir en pestaña nueva"));
    }
    if (nb.url) tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.url, "_blank", "noopener")}, "Abrir en Databricks"));
    cards.append(el("div", {class: "card", "data-id": nb.id, style: "border-top:3px solid var(--accent)"},
      el("h2", {}, nb.titulo), el("div", {class: "sub", style: "flex:1"}, nb.descripcion), tools));
  });
  cont.append(cards);
  if (embebibles.length) { cont.append(marco); pintar(embebibles[0]); }
  return cont;
}

// Navegación de dos niveles: grupos arriba, subpestañas debajo.
const GRUPOS = [
  {gid: "inicio", lab: "Inicio", ids: ["inicio"]},
  {gid: "fuente", lab: "Análisis por fuente",
   desc: "Cada fuente mide algo distinto y en su propia fecha. Aquí va cada una por separado, sin cruzarse entre sí.",
   ids: ["ti", "jobs", "egr", "inst", "encuesta"]},
  {gid: "integrado", lab: "Análisis integrado",
   desc: "Aquí se cruzan las fuentes: la trayectoria académica de los egresados frente a sus resultados laborales.",
   ids: ["cruces"]},
  {gid: "recursos", lab: "Recursos",
   desc: "Material de apoyo y cuadernos interactivos sobre los egresados.", ids: ["ficha"]},
];
const ultimoSub = {};
let PORID = new Map();
function grupoDe(id) { return GRUPOS.find((g) => g.ids.includes(id)) || GRUPOS[0]; }

function ir(id) {
  const f = DATA.fuentes.find((x) => x.id === id);
  const sec = (DATA.secciones_nb || []).find((x) => x.id === id);
  const activo = f ? id : sec ? sec.id : "inicio";
  const gr = grupoDe(activo);
  ultimoSub[gr.gid] = activo;
  $("#vista").replaceChildren(f ? vistaFuente(f) : sec ? vistaSeccionNb(sec) : vistaInicio());
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.gid === gr.gid));
  const sub = $("#subtabs");
  sub.replaceChildren();
  const subs = gr.ids.filter((sid) => PORID.has(sid));
  if (subs.length > 1) {
    sub.hidden = false;
    subs.forEach((sid) => sub.append(el("button", {role: "tab", "data-id": sid,
      "aria-selected": sid === activo ? "true" : "false", onclick: () => ir(sid)}, PORID.get(sid).pestana)));
  } else {
    sub.hidden = true;
  }
  history.replaceState(null, "", "#" + activo);
  scrollTo(0, 0);
}

function iniciar() {
  const tabs = $("#tabs");
  PORID = new Map([{id: "inicio", pestana: "Inicio"}, ...DATA.fuentes, ...(DATA.secciones_nb || [])].map((f) => [f.id, f]));
  // Barra superior: solo los grupos. Las subpestañas aparecen debajo al entrar a cada grupo.
  GRUPOS.forEach((gr) => {
    if (!gr.ids.some((id) => PORID.has(id))) return;
    tabs.append(el("button", {role: "tab", "data-gid": gr.gid,
      onclick: () => ir(ultimoSub[gr.gid] || gr.ids.find((id) => PORID.has(id)))}, gr.lab));
  });
  $("#sub").textContent = `Datos agregados de LinkedIn, bolsas de empleo y registros institucionales. Generado el ${DATA.generado}.`;
  $("#pie").textContent = "Fuentes: LinkedIn Talent Insights, Recruiter y Jobs, bolsas de empleo colombianas y registros institucionales. Cifras agregadas, sin datos de personas.";
  $("#cerrar").addEventListener("click", () => $("#ventana").close());
  $("#ventana").addEventListener("click", (e) => { if (e.target.id === "ventana") e.target.close(); });
  const tema = $("#tema");
  const raiz = document.documentElement;
  const oscuro = () => raiz.dataset.theme === "dark" || (!raiz.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const pintar = () => { tema.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  tema.addEventListener("click", () => { raiz.dataset.theme = oscuro() ? "light" : "dark"; pintar(); });
  pintar();
  const cab = document.querySelector("header");
  const altoCab = () => document.documentElement.style.setProperty("--hh", cab.offsetHeight + "px");
  altoCab();
  addEventListener("resize", altoCab);
  if (window.ResizeObserver) new ResizeObserver(altoCab).observe(cab);
  ir(location.hash.slice(1) || "inicio");
}
iniciar();
