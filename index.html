const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) n.append(h.nodeType ? h : document.createTextNode(h));
  return n;
};
const fmt = (v, pct) => {
  if (v == null || v === "") return "";
  if (typeof v !== "number") return String(v);
  const t = Number.isInteger(v) ? v.toLocaleString("es-CO") : v.toLocaleString("es-CO", {maximumFractionDigits: 1});
  return pct ? t + "%" : t;
};
const esPct = (h) => /%/.test(h);
const COLORES = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
// las graficas de una sola serie pueden llevar un acento propio (p. ej. LinkedIn vs otras bolsas); las de varias series usan la paleta
const colorSerie = (g, i) => (g.acento && g.cab.length <= 2) ? g.acento : COLORES[i % 5];

function tipo(g) {
  if (g.tipo) return g.tipo;   // estilo fijado a mano desde el generador
  const num = g.filas.every((f) => f.slice(1).every((v) => v == null || typeof v === "number"));
  if (!num) return "tabla";
  const cats = g.filas.map((f) => String(f[0]));
  const anios = cats.every((c) => /^\d{4}$/.test(c));
  const cortas = g.filas.length >= 2 && g.filas.length <= 6 && cats.every((c) => c.length <= 34);
  return anios || cortas ? "vertical" : "horizontal";
}

function leyenda(g) {
  if (g.cab.length <= 2) return null;
  return el("div", {class: "legend"}, g.cab.slice(1).map((c, i) =>
    el("span", {}, el("i", {style: `background:${COLORES[i % 5]}`}), c)));
}

function horizontal(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const caja = el("div", {class: "hbar", role: "list"});
  for (const f of g.filas) {
    caja.append(el("div", {class: "lab", title: String(f[0]), role: "listitem"}, String(f[0])));
    caja.append(el("div", {class: "pistas"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {class: "pista", title: `${g.cab[i + 1]}: ${fmt(v, pct)}`},
        el("div", {class: "tr"}, el("div", {class: "rel", style: `width:${(100 * (v || 0) / max).toFixed(1)}%;background:${colorSerie(g, i)}`})),
        el("span", {class: "val"}, fmt(v, pct)));
    })));
  }
  return caja;
}

function vertical(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const cols = el("div", {class: "vbar"});
  const labs = el("div", {class: "vlabs"});
  for (const f of g.filas) {
    cols.append(el("div", {class: "vcol"}, el("div", {class: "vgrp"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {style: `height:${(100 * (v || 0) / max * 0.86).toFixed(1)}%;background:${colorSerie(g, i)}`,
                        title: `${f[0]} / ${g.cab[i + 1]}: ${fmt(v, pct)}`}, el("span", {}, fmt(v, pct)));
    }))));
    labs.append(el("div", {}, String(f[0])));
  }
  return el("div", {}, cols, labs);
}

function tabla(g) {
  const numCol = g.cab.map((_, j) => g.filas.every((f) => f[j] == null || typeof f[j] === "number") && j > 0);
  const t = el("table", {class: "t"},
    el("thead", {}, el("tr", {}, g.cab.map((c, j) => el("th", {class: numCol[j] ? "n" : ""}, c)))),
    el("tbody", {}, g.filas.map((f) => el("tr", {}, f.map((v, j) => el("td", {class: numCol[j] ? "n" : ""}, fmt(v, esPct(g.cab[j]))))))));
  return el("div", {class: "tablewrap"}, t);
}

function torta(g) {
  // Torta de la primera columna numerica: una porcion por fila, con leyenda de categoria, valor y porcentaje.
  const vals = g.filas.map((f) => (typeof f[1] === "number" ? f[1] : 0));
  const total = vals.reduce((a, b) => a + b, 0);
  if (total <= 0) return tabla(g);
  const cx = 100, cy = 100, r = 94;
  const punto = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const activos = g.filas.map((f, i) => [String(f[0]), vals[i], i]).filter((x) => x[1] > 0);
  let acc = 0;
  const trozos = activos.map(([lab, v, i]) => {
    const col = COLORES[i % 5];
    if (activos.length === 1 || v >= total) return `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${col}"/>`;
    const a0 = 2 * Math.PI * acc / total;
    acc += v;
    const a1 = 2 * Math.PI * acc / total;
    const [x0, y0] = punto(a0), [x1, y1] = punto(a1);
    const grande = (a1 - a0) > Math.PI ? 1 : 0;
    return `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${grande} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" style="fill:${col}"/>`;
  }).join("");
  const pie = el("div", {class: "pie"});
  pie.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${g.titulo}">${trozos}</svg>`;
  const pct = esPct(g.cab[1]);
  const leg = el("div", {class: "pie-leg"}, activos.map(([lab, v, i]) =>
    el("div", {class: "pie-item"},
      el("i", {style: `background:${COLORES[i % 5]}`}),
      el("span", {class: "pie-lab"}, lab),
      el("span", {class: "pie-val"}, `${fmt(v, pct)} · ${Math.round(100 * v / total)}%`))));
  return el("div", {class: "pie-wrap"}, pie, leg);
}

function imagen(g) {
  // Grafica del informe institucional mostrada tal cual (imagen original); la tabla transcrita queda en "Ver tabla".
  return el("div", {class: "chart-img"}, el("img", {src: g.src, alt: g.titulo, loading: "lazy"}));
}

function cajas(g) {
  // Tarjetas de texto con un numero grande por fila (KPIs), en vez de una imagen.
  const pct = esPct(g.cab[1]);
  return el("div", {class: "kpis"}, g.filas.map((f) =>
    el("div", {class: "kpi"}, el("div", {class: "kpi-num"}, fmt(f[1], pct)), el("div", {class: "kpi-lab"}, String(f[0])))));
}

function texto(g) {
  // Bloque de texto (hallazgos y conclusiones): cada linea es un parrafo o una vineta.
  return el("div", {class: "texto-bloque"}, (g.texto || []).map((p) =>
    el("p", {class: String(p).startsWith("•") ? "txt-b" : "txt-p"}, String(p).replace(/^•\s*/, ""))));
}

function heatmap(g) {
  // Mapa de calor: tabla con el color de cada celda proporcional al valor (% de la fila).
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const head = el("tr", {}, g.cab.map((h, j) => el("th", {class: j === 0 ? "hm-esq" : "hm-h"}, String(h))));
  const body = g.filas.map((f) => el("tr", {}, f.map((v, j) => {
    if (j === 0) return el("th", {class: "hm-row"}, String(v));
    const n = typeof v === "number" ? v : 0, op = n / max;
    return el("td", {class: "hm-cell",
      style: `background:color-mix(in srgb, var(--accent) ${Math.round(op * 82)}%, transparent);` +
             (op > 0.55 ? "color:#fff" : "")}, n ? fmt(n) : "");
  })));
  return el("div", {class: "hm-wrap"}, el("table", {class: "hm"}, el("thead", {}, head), el("tbody", {}, body)));
}

function apilada(g) {
  // Barras horizontales 100% apiladas: cada fila suma ~100 y se parte por serie.
  const filas = g.filas.map((f) => {
    const total = f.slice(1).reduce((a, b) => a + (typeof b === "number" ? b : 0), 0) || 100;
    const segs = f.slice(1).map((v, i) => {
      const n = typeof v === "number" ? v : 0, w = 100 * n / total;
      return w > 0 ? el("span", {class: "apil-seg", style: `width:${w}%;background:${COLORES[i % 5]}`,
        title: `${g.cab[i + 1]}: ${fmt(n)}`}, w >= 7 ? fmt(n) : "") : null;
    });
    return el("div", {class: "apil-row"},
      el("div", {class: "apil-lab"}, String(f[0])), el("div", {class: "apil-bar"}, segs));
  });
  return el("div", {class: "apil"}, el("div", {}, ...filas), leyenda(g));
}

function divergente(g) {
  // Barras divergentes: valores con signo a ambos lados de un 0 central (p. ej. brechas en p.p.).
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).map((v) => Math.abs(typeof v === "number" ? v : 0))));
  const barra = (v, i) => {
    const n = typeof v === "number" ? v : 0, w = 48 * Math.abs(n) / max;
    const seg = el("span", {class: "dv-seg",
      style: `width:${w}%;background:${COLORES[i % 5]};` + (n < 0 ? "right:50%" : "left:50%")});
    const num = el("span", {class: "dv-num", style: n < 0 ? "left:2px" : "right:2px"}, (n > 0 ? "+" : "") + fmt(n));
    return el("div", {class: "dv-track"}, seg, num);
  };
  const rows = g.filas.map((f) => el("div", {class: "dv-row"},
    el("div", {class: "dv-lab"}, String(f[0])),
    el("div", {class: "dv-bars"}, ...f.slice(1).map((v, i) => barra(v, i)))));
  return el("div", {class: "dv"}, el("div", {}, ...rows), leyenda(g));
}

function dibujar(g, modo) {
  if (tipo(g) === "texto") return texto(g);
  if (tipo(g) === "divergente" && modo !== "tabla") return divergente(g);
  if (tipo(g) === "apilada" && modo !== "tabla") return apilada(g);
  if (tipo(g) === "heatmap" && modo !== "tabla") return heatmap(g);
  if (modo === "tabla" || tipo(g) === "tabla") return tabla(g);
  if (tipo(g) === "cajas") return cajas(g);
  if (tipo(g) === "imagen") return imagen(g);
  if (tipo(g) === "torta") return torta(g);
  const base = tipo(g) === "vertical" ? vertical(g) : horizontal(g);
  const lg = leyenda(g);
  return el("div", {}, lg, base);
}

function csv(g) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = [g.cab, ...g.filas].map((f) => f.map(esc).join(",")).join("\n");
  const a = el("a", {href: URL.createObjectURL(new Blob(["﻿" + txt], {type: "text/csv;charset=utf-8"})),
                     download: g.titulo.replace(/[^\w]+/g, "_").slice(0, 60) + ".csv"});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function ampliar(g, modo) {
  $("#vt").textContent = g.titulo;
  $("#vn").textContent = g.nota;
  const c = $("#vc");
  c.replaceChildren(dibujar(g, modo));
  $("#ventana").showModal();
}

function color(f) { return "var(--accent)"; }

// --- Filtros por genero y año (multi-año y comparar Mujeres vs Hombres) ---
const ANIOS = ["2021", "2022", "2023", "2024", "2025"];
// sexo: "T" | "F" | "M"; anios: Set vacío = todos; comparar: muestra Mujeres vs Hombres lado a lado.
const FILTRO = {sexo: "T", anios: new Set(), comparar: false};
function aniosSel() { return (FILTRO.anios.size === 0) ? ANIOS.slice() : ANIOS.filter((a) => FILTRO.anios.has(a)); }
function sexosSel() { return FILTRO.sexo === "T" ? ["F", "M"] : [FILTRO.sexo]; }

// Suma (o promedia, si avg) las celdas base seleccionadas, respetando el orden de la vista completa (T|T).
function mezclar(g, pares) {
  // las celdas con g.disp guardan más columnas (conteos) que g.cab; se dimensiona por la fila guardada
  const ncol = ((g.slices["T|T"].filas || [])[0] || []).length - 1, orden = (g.slices["T|T"].filas || []).map((f) => String(f[0]));
  const acc = new Map(), peso = new Map();
  let n = 0;
  for (const k of pares) {
    const c = g.slices[k]; if (!c) continue; n += c.n;
    for (const fila of c.filas) {
      const lab = String(fila[0]); if (!acc.has(lab)) { acc.set(lab, new Array(Math.max(ncol, fila.length - 1)).fill(0)); peso.set(lab, 0); }
      const a = acc.get(lab);
      for (let j = 0; j < fila.length - 1; j++) { const v = fila[j + 1]; if (typeof v === "number") a[j] += g.avg ? v * c.n : v; }
      peso.set(lab, peso.get(lab) + c.n);
    }
  }
  const labels = orden.filter((l) => acc.has(l)).concat([...acc.keys()].filter((l) => !orden.includes(l)));
  let filas = labels.map((l) => {
    const a = acc.get(l), w = peso.get(l) || 1;
    return [l, ...a.map((v) => g.avg ? Math.round(v / w) : v)];
  });
  if (g.topN) filas = filas.slice(0, g.topN);
  return {filas, n};
}
// Modo comparar: valor por categoría para Mujeres y Hombres (el % de g.disp, o el total si es conteo).
function comparar(g) {
  const years = aniosSel(), orden = (g.slices["T|T"].filas || []).map((f) => String(f[0]));
  const tot = (sx) => {
    const m = new Map(); let n = 0;
    for (const a of years) { const c = g.slices[sx + "|" + a]; if (!c) continue; n += c.n;
      for (const fila of c.filas) { const lab = String(fila[0]);
        const cur = m.get(lab) || new Array(fila.length - 1).fill(0);
        for (let j = 1; j < fila.length; j++) if (typeof fila[j] === "number") cur[j - 1] += fila[j];
        m.set(lab, cur); } }
    return {m, n};
  };
  const valor = (cols) => {
    if (g.disp) { const d = g.disp[0];
      if ("sum" in d) return cols[d.sum - 1];
      const [n, de] = d.pct; return cols[de - 1] ? Math.round(1000 * cols[n - 1] / cols[de - 1]) / 10 : 0; }
    if (g.avg) { return 0; }   // (los promedios no se comparan por total)
    return cols.reduce((a, b) => a + (typeof b === "number" ? b : 0), 0);
  };
  const F = tot("F"), M = tot("M");
  let labels = orden.filter((l) => F.m.has(l) || M.m.has(l));
  for (const l of [...F.m.keys(), ...M.m.keys()]) if (!labels.includes(l)) labels.push(l);
  let filas = labels.map((l) => [l, F.m.has(l) ? valor(F.m.get(l)) : 0, M.m.has(l) ? valor(M.m.get(l)) : 0]);
  if (g.topN) filas = filas.slice(0, g.topN);
  return {cab: [g.cab[0], "Mujeres", "Hombres"], filas, n: F.n + M.n};
}
// Convierte filas de conteos a filas de visualización (% o sumas) según g.disp.
function aplicarDisp(g, filas) {
  return filas.map((row) => {
    const out = [row[0]];
    for (const d of g.disp) {
      if ("sum" in d) out.push(row[d.sum]);
      else { const [n, de] = d.pct; out.push(row[de] ? Math.round(1000 * row[n] / row[de]) / 10 : 0); }
    }
    return out;
  });
}
function aplicarRebanadas(f) {
  const ss = sexosSel(), years = aniosSel();
  for (const g of f.graficas) {
    if (!g.slices) continue;
    if (!g._cab0) { g._cab0 = g.cab.slice(); g._tipo0 = g.tipo; }
    g.cab = g._cab0.slice(); g.tipo = g._tipo0;           // restaurar antes de cada render
    if (FILTRO.comparar) {
      const r = comparar(g); g.cab = r.cab; g.tipo = undefined; g.filas = r.filas; g._n = r.n;
    } else {
      // atajo exacto cuando la selección coincide con una celda precalculada
      const ak = (years.length === 5) ? "T" : (years.length === 1 ? years[0] : null);
      const sk = (ss.length === 2) ? "T" : ss[0];
      let raw;
      if (ak !== null && g.slices[sk + "|" + ak]) { const c = g.slices[sk + "|" + ak]; raw = {filas: c.filas, n: c.n}; }
      else { const pares = []; for (const s of ss) for (const a of years) pares.push(s + "|" + a); raw = mezclar(g, pares); }
      g._n = raw.n;
      g.filas = g.disp ? aplicarDisp(g, raw.filas) : raw.filas;
    }
  }
}
function barraFiltros(f) {
  const bar = el("div", {class: "filtros"});
  const gen = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Género"));
  [["T", "Ambos"], ["F", "Mujeres"], ["M", "Hombres"]].forEach(([v, txt]) => gen.append(
    el("button", {class: "fbtn" + (!FILTRO.comparar && FILTRO.sexo === v ? " on" : ""),
      onclick: () => { FILTRO.sexo = v; FILTRO.comparar = false; ir(f.id); }}, txt)));
  gen.append(el("button", {class: "fbtn comparar" + (FILTRO.comparar ? " on" : ""),
    onclick: () => { FILTRO.comparar = !FILTRO.comparar; ir(f.id); }}, "⇄ Comparar M/H"));
  bar.append(gen);
  const an = el("div", {class: "fgrupo"}, el("span", {class: "flab"}, "Año de grado"));
  an.append(el("button", {class: "fbtn" + (FILTRO.anios.size === 0 ? " on" : ""),
    onclick: () => { FILTRO.anios.clear(); ir(f.id); }}, "Todos"));
  ANIOS.forEach((a) => an.append(el("button", {class: "fbtn" + (FILTRO.anios.has(a) ? " on" : ""),
    onclick: () => { FILTRO.anios.has(a) ? FILTRO.anios.delete(a) : FILTRO.anios.add(a);
                     if (FILTRO.anios.size === ANIOS.length) FILTRO.anios.clear(); ir(f.id); }}, a)));
  bar.append(an);
  bar.append(el("p", {class: "fhint"},
    FILTRO.comparar
      ? "Comparando Mujeres vs Hombres (total por categoría). Puedes combinar varios años; con muy pocos casos se oculta por privacidad."
      : "Puedes elegir varios años a la vez. Muestra el n del subgrupo; con muy pocos casos se oculta por privacidad."));
  return bar;
}

function tarjeta(g) {
  let modo = "grafica";
  const vacio = g.slices && (!g.filas || g.filas.length === 0);
  const cuerpo = el("div", {}, vacio
    ? el("div", {class: "vacio"}, "Muestra demasiado pequeña para este filtro; se oculta por privacidad.")
    : dibujar(g, modo));
  const bt = el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
    modo = modo === "grafica" ? "tabla" : "grafica";
    e.currentTarget.setAttribute("aria-pressed", modo === "tabla");
    e.currentTarget.textContent = modo === "tabla" ? "Ver gráfica" : "Ver tabla";
    cuerpo.replaceChildren(dibujar(g, modo));
  }}, "Ver tabla");
  if (tipo(g) === "tabla" || tipo(g) === "cajas" || tipo(g) === "texto" || vacio) bt.style.display = "none";
  const badge = g.slices
    ? el("p", {class: "nmini"}, `n = ${g._n}`, g._n > 0 && g._n < 20
        ? el("span", {class: "peque"}, "  ·  muestra pequeña") : null)
    : null;
  // Panel de "Ver análisis": la lectura de resultados del notebook, oculta hasta pulsar el botón.
  const ana = g.analisis
    ? el("div", {class: "analisis", hidden: true}, g.analisis.split("\n").map((l) =>
        el("p", {class: l.trim().startsWith("•") ? "ana-b" : "ana-p"}, l.replace(/^\s*•\s*/, ""))))
    : null;
  const bta = g.analisis
    ? el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
        const mostrar = ana.hidden; ana.hidden = !mostrar;
        e.currentTarget.setAttribute("aria-pressed", mostrar);
        e.currentTarget.textContent = mostrar ? "Ocultar análisis" : "Ver análisis";
      }}, "Ver análisis")
    : null;
  return el("article", {class: "card chart-card" + (tipo(g) === "texto" ? " full" : ""),
      style: g.acento ? `border-top-color:${g.acento}` : ""},
    el("h3", {}, g.titulo), badge, cuerpo, g.nota ? el("p", {class: "nota"}, g.nota) : null, ana,
    el("div", {class: "tools"}, bt, bta,
      el("button", {class: "ghost", onclick: () => ampliar(g, modo)}, "Ampliar"),
      el("button", {class: "ghost", onclick: () => csv(g)}, "Descargar CSV")));
}

function vistaFuente(f) {
  const cont = el("div", {style: `--fa:${color(f)}`});
  cont.append(el("div", {class: "panel card", style: "border-top:3px solid var(--accent)"}, el("h2", {}, f.titulo), el("div", {class: "sub"}, f.fuente.split(".")[0])));
  if (f.intro || f.intro_kpis) {
    const sec = el("section", {class: "panel card intro-f"});
    if (f.intro_kpis) sec.append(el("div", {class: "kpis intro-kpis"}, f.intro_kpis.map((k) =>
      el("div", {class: "kpi"}, el("div", {class: "kpi-num"}, k.num), el("div", {class: "kpi-lab"}, k.lab)))));
    if (f.intro) f.intro.split("\n\n").forEach((p) => sec.append(el("p", {}, p)));
    cont.append(sec);
  }
  const hayFiltro = f.graficas.some((g) => g.slices);
  if (hayFiltro) { aplicarRebanadas(f); cont.append(barraFiltros(f)); }
  const buscador = el("input", {type: "search", placeholder: "Buscar en las gráficas…", "aria-label": "Buscar"});
  const cuenta = el("span", {class: "sub"});
  if (!f.doc) cont.append(el("div", {class: "barra"}, buscador, cuenta));
  const tarjetas = f.graficas.map((g) => ({g, nodo: tarjeta(g),
    texto: (g.titulo + " " + g.nota + " " + g.filas.map((x) => x[0]).join(" ")).toLowerCase()}));
  const temas = [...new Set(f.graficas.map((g) => g.tema))];
  const secciones = temas.map((tm) => {
    const grilla = el("div", {class: f.doc ? "grid doc" : "grid"});
    const mias = tarjetas.filter((t) => t.g.tema === tm);
    mias.forEach((t) => grilla.append(t.nodo));
    const sec = el("section", {class: "tema", id: "tema-" + temas.indexOf(tm)},
      tm ? el("h2", {class: "tema-t"}, tm, el("span", {}, `${mias.length}`)) : null, grilla);
    return {sec, mias, tm};
  });
  if (temas.length > 1) cont.append(el("div", {class: "chips"}, secciones.map((x) =>
    el("button", {class: "chip", onclick: () => x.sec.scrollIntoView({behavior: "smooth", block: "start"})}, x.tm))));
  const filtrar = () => {
    const q = buscador.value.trim().toLowerCase();
    let n = 0;
    tarjetas.forEach((t) => { const ok = !q || t.texto.includes(q); t.nodo.hidden = !ok; n += ok; });
    secciones.forEach((x) => { x.sec.hidden = x.mias.every((t) => t.nodo.hidden); });
    cuenta.textContent = `${n} de ${tarjetas.length} gráficas`;
  };
  buscador.addEventListener("input", filtrar);
  filtrar();
  secciones.forEach((x) => cont.append(x.sec));
  return cont;
}

function vistaInicio() {
  const intro = el("section", {class: "panel card hero", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, "Empleabilidad de los egresados de Antropología"),
    el("p", {class: "sub", style: "margin:0;max-width:62ch"},
      "Trayectoria laboral y formación de los egresados del programa, con datos agregados de LinkedIn, " +
      "bolsas de empleo, registros institucionales y la encuesta de seguimiento. Elige una sección."));
  const cont = el("div", {});
  const cardFuente = (f) => el("div", {class: "card", style: `--fa:${color(f)}`}, el("h2", {}, f.pestana),
    el("div", {class: "sub", style: "flex:1"}, f.descripcion || f.fuente.replace("Fuente: ", "")),
    f.clave ? el("p", {class: "clave"}, f.clave) : null,
    el("button", {class: "ghost", onclick: () => ir(f.id)}, "Ver gráficas"));
  const cardSec = (sec) => el("div", {class: "card"}, el("h2", {}, sec.pestana),
    el("div", {class: "sub", style: "flex:1"}, sec.intro || ""),
    el("button", {class: "ghost", onclick: () => ir(sec.id)}, "Abrir"));
  for (const gr of GRUPOS) {
    if (gr.gid === "inicio") continue;
    const items = gr.ids.map((id) => DATA.fuentes.find((x) => x.id === id) ||
      (DATA.secciones_nb || []).find((x) => x.id === id)).filter(Boolean);
    if (!items.length) continue;
    cont.append(el("h2", {class: "inicio-grupo"}, gr.lab));
    if (gr.desc) cont.append(el("p", {class: "inicio-grupo-sub"}, gr.desc));
    const grid = el("div", {class: "inicio"});
    items.forEach((it) => grid.append(DATA.fuentes.includes(it) ? cardFuente(it) : cardSec(it)));
    cont.append(grid);
  }
  const aviso = el("section", {class: "panel card warn", style: "margin-top:16px"}, el("h2", {}, "Antes de interpretar"),
    el("ul", {},
      el("li", {}, "En «Análisis por fuente», cada fuente mide algo distinto y en su propia fecha: no se comparan ni se suman cifras entre fuentes."),
      el("li", {}, "En «Análisis integrado» sí se cruza la información de los egresados (trayectoria académica frente a resultados laborales); con cerca de 150 personas, esas relaciones se leen como señales, no como causas."),
      el("li", {}, "Una persona puede aparecer en varias fuentes o búsquedas."),
      el("li", {}, "Solo hay datos agregados; ninguna gráfica identifica personas.")));
  return el("div", {}, intro, cont, aviso);
}

function vistaSeccionNb(sec) {
  const nbs = sec.items || [];
  const cont = el("div", {});
  cont.append(el("section", {class: "panel card", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, sec.pestana),
    el("p", {class: "sub", style: "margin:0"}, sec.intro || "")));
  if (!nbs.length) { cont.append(el("div", {class: "vacio"}, "Aún no hay contenido disponible.")); return cont; }
  const marco = el("iframe", {class: "nb-frame", title: sec.pestana, loading: "lazy"});
  const embebibles = nbs.filter((n) => n.archivo);
  const cards = el("div", {class: "inicio"});
  const pintar = (nb) => {
    marco.src = nb.archivo;
    cards.querySelectorAll(".card").forEach((c) => c.style.outline = c.dataset.id === nb.id ? "2px solid var(--accent)" : "none");
  };
  nbs.forEach((nb) => {
    const tools = el("div", {class: "tools"});
    if (nb.archivo) {
      tools.append(el("button", {class: "ghost", onclick: () => pintar(nb)}, "Ver aquí"));
      tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.archivo, "_blank", "noopener")}, "Abrir en pestaña nueva"));
    }
    if (nb.url) tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.url, "_blank", "noopener")}, "Abrir en Databricks"));
    cards.append(el("div", {class: "card", "data-id": nb.id, style: "border-top:3px solid var(--accent)"},
      el("h2", {}, nb.titulo), el("div", {class: "sub", style: "flex:1"}, nb.descripcion), tools));
  });
  cont.append(cards);
  if (embebibles.length) { cont.append(marco); pintar(embebibles[0]); }
  return cont;
}

// Navegación de dos niveles: grupos arriba, subpestañas debajo.
const GRUPOS = [
  {gid: "inicio", lab: "Inicio", ids: ["inicio"]},
  {gid: "fuente", lab: "Análisis por fuente",
   desc: "Cada fuente mide algo distinto y en su propia fecha. Aquí va cada una por separado, sin cruzarse entre sí.",
   ids: ["ti", "jobs", "egr", "inst", "encuesta"]},
  {gid: "integrado", lab: "Análisis integrado",
   desc: "Aquí se cruzan las fuentes: la trayectoria académica de los egresados frente a sus resultados laborales.",
   ids: ["contexto", "cruces"]},
  {gid: "recursos", lab: "Recursos",
   desc: "Material de apoyo y cuadernos interactivos sobre los egresados.", ids: ["ficha"]},
];
const ultimoSub = {};
let PORID = new Map();
function grupoDe(id) { return GRUPOS.find((g) => g.ids.includes(id)) || GRUPOS[0]; }

function ir(id) {
  const f = DATA.fuentes.find((x) => x.id === id);
  const sec = (DATA.secciones_nb || []).find((x) => x.id === id);
  const activo = f ? id : sec ? sec.id : "inicio";
  const gr = grupoDe(activo);
  ultimoSub[gr.gid] = activo;
  $("#vista").replaceChildren(f ? vistaFuente(f) : sec ? vistaSeccionNb(sec) : vistaInicio());
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.gid === gr.gid));
  const sub = $("#subtabs");
  sub.replaceChildren();
  const subs = gr.ids.filter((sid) => PORID.has(sid));
  if (subs.length > 1) {
    sub.hidden = false;
    subs.forEach((sid) => sub.append(el("button", {role: "tab", "data-id": sid,
      "aria-selected": sid === activo ? "true" : "false", onclick: () => ir(sid)}, PORID.get(sid).pestana)));
  } else {
    sub.hidden = true;
  }
  history.replaceState(null, "", "#" + activo);
  scrollTo(0, 0);
}

function iniciar() {
  const tabs = $("#tabs");
  PORID = new Map([{id: "inicio", pestana: "Inicio"}, ...DATA.fuentes, ...(DATA.secciones_nb || [])].map((f) => [f.id, f]));
  // Barra superior: solo los grupos. Las subpestañas aparecen debajo al entrar a cada grupo.
  GRUPOS.forEach((gr) => {
    if (!gr.ids.some((id) => PORID.has(id))) return;
    tabs.append(el("button", {role: "tab", "data-gid": gr.gid,
      onclick: () => ir(ultimoSub[gr.gid] || gr.ids.find((id) => PORID.has(id)))}, gr.lab));
  });
  $("#sub").textContent = `Datos agregados de LinkedIn, bolsas de empleo y registros institucionales. Generado el ${DATA.generado}.`;
  $("#pie").textContent = "Fuentes: LinkedIn Talent Insights, Recruiter y Jobs, bolsas de empleo colombianas y registros institucionales. Cifras agregadas, sin datos de personas.";
  $("#cerrar").addEventListener("click", () => $("#ventana").close());
  $("#ventana").addEventListener("click", (e) => { if (e.target.id === "ventana") e.target.close(); });
  const tema = $("#tema");
  const raiz = document.documentElement;
  const oscuro = () => raiz.dataset.theme === "dark" || (!raiz.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const pintar = () => { tema.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  tema.addEventListener("click", () => { raiz.dataset.theme = oscuro() ? "light" : "dark"; pintar(); });
  pintar();
  const cab = document.querySelector("header");
  const altoCab = () => document.documentElement.style.setProperty("--hh", cab.offsetHeight + "px");
  altoCab();
  addEventListener("resize", altoCab);
  if (window.ResizeObserver) new ResizeObserver(altoCab).observe(cab);
  ir(location.hash.slice(1) || "inicio");
}
iniciar();
</script>
