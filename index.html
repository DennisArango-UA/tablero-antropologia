<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Antropología</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1C2236; --muted:#4f5a78; --line:#DAE1F2; --accent:#364775; --accent-ink:#ffffff;
  --track:#e9edf7; --warn-bg:#fff4e5; --warn-line:#FECA8E; --hero1:#1C2236; --hero2:#222D4E;
  --c1:#364775; --c2:#F36F0F; --c3:#96B3DF; --c4:#C23319; --c5:#FEAA46;
  --shadow:0 1px 2px rgba(28,34,54,.06),0 2px 8px rgba(28,34,54,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
    --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
    --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
  --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
  --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Verdana,Geneva,sans-serif}
header{background:var(--hero1);color:#fff;position:sticky;top:0;z-index:5;border-bottom:3px solid #F36F0F}
header .sub{color:rgba(255,255,255,.85)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
h1{font-size:clamp(15px,3.2vw,20px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:7px 14px;font:inherit;font-size:13px;color:#DAE1F2;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.12)}
nav button[aria-selected="true"]{background:#fff;color:#1C2236;font-weight:700;border-color:#fff}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
header button.ghost{background:transparent;color:#DAE1F2;border-color:rgba(255,255,255,.28)}
button.ghost:hover{border-color:var(--accent)}
button.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:20px 0 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel{padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 8px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:3px 0}
.warn{background:var(--warn-bg);border-color:var(--warn-line)}
details.panel summary{cursor:pointer;font-weight:600;font-size:15px}
details.panel[open] summary{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.chart-card{padding:16px 18px 14px;display:flex;flex-direction:column;min-width:0;border-top:3px solid var(--accent)}
.chart-card h3{font-size:13.5px;margin:0 0 2px;line-height:1.3}
.nota{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tools{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tema{margin-top:26px;scroll-margin-top:130px}
.tema[hidden]{display:none}
.tema-t{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.tema-t::before{content:"";width:6px;height:22px;border-radius:1px;background:#F36F0F}
.tema-t span{font-size:12px;font-weight:600;background:var(--track);color:var(--muted);border-radius:3px;padding:1px 8px;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search]{flex:1 1 220px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.hbar .pistas{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.pista{display:flex;align-items:center;gap:6px}
.pista .tr{flex:1;background:var(--track);border-radius:2px;height:14px}
.pista .rel{height:100%;border-radius:2px;min-width:3px}
.pista .val{min-width:46px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink)}
.vbar{display:flex;align-items:flex-end;gap:6px;height:240px;padding-top:18px;border-bottom:1px solid var(--line)}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vgrp{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.vgrp div{flex:1;max-width:44px;border-radius:2px 2px 0 0;position:relative;min-height:2px}
.vgrp span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.vlabs{display:flex;gap:6px;margin-top:5px}
.vlabs div{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.pie-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pie{flex:0 0 180px;max-width:180px}
.pie svg{width:100%;height:auto;display:block}
.pie svg path,.pie svg circle{stroke:var(--panel);stroke-width:1.5}
.pie-leg{flex:1 1 180px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.pie-item{display:flex;align-items:center;gap:8px;line-height:1.25}
.pie-item i{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.pie-lab{flex:1;color:var(--ink)}
.pie-val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:340px;overflow:auto}
.chart-img{margin-top:6px}
.chart-img img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0;width:min(980px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px 0}
.dlg-head h3{margin:0;font-size:17px}
.dlg-body{padding:12px 20px 20px;overflow:auto;max-height:calc(90vh - 80px)}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.inicio .card{padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent);min-height:150px}
.inicio h2{margin:0;font-size:15px}
.inicio .n{font-size:34px;font-weight:700;line-height:1;color:var(--accent);margin-top:6px}
.inicio button{margin-top:auto;align-self:flex-start}
.vacio{color:var(--muted);padding:30px;text-align:center}
.nb-frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px;display:block}
footer{color:var(--muted);font-size:12.5px;padding:0 0 30px}
@media (max-width:560px){.hbar{grid-template-columns:minmax(80px,40%) 1fr}.wrap{padding:0 12px}.top{flex-wrap:wrap}.tools .ghost{flex:1 1 auto;text-align:center}.vbar{height:200px}.grid{gap:12px}dialog{width:98vw}.dlg-body{padding:10px 12px 16px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Antropología Uniandes: tablero de estudios</h1>

</dialog>

ado sale de lo que cada persona publicó en LinkedIn, así que depende de que el perfil esté completo.", "Las diferencias entre grupos son descriptivas: no permiten afirmar que las prácticas causen la vinculación laboral.", "Los créditos son los acumulados hasta el grado y pueden incluir créditos de otros programas cursados en la Universidad."], "graficas": [{"titulo": "Prácticas marcadas en el programa", "cab": ["Categoría", "Egresados"], "filas": [["Prácticas nacionales", 107], ["Prácticas internacionales o mixtas", 4], ["Sin prácticas marcadas", 79]], "nota": "Las internacionales y las mixtas se agrupan porque cada una tiene muy pocos egresados.", "tema": "Prácticas y primer empleo"}, {"titulo": "Créditos promedio acumulados al grado", "cab": ["Indicador", "Créditos"], "filas": [["Intentados", 179.7], ["Aprobados", 175.4]], "nota": "", "tema": "Trayecto académico"}, {"titulo": "Tiempo requerido para graduarse", "cab": ["Tiempo", "Egresados"], "filas": [["Dentro de la duración prevista", 84], ["1 semestre adicional", 41], ["2 semestres adicionales", 25], ["3 semestres adicionales", 20], ["4 o más semestres adicionales", 20]], "nota": "84 egresados (44,2 %) dentro de la duración prevista; 106 (55,8 %) con uno o más semestres adicionales.", "tema": "Trayecto académico"}, {"titulo": "Egresados con segundos programas registrados", "cab": ["Categoría", "Egresados"], "filas": [["Con segundo programa registrado", 130], ["Sin segundo programa registrado", 60]], "nota": "Cuenta cualquier segundo programa, con o sin título obtenido.", "tema": "Trayecto académico"}, {"titulo": "Segundos programas", "cab": ["Categoría", "Egresados"], "filas": [["Con título en todos", 101], ["Con segundo programa, sin título en todos", 29], ["Sin segundo programa", 60]], "nota": "Cuenta egresados con segundo programa, hayan obtenido o no el título.", "tema": "Trayecto académico"}, {"titulo": "Opciones académicas registradas", "cab": ["Categoría", "Egresados"], "filas": [["Ninguna", 134], ["Una", const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) n.append(h.nodeType ? h : document.createTextNode(h));
  return n;
};
const fmt = (v, pct) => {
  if (v == null || v === "") return "";
  if (typeof v !== "number") return String(v);
  const t = Number.isInteger(v) ? v.toLocaleString("es-CO") : v.toLocaleString("es-CO", {maximumFractionDigits: 1});
  return pct ? t + "%" : t;
};
const esPct = (h) => /%/.test(h);
const COLORES = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
// las graficas de una sola serie pueden llevar un acento propio (p. ej. LinkedIn vs otras bolsas); las de varias series usan la paleta
const colorSerie = (g, i) => (g.acento && g.cab.length <= 2) ? g.acento : COLORES[i % 5];

function tipo(g) {
  if (g.tipo) return g.tipo;   // estilo fijado a mano desde el generador
  const num = g.filas.every((f) => f.slice(1).every((v) => v == null || typeof v === "number"));
  if (!num) return "tabla";
  const cats = g.filas.map((f) => String(f[0]));
  const anios = cats.every((c) => /^\d{4}$/.test(c));
  const cortas = g.filas.length >= 2 && g.filas.length <= 6 && cats.every((c) => c.length <= 34);
  return anios || cortas ? "vertical" : "horizontal";
}

function leyenda(g) {
  if (g.cab.length <= 2) return null;
  return el("div", {class: "legend"}, g.cab.slice(1).map((c, i) =>
    el("span", {}, el("i", {style: `background:${COLORES[i % 5]}`}), c)));
}

function horizontal(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const caja = el("div", {class: "hbar", role: "list"});
  for (const f of g.filas) {
    caja.append(el("div", {class: "lab", title: String(f[0]), role: "listitem"}, String(f[0])));
    caja.append(el("div", {class: "pistas"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {class: "pista", title: `${g.cab[i + 1]}: ${fmt(v, pct)}`},
        el("div", {class: "tr"}, el("div", {class: "rel", style: `width:${(100 * (v || 0) / max).toFixed(1)}%;background:${colorSerie(g, i)}`})),
        el("span", {class: "val"}, fmt(v, pct)));
    })));
  }
  return caja;
}

function vertical(g) {
  const max = Math.max(1, ...g.filas.flatMap((f) => f.slice(1).filter((v) => typeof v === "number")));
  const cols = el("div", {class: "vbar"});
  const labs = el("div", {class: "vlabs"});
  for (const f of g.filas) {
    cols.append(el("div", {class: "vcol"}, el("div", {class: "vgrp"}, f.slice(1).map((v, i) => {
      const pct = esPct(g.cab[i + 1]);
      return el("div", {style: `height:${(100 * (v || 0) / max * 0.86).toFixed(1)}%;background:${colorSerie(g, i)}`,
                        title: `${f[0]} / ${g.cab[i + 1]}: ${fmt(v, pct)}`}, el("span", {}, fmt(v, pct)));
    }))));
    labs.append(el("div", {}, String(f[0])));
  }
  return el("div", {}, cols, labs);
}

function tabla(g) {
  const numCol = g.cab.map((_, j) => g.filas.every((f) => f[j] == null || typeof f[j] === "number") && j > 0);
  const t = el("table", {class: "t"},
    el("thead", {}, el("tr", {}, g.cab.map((c, j) => el("th", {class: numCol[j] ? "n" : ""}, c)))),
    el("tbody", {}, g.filas.map((f) => el("tr", {}, f.map((v, j) => el("td", {class: numCol[j] ? "n" : ""}, fmt(v, esPct(g.cab[j]))))))));
  return el("div", {class: "tablewrap"}, t);
}

function torta(g) {
  // Torta de la primera columna numerica: una porcion por fila, con leyenda de categoria, valor y porcentaje.
  const vals = g.filas.map((f) => (typeof f[1] === "number" ? f[1] : 0));
  const total = vals.reduce((a, b) => a + b, 0);
  if (total <= 0) return tabla(g);
  const cx = 100, cy = 100, r = 94;
  const punto = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const activos = g.filas.map((f, i) => [String(f[0]), vals[i], i]).filter((x) => x[1] > 0);
  let acc = 0;
  const trozos = activos.map(([lab, v, i]) => {
    const col = COLORES[i % 5];
    if (activos.length === 1 || v >= total) return `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:${col}"/>`;
    const a0 = 2 * Math.PI * acc / total;
    acc += v;
    const a1 = 2 * Math.PI * acc / total;
    const [x0, y0] = punto(a0), [x1, y1] = punto(a1);
    const grande = (a1 - a0) > Math.PI ? 1 : 0;
    return `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${grande} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" style="fill:${col}"/>`;
  }).join("");
  const pie = el("div", {class: "pie"});
  pie.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${g.titulo}">${trozos}</svg>`;
  const pct = esPct(g.cab[1]);
  const leg = el("div", {class: "pie-leg"}, activos.map(([lab, v, i]) =>
    el("div", {class: "pie-item"},
      el("i", {style: `background:${COLORES[i % 5]}`}),
      el("span", {class: "pie-lab"}, lab),
      el("span", {class: "pie-val"}, `${fmt(v, pct)} · ${Math.round(100 * v / total)}%`))));
  return el("div", {class: "pie-wrap"}, pie, leg);
}

function imagen(g) {
  // Grafica del informe institucional mostrada tal cual (imagen original); la tabla transcrita queda en "Ver tabla".
  return el("div", {class: "chart-img"}, el("img", {src: g.src, alt: g.titulo, loading: "lazy"}));
}

function dibujar(g, modo) {
  if (modo === "tabla" || tipo(g) === "tabla") return tabla(g);
  if (tipo(g) === "imagen") return imagen(g);
  if (tipo(g) === "torta") return torta(g);
  const base = tipo(g) === "vertical" ? vertical(g) : horizontal(g);
  const lg = leyenda(g);
  return el("div", {}, lg, base);
}

function csv(g) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = [g.cab, ...g.filas].map((f) => f.map(esc).join(",")).join("\n");
  const a = el("a", {href: URL.createObjectURL(new Blob(["﻿" + txt], {type: "text/csv;charset=utf-8"})),
                     download: g.titulo.replace(/[^\w]+/g, "_").slice(0, 60) + ".csv"});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function ampliar(g, modo) {
  $("#vt").textContent = g.titulo;
  $("#vn").textContent = g.nota;
  const c = $("#vc");
  c.replaceChildren(dibujar(g, modo));
  $("#ventana").showModal();
}

function color(f) { return "var(--accent)"; }

function tarjeta(g) {
  let modo = "grafica";
  const cuerpo = el("div", {}, dibujar(g, modo));
  const bt = el("button", {class: "ghost", "aria-pressed": "false", onclick: (e) => {
    modo = modo === "grafica" ? "tabla" : "grafica";
    e.currentTarget.setAttribute("aria-pressed", modo === "tabla");
    e.currentTarget.textContent = modo === "tabla" ? "Ver gráfica" : "Ver tabla";
    cuerpo.replaceChildren(dibujar(g, modo));
  }}, "Ver tabla");
  if (tipo(g) === "tabla") bt.style.display = "none";
  return el("article", {class: "card chart-card", style: g.acento ? `border-top-color:${g.acento}` : ""},
    el("h3", {}, g.titulo), g.nota ? el("p", {class: "nota"}, g.nota) : null, cuerpo,
    el("div", {class: "tools"}, bt,
      el("button", {class: "ghost", onclick: () => ampliar(g, modo)}, "Ampliar"),
      el("button", {class: "ghost", onclick: () => csv(g)}, "Descargar CSV")));
}

function vistaFuente(f) {
  const cont = el("div", {style: `--fa:${color(f)}`});
  cont.append(el("div", {class: "panel card", style: "border-top:3px solid var(--accent)"}, el("h2", {}, f.titulo), el("div", {class: "sub"}, f.fuente.split(".")[0])));
  const buscador = el("input", {type: "search", placeholder: "Buscar en las gráficas…", "aria-label": "Buscar"});
  const cuenta = el("span", {class: "sub"});
  cont.append(el("div", {class: "barra"}, buscador, cuenta));
  const tarjetas = f.graficas.map((g) => ({g, nodo: tarjeta(g),
    texto: (g.titulo + " " + g.nota + " " + g.filas.map((x) => x[0]).join(" ")).toLowerCase()}));
  const temas = [...new Set(f.graficas.map((g) => g.tema))];
  const secciones = temas.map((tm) => {
    const grilla = el("div", {class: "grid"});
    const mias = tarjetas.filter((t) => t.g.tema === tm);
    mias.forEach((t) => grilla.append(t.nodo));
    const sec = el("section", {class: "tema", id: "tema-" + temas.indexOf(tm)},
      el("h2", {class: "tema-t"}, tm, el("span", {}, `${mias.length}`)), grilla);
    return {sec, mias, tm};
  });
  if (temas.length > 1) cont.append(el("div", {class: "chips"}, secciones.map((x) =>
    el("button", {class: "chip", onclick: () => x.sec.scrollIntoView({behavior: "smooth", block: "start"})}, x.tm))));
  const filtrar = () => {
    const q = buscador.value.trim().toLowerCase();
    let n = 0;
    tarjetas.forEach((t) => { const ok = !q || t.texto.includes(q); t.nodo.hidden = !ok; n += ok; });
    secciones.forEach((x) => { x.sec.hidden = x.mias.every((t) => t.nodo.hidden); });
    cuenta.textContent = `${n} de ${tarjetas.length} gráficas`;
  };
  buscador.addEventListener("input", filtrar);
  filtrar();
  secciones.forEach((x) => cont.append(x.sec));
  return cont;
}

function vistaInicio() {
  const intro = el("section", {class: "panel card", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, "Empleabilidad de los egresados de Antropología"),
    el("p", {class: "sub", style: "margin:0"},
      "Un panorama de la trayectoria laboral y la formación de los egresados del programa de Antropología de la " +
      "Universidad de los Andes, con datos agregados de LinkedIn (Talent Insights, Recruiter y Jobs), bolsas de empleo " +
      "colombianas y registros institucionales de la Universidad. Elige una sección para ver sus gráficas."));
  const cont = el("div", {class: "inicio"});
  for (const f of DATA.fuentes) {
    cont.append(el("div", {class: "card", style: `--fa:${color(f)}`}, el("h2", {}, f.pestana),
      el("div", {class: "sub", style: "flex:1"}, f.descripcion || f.fuente.replace("Fuente: ", "")),
      el("div", {class: "sub", style: "font-size:12px"}, f.fuente.replace("Fuente: ", "")),
      el("button", {class: "ghost", onclick: () => ir(f.id)}, "Ver gráficas")));
  }
  const aviso = el("section", {class: "panel card warn", style: "margin-top:16px"}, el("h2", {}, "Antes de interpretar"),
    el("ul", {},
      el("li", {}, "Las fuentes miden cosas distintas: Talent Insights cuenta perfiles de toda la historia, Recruiter es una muestra de egresados, Jobs es una foto del día de la descarga y los productos institucionales describen a los egresados del listado oficial."),
      el("li", {}, "En Vacantes, las tarjetas de LinkedIn Jobs y las de otras bolsas de empleo van juntas pero no se suman: son fuentes y fechas distintas."),
      el("li", {}, "Por eso el tablero no compara cifras entre fuentes."),
      el("li", {}, "No sumes cifras entre fuentes ni entre búsquedas: una persona puede aparecer en varias."),
      el("li", {}, "Solo hay datos agregados; ninguna gráfica identifica personas.")));
  return el("div", {}, intro, cont, aviso);
}

function vistaSeccionNb(sec) {
  const nbs = sec.items || [];
  const cont = el("div", {});
  cont.append(el("section", {class: "panel card", style: "border-top:3px solid var(--accent)"},
    el("h2", {}, sec.pestana),
    el("p", {class: "sub", style: "margin:0"}, sec.intro || "")));
  if (!nbs.length) { cont.append(el("div", {class: "vacio"}, "Aún no hay contenido disponible.")); return cont; }
  const marco = el("iframe", {class: "nb-frame", title: sec.pestana, loading: "lazy"});
  const embebibles = nbs.filter((n) => n.archivo);
  const cards = el("div", {class: "inicio"});
  const pintar = (nb) => {
    marco.src = nb.archivo;
    cards.querySelectorAll(".card").forEach((c) => c.style.outline = c.dataset.id === nb.id ? "2px solid var(--accent)" : "none");
  };
  nbs.forEach((nb) => {
    const tools = el("div", {class: "tools"});
    if (nb.archivo) {
      tools.append(el("button", {class: "ghost", onclick: () => pintar(nb)}, "Ver aquí"));
      tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.archivo, "_blank", "noopener")}, "Abrir en pestaña nueva"));
    }
    if (nb.url) tools.append(el("button", {class: "ghost", onclick: () => window.open(nb.url, "_blank", "noopener")}, "Abrir en Databricks"));
    cards.append(el("div", {class: "card", "data-id": nb.id, style: "border-top:3px solid var(--accent)"},
      el("h2", {}, nb.titulo), el("div", {class: "sub", style: "flex:1"}, nb.descripcion), tools));
  });
  cont.append(cards);
  if (embebibles.length) { cont.append(marco); pintar(embebibles[0]); }
  return cont;
}

function ir(id) {
  const f = DATA.fuentes.find((x) => x.id === id);
  const sec = (DATA.secciones_nb || []).find((x) => x.id === id);
  const activo = f ? id : sec ? sec.id : "inicio";
  $("#vista").replaceChildren(f ? vistaFuente(f) : sec ? vistaSeccionNb(sec) : vistaInicio());
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === activo));
  history.replaceState(null, "", "#" + activo);
  scrollTo(0, 0);
}

function iniciar() {
  const tabs = $("#tabs");
  const pestanas = [{id: "inicio", pestana: "Inicio"}, ...DATA.fuentes, ...(DATA.secciones_nb || [])];
  pestanas.forEach((f) =>
    tabs.append(el("button", {role: "tab", "data-id": f.id, onclick: () => ir(f.id)}, f.pestana)));
  $("#sub").textContent = `Datos agregados de LinkedIn, bolsas de empleo y registros institucionales. Generado el ${DATA.generado}.`;
  $("#pie").textContent = "Fuentes: LinkedIn Talent Insights, Recruiter y Jobs, bolsas de empleo colombianas y registros institucionales. Cifras agregadas, sin datos de personas.";
  $("#cerrar").addEventListener("click", () => $("#ventana").close());
  $("#ventana").addEventListener("click", (e) => { if (e.target.id === "ventana") e.target.close(); });
  const tema = $("#tema");
  const raiz = document.documentElement;
  const oscuro = () => raiz.dataset.theme === "dark" || (!raiz.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const pintar = () => { tema.textContent = oscuro() ? "Modo claro" : "Modo oscuro"; };
  tema.addEventListener("click", () => { raiz.dataset.theme = oscuro() ? "light" : "dark"; pintar(); });
  pintar();
  ir(location.hash.slice(1) || "inicio");
}
iniciar();
</script>
</body>
</html>
