<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Antropología</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1C2236; --muted:#4f5a78; --line:#DAE1F2; --accent:#364775; --accent-ink:#ffffff;
  --track:#e9edf7; --warn-bg:#fff4e5; --warn-line:#FECA8E; --hero1:#1C2236; --hero2:#222D4E;
  --c1:#364775; --c2:#F36F0F; --c3:#96B3DF; --c4:#C23319; --c5:#FEAA46;
  --shadow:0 1px 2px rgba(28,34,54,.06),0 2px 8px rgba(28,34,54,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
    --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
    --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141829; --panel:#1C2236; --ink:#eef1fa; --muted:#a8b3d1; --line:#2d3860; --accent:#96B3DF; --accent-ink:#141829;
  --track:#2a3558; --warn-bg:#2f2616; --warn-line:#7a5a2a; --hero1:#0f1322; --hero2:#1C2236;
  --c1:#96B3DF; --c2:#F36F0F; --c3:#5d78b4; --c4:#e0583f; --c5:#FEAA46; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Verdana,Geneva,sans-serif}
header{background:var(--hero1);color:#fff;position:sticky;top:0;z-index:5;border-bottom:3px solid #F36F0F}
header .sub{color:rgba(255,255,255,.85)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
h1{font-size:clamp(15px,3.2vw,20px);margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:7px 14px;font:inherit;font-size:13px;color:#DAE1F2;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.12)}
nav button[aria-selected="true"]{background:#fff;color:#1C2236;font-weight:700;border-color:#fff}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin-top:-6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav[hidden]{display:none}
.subnav button{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;color:#c4cde6;cursor:pointer;white-space:nowrap}
.subnav button:hover{background:rgba(255,255,255,.1)}
.subnav button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.55);font-weight:700}
.inicio-grupo{font-size:16px;margin:24px 0 2px}
.inicio-grupo-sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:74ch}
.intro-f{margin-bottom:16px}
.intro-kpis{margin:2px 0 14px}
.intro-kpis .kpi{flex:1 1 170px}
.intro-kpis .kpi-num{font-size:26px}
.intro-f p{margin:0 0 8px;font-size:13.5px;line-height:1.55;color:var(--ink);max-width:90ch}
.intro-f p:last-child{margin-bottom:0;color:var(--muted)}
.analisis{margin:10px 0 2px;padding:10px 12px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:0 6px 6px 0}
.analisis p{margin:0 0 6px;font-size:12.5px;line-height:1.5}
.analisis p:last-child{margin-bottom:0}
.analisis .ana-b{padding-left:14px;position:relative}
.analisis .ana-b::before{content:"•";position:absolute;left:2px;color:var(--accent)}
.texto-bloque .txt-p{margin:0 0 9px;font-size:13.5px;line-height:1.55}
.texto-bloque .txt-b{margin:0 0 6px;padding-left:16px;position:relative;font-size:13px;line-height:1.5}
.texto-bloque .txt-b::before{content:"•";position:absolute;left:3px;color:var(--accent)}
.hm-wrap{overflow-x:auto;margin-top:4px}
.hm{border-collapse:collapse;font-size:11.5px;min-width:100%}
.hm th,.hm td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.hm .hm-h{font-weight:600;color:var(--muted);font-size:10.5px;max-width:92px;white-space:normal;line-height:1.2}
.hm .hm-row{text-align:left;font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1}
.hm .hm-esq{background:var(--panel);position:sticky;left:0;z-index:2}
.hm .hm-cell{font-variant-numeric:tabular-nums}
.apil-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.apil-lab{flex:0 0 160px;font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.apil-bar{flex:1;display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--track)}
.apil-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:0}
.dv-row{display:flex;align-items:center;gap:10px;margin:11px 0}
.dv-lab{flex:0 0 160px;font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.dv-bars{flex:1;display:flex;flex-direction:column;gap:5px}
.dv-track{position:relative;height:15px;background:var(--track);border-radius:3px}
.dv-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--muted)}
.dv-seg{position:absolute;top:0;height:100%;border-radius:3px}
.dv-num{position:absolute;top:0;font-size:10.5px;line-height:15px;font-weight:600;color:var(--ink)}
.chart-card.full{grid-column:1/-1}
.chart-card.full .texto-bloque{columns:2;column-gap:28px}
@media (max-width:760px){.chart-card.full .texto-bloque{columns:1}.apil-lab{flex-basis:110px}}
button.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
header button.ghost{background:transparent;color:#DAE1F2;border-color:rgba(255,255,255,.28)}
button.ghost:hover{border-color:var(--accent)}
button.ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:20px 0 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel{padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 8px}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:3px 0}
.warn{background:var(--warn-bg);border-color:var(--warn-line)}
details.panel summary{cursor:pointer;font-weight:600;font-size:15px}
details.panel[open] summary{margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.grid.doc{grid-template-columns:1fr;max-width:1000px}
.chart-card{padding:16px 18px 14px;display:flex;flex-direction:column;min-width:0;border-top:3px solid var(--accent)}
.chart-card h3{font-size:13.5px;margin:0 0 2px;line-height:1.3}
.nota{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.clave{font-size:12.5px;line-height:1.4;color:var(--ink);background:var(--fa,var(--accent));background:color-mix(in srgb,var(--fa,var(--accent)) 12%,transparent);border-left:3px solid var(--fa,var(--accent));border-radius:6px;padding:8px 10px;margin:0 0 12px}
.filtros{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:0 0 14px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;position:sticky;top:var(--hh,60px);z-index:4;background:var(--panel);box-shadow:var(--shadow)}
.fgrupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flab{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.fbtn{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fbtn.comparar{margin-left:10px}
.fbtn.comparar.on{background:#F36F0F;border-color:#F36F0F;color:#fff}
.fhint{flex-basis:100%;font-size:11.5px;color:var(--muted);margin:0}
.nmini{font-size:11.5px;color:var(--muted);margin:-2px 0 6px}
.nmini .peque{color:var(--accent)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.kpi{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi-num{font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpi-lab{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tema{margin-top:26px;scroll-margin-top:130px}
.tema[hidden]{display:none}
.tema-t{font-size:14px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.tema-t::before{content:"";width:6px;height:22px;border-radius:1px;background:#F36F0F}
.tema-t span{font-size:12px;font-weight:600;background:var(--track);color:var(--muted);border-radius:3px;padding:1px 8px;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input[type=search]{flex:1 1 220px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.hbar .pistas{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.pista{display:flex;align-items:center;gap:6px}
.pista .tr{flex:1;background:var(--track);border-radius:2px;height:14px}
.pista .rel{height:100%;border-radius:2px;min-width:3px}
.pista .val{min-width:46px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--ink)}
.vbar{display:flex;align-items:flex-end;gap:6px;height:240px;padding-top:18px;border-bottom:1px solid var(--line)}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vgrp{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.vgrp div{flex:1;max-width:44px;border-radius:2px 2px 0 0;position:relative;min-height:2px}
.vgrp span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.vlabs{display:flex;gap:6px;margin-top:5px}
.vlabs div{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.pie-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pie{flex:0 0 180px;max-width:180px}
.pie svg{width:100%;height:auto;display:block}
.pie svg path,.pie svg circle{stroke:var(--panel);stroke-width:1.5}
.pie-leg{flex:1 1 180px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.pie-item{display:flex;align-items:center;gap:8px;line-height:1.25}
.pie-item i{display:inline-block;width:11px;height:11px;border-radius:2px;flex:0 0 auto}
.pie-lab{flex:1;color:var(--ink)}
.pie-val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:340px;overflow:auto}
.chart-img{margin-top:6px}
.chart-img img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0;width:min(980px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,15,25,.55)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px 0}
.dlg-head h3{margin:0;font-size:17px}
.dlg-body{padding:12px 20px 20px;overflow:auto;max-height:calc(90vh - 80px)}
.hero{padding:24px 22px}
.hero h2{font-size:22px;margin:0 0 8px}
.hero .sub{font-size:14.5px;line-height:1.5}
.inicio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.inicio .card{transition:box-shadow .15s,transform .15s}
.inicio .card:hover{box-shadow:0 6px 18px rgba(28,34,54,.12);transform:translateY(-2px)}
.inicio .card{padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--accent);min-height:150px}
.inicio h2{margin:0;font-size:15px}
.inicio .n{font-size:34px;font-weight:700;line-height:1;color:var(--accent);margin-top:6px}
.inicio button{margin-top:auto;align-self:flex-start}
.vacio{color:var(--muted);padding:30px;text-align:center}
.nb-frame{width:100%;height:72vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px;display:block}
footer{color:var(--muted);font-size:12.5px;padding:0 0 30px}
@media (max-width:560px){.hbar{grid-template-columns:minmax(80px,40%) 1fr}.wrap{padding:0 12px}.top{flex-wrap:wrap}.tools .ghost{flex:1 1 auto;text-align:center}.vbar{height:200px}.grid{gap:12px}dialog{width:98vw}.dlg-body{padding:10px 12px 16px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Antropología Uniandes: tablero de estudios</h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="ghost" id="tema" aria-pressed="false" title="Cambiar entre claro y oscuro">Modo oscuro</button>

    <nav id="tabs" role="tablist" aria-label="Secciones"></nav>

</header>
<main class="wrap" id="vista"></main>
<div class="wrap"><footer id="pie"></footer></div>
<dialog id="ventana" aria-labelledby="vt">

    <button class="ghost" id="cerrar" aria-label="Cerrar">Cerrar</button></div>
  <div class="dlg-body" id="vc"></div>
</dialog>

ología (grados 2021 a 2025): lo que hicieron en la universidad (doble titulación, opciones académicas, tiempo para graduarse, prácticas, posgrados, retiros y reintegros) y lo que hicieron después en el mercado laboral, según su perfil de LinkedIn. El objetivo es identificar qué aspectos de la formación se asocian con una mejor inserción laboral y en qué medida los egresados se desempeñan como antropólogos.", "doc": true, "hallazgos": [], "advertencias": [], "graficas": [{"titulo": "¿A quiénes cubre el análisis?", "cab": ["Paso", "Egresados", "Qué significa"], "filas": [["Egresados del programa", "190", "Total de graduados de Antropología 2021-2025."], ["Registran experiencia en LinkedIn", "149 (78,4 %)", "Son el universo del análisis: todos los porcentajes se calculan sobre ellos. Los 41 restantes no tienen experiencias registradas; eso no significa que estén desempleados, por eso no se incluyen."], ["Tienen alguna experiencia profesional", "139", "Los otros 10 solo registran monitorías, prácticas o pasantías."], ["Tienen experiencia profesional después del grado", "130 (87,2 %)", "Experiencia vigente o iniciada después de la fecha de grado."], ["Tienen hoy un empleo profesional", "98 (65,8 %)", "Base de los análisis sobre el empleo actual."]], "nota": "", "tipo": "tabla", "tema": ""}, {"titulo": "¿Qué se cuenta como experiencia profesional?", "tipo": "texto", "texto": ["Los 149 egresados registran 901 experiencias en LinkedIn. De ellas, 283 no se cuentan como empleo profesional: 141 monitorías o asistencias académicas, 124 prácticas o pasantías y 18 experiencias con nivel de practicante o con contrato de prácticas o de formación.", "Quedan 618 experiencias profesionales, de las cuales 384 son posteriores al grado. Sobre estas se calculan los indicadores.", "Las prácticas sí se analizan, pero aparte: en la sección de prácticas se revisa si el egresado continuó trabajando en la organización donde hizo su práctica."], "cab": [], "filas": [], "nota": "", "tema": ""}, {"titulo": "¿Cuándo se considera que un empleo es «de Antropología»?", "tipo": "texto", "texto": ["Cuando el cargo es explícito (antropólogo, etnógrafo, arqueólogo) o cuando corresponde a investigación social o a gestión social o cultural. Para quienes tienen doble titulación, una IA clasificó con criterio estricto si el cargo exige el otro pregrado."], "cab": [], "filas": [], "nota": "", "tema": ""}, {"titulo": "Reglas base (aplican a todos los indicadores)", "cab": ["Regla", "Definición"], "filas": [["Empleo profesional", "Toda experiencia, excepto las que tengan: CARGO_GRUPO = «Monitoría y asistencia académica» o «Practicante o pasante»; NIVEL_CARGO = practicante; o TIPO_EMPLEO = «Contrato de prácticas» o «Contrato de formación»."], ["Empleo después del grado", "Cumple al menos una de estas condiciones: es actual (ES_ACTUAL); termina en la fecha de grado o después; o no tiene fecha de fin y empieza en la fecha de grado o después."], ["Empleo actual principal", "Entre los empleos profesionales con ES_ACTUAL = true, el de menor ORDEN, es decir, el primero del perfil."], ["Nivel del cargo (NIVEL_CARGO)", "1 = asistente; 2 = profesional; 3 = coordinador; 4 = director, socio o C-level. Los cargos sin nivel clasificado no puntúan."], ["Relación con Antropología", "CORRESPONDE_ANTROPOLOGIA = «Sí», que agrupa directa, afín por investigación y afín por gestión social o cultural."]], "nota": "", "tipo": "tabla", "tema": ""}, {"titulo": "Indicadores", "cab": ["Indicador", "Cuenta como 1 si…", "Detalles"], "filas": [["Empleo profesional después del grado", "Tiene al menos 1 empleo profesional después del grado.", ""], ["Empleo profesional actual", "Tiene al menos 1 empleo profesional con ES_ACTUAL = true.", "Incluye empleos actuales que empezaron antes del grado."], ["Inserción en 6 meses o menos", "Su primer empleo profesional después del grado empezó 6 meses o menos después de la fecha de grado.", "meses = (inicio − fecha de grado) / 30,44, redondeado. Si ya trabajaba (empezó antes del grado) cuenta como 0, es decir, como inserción. Se toma el mínimo entre sus empleos; los que no tienen fecha de inicio no entran, y si ninguno tiene fecha la persona cuenta como 0."], ["Coordinación o superior", "El nivel máximo entre sus empleos profesionales después del grado es ≥ 3 (coordinador, director, socio o C-level).", "Se considera cualquier empleo después del grado, no solo el actual. Los cargos sin nivel clasificado no suman."], ["Empleo actual afín a Antropología", "Al menos uno de sus empleos profesionales actuales tiene CORRESPONDE_ANTROPOLOGIA = «Sí».", "Se revisan todos los empleos actuales, no solo el principal. Quien no tiene empleo actual cuenta como 0."]], "nota": "", "tipo": "tabla", "tema": ""}], "descripcion": "Qué cubre el análisis integrado, cómo se define el empleo profesional y qué significan los indicadores. Léelo antes de la sección de Análisis.", "clave": ""}, {"id": "cruces", "pestana": "Análisis", "titulo": "Análisis integrado: trayectoria académica y laboral", "fuente": "Fuente: caracterización académica cruzada con LinkedIn (Recruiter), posgrados y productos de mercado", "intro": "", "intro_kpis": [{"num": "149 / 190", "lab": "egresados (78,4 %) con experiencia en LinkedIn (grados 2021–2025)"}, {"num": "98 / 149", "lab": "egresados (65,8 %) con empleo actual (no cuentan prácticas, pasantías, monitorías ni asistencias académicas)"}, {"num": "158 / 190", "lab": "egresados (83,1 %) registran formación en LinkedIn (grados 2021–2025)"}, {"num": "901", "lab": "experiencias registradas por los egresados en LinkedIn"}, {"num": "87,2 %", "lab": "registra empleo profesional después del grado (65,8 % lo tiene hoy)"}, {"num": "67,1 %", "lab": "se insertó en 6 meses o menos"}, {"num": "21,5 %", "lab": "tiene al menos un empleo actual relacionado con Antropología"}], "hallazgos": [], "advertencias": [], "graficas": [{"titulo": "Resumen laboral del universo (149 egresados con LinkedIn)", "cab": ["Indicador", "% de egresados"], "filas": [["Empleo profesional después del grado", 87.2], ["Empleo profesional actual", 65.8], ["Inserción en ≤ 6 meses", 67.1], ["Cargo de coordinación o superior", 29.5], ["Empleo actual relacionado con Antropología", 21.5]], "nota": "Indicadores sobre los 149 egresados con experiencia en LinkedIn. La mediana de meses al primer empleo es 0.", "tema": "Panorama y factores", "tipo": "horizontal", "analisis": "• Universo: 149 de los 190 egresados (78 %) con al menos una experiencia en LinkedIn; no representa a quienes no tienen perfil.\n• Se usan las 901 experiencias registradas.\n• El 87,2 % registra empleo profesional después del grado y el 65,8 % lo tiene hoy. La mediana de meses al primer empleo es 0 porque muchos ya trabajaban al graduarse.\n• El 67,1 % se insertó en 6 meses o menos y el 29,5 % llegó a coordinación o superior.\n• Solo el 21,5 % tiene al menos un empleo actual relacionado con Antropología.\n• 324 experiencias no tienen fecha de inicio, lo que limita los indicadores de tiempo.\n• 39 egresados tienen posgrado graduado: 12 en el registro de graduados (11 también en LinkedIn) y 27 solo en LinkedIn."}, {"titulo": "Experiencias por nivel de cargo (todas)", "cab": ["Nivel de cargo", "Experiencias"], "filas": [["Profesional", 319], ["Asistente", 235], ["Sin clasificar", 139], ["Practicante", 117], ["Coordinador", 45], ["Director", 29], ["Socio", 14], ["C-level", 3]], "nota": "Las 901 experiencias en LinkedIn por nivel de cargo. Los indicadores laborales solo cuentan empleo profesional (se excluyen monitorías, prácticas, pasantías y contratos de formación).", "tema": "Panorama y factores", "tipo": "horizontal", "analisis": "• Universo: 149 de los 190 egresados (78 %) con al menos una experiencia en LinkedIn; no representa a quienes no tienen perfil.\n• Se usan las 901 experiencias registradas.\n• El 87,2 % registra empleo profesional después del grado y el 65,8 % lo tiene hoy. La mediana de meses al primer empleo es 0 porque muchos ya trabajaban al graduarse.\n• El 67,1 % se insertó en 6 meses o menos y el 29,5 % llegó a coordinación o superior.\n• Solo el 21,5 % tiene al menos un empleo actual relacionado con Antropología.\n• 324 experiencias no tienen fecha de inicio, lo que limita los indicadores de tiempo.\n• 39 egresados tienen posgrado graduado: 12 en el registro de graduados (11 también en LinkedIn) y 27 solo en LinkedIn."}, {"titulo": "Matriz de factores — Doble titulación", "cab": ["Indicador", "No (n=69)", "Sí (n=80)"], "filas": [["Empleo post-grado", 84.1, 90.0], ["Empleo actual", 66.7, 65.0], ["Inserción ≤ 6 meses", 65.2, 68.8], ["Coordinación o +", 26.1, 32.5], ["Empleo afín", 26.1, 17.5]], "nota": "Ningún indicador muestra diferencia significativa por doble titulación.", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Opción académica", "cab": ["Indicador", "No (n=103)", "Sí (n=46)"], "filas": [["Empleo post-grado", 84.5, 93.5], ["Empleo actual", 62.1, 73.9], ["Inserción ≤ 6 meses", 61.2, 80.4], ["Coordinación o +", 30.1, 28.3], ["Empleo afín", 17.5, 30.4]], "nota": "La opción académica se asocia con más inserción rápida (80,4 % vs 61,2 %, p = 0,024, significativa) y un indicio de más empleo afín.", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Tiempo para grado", "cab": ["Indicador", "1 sem. adic. (n=33)", "2+ sem. adic. (n=48)", "A tiempo (n=68)"], "filas": [["Empleo post-grado", 84.8, 83.3, 91.2], ["Empleo actual", 75.8, 60.4, 64.7], ["Inserción ≤ 6 meses", 72.7, 52.1, 75.0], ["Coordinación o +", 21.2, 33.3, 30.9], ["Empleo afín", 30.3, 16.7, 20.6]], "nota": "Graduarse a tiempo se asocia con inserción más rápida (75 % vs 52,1 % con 2+ semestres, p = 0,026).", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Práctica CTP", "cab": ["Indicador", "No (n=57)", "Sí (n=92)"], "filas": [["Empleo post-grado", 93.0, 83.7], ["Empleo actual", 70.2, 63.0], ["Inserción ≤ 6 meses", 70.2, 65.2], ["Coordinación o +", 29.8, 29.3], ["Empleo afín", 29.8, 16.3]], "nota": "Quienes no hicieron práctica muestran un indicio de más empleo afín (29,8 % vs 16,3 %, p = 0,065).", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Matriz de factores — Posgrado", "cab": ["Indicador", "En curso (n=20)", "Graduado (n=39)", "Sin posgrado (n=90)"], "filas": [["Empleo post-grado", 90.0, 87.2, 86.7], ["Empleo actual", 65.0, 61.5, 67.8], ["Inserción ≤ 6 meses", 75.0, 64.1, 66.7], ["Coordinación o +", 30.0, 25.6, 31.1], ["Empleo afín", 25.0, 25.6, 18.9]], "nota": "El posgrado no muestra diferencias concluyentes en estos indicadores.", "tema": "Factores académicos y empleo", "tipo": "horizontal", "analisis": "• Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.\n• En el empleo actual ningún factor marca una diferencia significativa.\n• Las diferencias significativas están en la rapidez de inserción (≤ 6 meses): opción académica 80,4 % vs 61,2 % (p = 0,024); tiempo para grado 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales (p = 0,026).\n• Indicios en el empleo actual afín: con opción académica 30,4 % vs 17,5 % (p = 0,087); sin práctica CTP 29,8 % vs 16,3 % con práctica (p = 0,065).\n• Doble titulación (17,5 % vs 26,1 %; p = 0,233) y posgrado no muestran diferencias concluyentes.\n• Con 25 pruebas, alrededor de 1 podría salir significativa por azar; lo más sólido es la relación de la opción académica y del tiempo para grado con la inserción rápida."}, {"titulo": "Conclusiones — Factores académicos y empleo", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "Factores académicos y empleo", "texto": ["Se analizan 5 factores: doble titulación, opción académica, tiempo para grado, práctica CTP y posgrado.", "En el empleo actual ningún factor marca una diferencia significativa, ni en la comparación directa ni ajustando por meses desde el grado.", "Las diferencias significativas están en la rapidez de inserción (≤ 6 meses):", "• Opción académica: 80,4 % vs 61,2 %.", "• Tiempo para grado: 75 % a tiempo vs 52,1 % con 2 o más semestres adicionales.", "Indicios en el empleo actual afín a Antropología:", "• Con opción académica, 30,4 % vs 17,5 %.", "• Sin práctica CTP, 29,8 % vs 16,3 % con práctica.", "Doble titulación (17,5 % vs 26,1 %) y posgrado no muestran diferencias concluyentes en el empleo afín."]}, {"titulo": "Continuidad en la organización de práctica", "cab": ["Nivel de continuidad", "Egresados (de 88 con sitio de práctica)"], "filas": [["Registra alguna experiencia en la organización", 74], ["Empleo profesional post-grado en ella", 12], ["Trabaja actualmente en ella", 5]], "nota": "De 88 egresados con sitio de práctica, 74 (84,1 %) registran alguna experiencia allí; solo 12 (13,6 %) un empleo profesional post-grado y 5 (5,7 %) hoy.", "tema": "Prácticas y continuidad", "analisis": "• La organización de práctica se compara con las empresas de LinkedIn con reglas flexibles de nombre (palabras en común, nombre compacto, siglas y palabras distintivas).\n• De los 88 egresados con sitio de práctica, el 84,1 % (74) registra en LinkedIn alguna experiencia en esa organización, casi siempre la propia práctica.\n• Solo 12 (13,6 %) tuvieron empleo profesional post-grado allí y 5 (5,7 %) trabajan hoy en ella.\n• De los 12 con continuidad, el 83,3 % tiene empleo actual y el 25 % empleo afín; sin continuidad caen a 60 % de empleo actual y 15 % de empleo afín.\n• Quienes no hicieron práctica tienen más empleo actual (70,2 %), pero el 52,6 % ya trabajaba al graduarse (vs 43,5 %): la práctica es la vía de entrada de quienes no tenían experiencia."}, {"titulo": "Resultados laborales según práctica y continuidad", "cab": ["Indicador", "Con continuidad (n=12)", "Sin continuidad (n=80)", "Sin práctica (n=57)"], "filas": [["Empleo actual %", 83.3, 60.0, 70.2], ["Inserción ≤ 6 meses %", 91.7, 61.3, 70.2], ["Coordinación o superior %", 16.7, 31.2, 29.8], ["Empleo afín a Antropología %", 25.0, 15.0, 29.8]], "nota": "'Con continuidad' = tuvo empleo profesional post-grado en la organización de la práctica.", "tema": "Prácticas y continuidad", "analisis": "• La organización de práctica se compara con las empresas de LinkedIn con reglas flexibles de nombre (palabras en común, nombre compacto, siglas y palabras distintivas).\n• De los 88 egresados con sitio de práctica, el 84,1 % (74) registra en LinkedIn alguna experiencia en esa organización, casi siempre la propia práctica.\n• Solo 12 (13,6 %) tuvieron empleo profesional post-grado allí y 5 (5,7 %) trabajan hoy en ella.\n• De los 12 con continuidad, el 83,3 % tiene empleo actual y el 25 % empleo afín; sin continuidad caen a 60 % de empleo actual y 15 % de empleo afín.\n• Quienes no hicieron práctica tienen más empleo actual (70,2 %), pero el 52,6 % ya trabajaba al graduarse (vs 43,5 %): la práctica es la vía de entrada de quienes no tenían experiencia."}, {"titulo": "Conclusiones — Prácticas y continuidad", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "Prácticas y continuidad", "texto": ["De los 88 egresados con sitio de práctica, el 84,1 % (74) registra en LinkedIn alguna experiencia en esa organización, casi siempre la propia práctica.", "12 (13,6 %) tuvieron empleo profesional post-grado allí y 5 (5,7 %) tienen hoy un empleo profesional en ella. No cuentan prácticas, pasantías, monitorías ni contratos de formación.", "Universidad de los Andes (9) e Historias en Kilómetros (8) son las organizaciones con más coincidencias registradas.", "De los 12 con continuidad, el 83,3 % tiene empleo actual, pero solo 5 (41,7 %) siguen en la organización de práctica. El 91,7 % se insertó en ≤ 6 meses y el 25 % tiene empleo afín.", "Quienes hicieron práctica sin continuidad muestran los indicadores más bajos (60 % de empleo actual y 15 % de empleo afín).", "Quienes no hicieron práctica tienen más empleo actual (70,2 %), pero el 52,6 % ya trabajaba al graduarse, frente a 43,5 % de quienes sí la hicieron. La práctica parece ser la vía de entrada de quienes no tenían experiencia."]}, {"titulo": "Tipo de organización del empleo actual según posgrado", "cab": ["Estado de posgrado", "Educación %", "Entidad pública %", "Empresa %", "ONG / internacional %"], "filas": [["Sin posgrado", 8.2, 9.8, 70.5, 8.2], ["Posgrado en curso", 7.7, 30.8, 46.2, 0.0], ["Posgrado graduado", 29.2, 25.0, 41.7, 4.2]], "nota": "El posgrado se asocia con un cambio de sector (más educación y sector público, menos empresa).", "tema": "Posgrado", "tipo": "vertical", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %; y más investigación afín (29,2 % vs 4,9 %).\n• No hay evidencia de que lleve a mejores cargos: coordinación o superior 29,4 % vs 35,9 %; nivel actual promedio 2,0 vs 2,45 (OR ajustado 0,67; p = 0,386).\n• Los graduados de posgrado llevan 45 meses desde el grado de Antropología pero solo 15 desde el posgrado: poco tiempo para notar un efecto.\n• El posgrado se asocia más con un cambio de sector que con un ascenso jerárquico.\n• Inserción desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo; el 25,6 % termina en 2026 y no se puede evaluar aún. Solo 24 graduados de posgrado tienen empleo actual: leer con cautela."}, {"titulo": "Relación del empleo actual con Antropología según posgrado", "cab": ["Estado de posgrado", "Investigación afín %", "Gestión social/cultural %", "Directa %", "No relacionado %"], "filas": [["Sin posgrado", 4.9, 14.8, 4.9, 75.4], ["Posgrado en curso", 7.7, 15.4, 7.7, 69.2], ["Posgrado graduado", 29.2, 8.3, 0.0, 62.5]], "nota": "Los graduados de posgrado tienen más cargos de investigación afín y menos empleos no relacionados.", "tema": "Posgrado", "tipo": "vertical", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %; y más investigación afín (29,2 % vs 4,9 %).\n• No hay evidencia de que lleve a mejores cargos: coordinación o superior 29,4 % vs 35,9 %; nivel actual promedio 2,0 vs 2,45 (OR ajustado 0,67; p = 0,386).\n• Los graduados de posgrado llevan 45 meses desde el grado de Antropología pero solo 15 desde el posgrado: poco tiempo para notar un efecto.\n• El posgrado se asocia más con un cambio de sector que con un ascenso jerárquico.\n• Inserción desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo; el 25,6 % termina en 2026 y no se puede evaluar aún. Solo 24 graduados de posgrado tienen empleo actual: leer con cautela."}, {"titulo": "Situación laboral al terminar el posgrado", "cab": ["Situación", "% de graduados de posgrado"], "filas": [["Ya trabajaba al terminar el posgrado", 48.7], ["Termina en 2026 (sin fecha exacta)", 25.6], ["Sin empleo profesional después", 12.8], ["Nuevo empleo en ≤ 6 meses", 10.3], ["Nuevo empleo en > 6 meses", 2.6]], "nota": "Con 39 graduados de posgrado; casi la mitad ya trabajaba al terminarlo.", "tema": "Posgrado", "tipo": "horizontal", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %; y más investigación afín (29,2 % vs 4,9 %).\n• No hay evidencia de que lleve a mejores cargos: coordinación o superior 29,4 % vs 35,9 %; nivel actual promedio 2,0 vs 2,45 (OR ajustado 0,67; p = 0,386).\n• Los graduados de posgrado llevan 45 meses desde el grado de Antropología pero solo 15 desde el posgrado: poco tiempo para notar un efecto.\n• El posgrado se asocia más con un cambio de sector que con un ascenso jerárquico.\n• Inserción desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo; el 25,6 % termina en 2026 y no se puede evaluar aún. Solo 24 graduados de posgrado tienen empleo actual: leer con cautela."}, {"titulo": "Nivel máximo de cargo alcanzado después del grado, según posgrado", "cab": ["Estado de posgrado", "Asistente %", "Profesional %", "Coordinación %", "Dirección / socio / C-level %", "Sin clasificar %"], "filas": [["Posgrado graduado (n=34)", 12, 56, 15, 15, 3], ["Posgrado en curso (n=18)", 6, 50, 17, 17, 11], ["Sin posgrado (n=78)", 9, 46, 17, 19, 9]], "nota": "Distribución del nivel máximo de cargo alcanzado después del grado (sobre los egresados con empleo post-grado). No hay evidencia de que el posgrado lleve a cargos de mayor nivel.", "tema": "Posgrado", "tipo": "apilada", "analisis": "• La Maestría en Antropología es el posgrado más intentado en Uniandes (7 intentos, 4 grados).\n• El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %; y más investigación afín (29,2 % vs 4,9 %).\n• No hay evidencia de que lleve a mejores cargos: coordinación o superior 29,4 % vs 35,9 %; nivel actual promedio 2,0 vs 2,45 (OR ajustado 0,67; p = 0,386).\n• Los graduados de posgrado llevan 45 meses desde el grado de Antropología pero solo 15 desde el posgrado: poco tiempo para notar un efecto.\n• El posgrado se asocia más con un cambio de sector que con un ascenso jerárquico.\n• Inserción desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo; el 25,6 % termina en 2026 y no se puede evaluar aún. Solo 24 graduados de posgrado tienen empleo actual: leer con cautela."}, {"titulo": "Conclusiones — Posgrado", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "Posgrado", "texto": ["En LinkedIn predominan las maestrías, pero la mayoría no tiene área visible (28 registros). Entre las visibles destacan ciencia política; desarrollo, migración y acción humanitaria; y economía y negocios (4 maestrías cada una).", "El posgrado cambia el tipo de organización del empleo actual (graduados vs sin posgrado): educación 29,2 % vs 8,2 %; entidad pública 25 % vs 9,8 %; empresa 41,7 % vs 70,5 %.", "También hay más cargos de investigación afín (29,2 % vs 4,9 %) y menos empleos no relacionados con Antropología (62,5 % vs 75,4 %).", "Solo 24 graduados de posgrado tienen empleo actual, así que estas proporciones deben leerse con cautela.", "No hay evidencia de que el posgrado lleve a cargos de mayor nivel: coordinación o superior 29,4 % de los graduados de posgrado vs 35,9 % sin posgrado.", "Los graduados de posgrado llevan 45 meses desde el grado de Antropología, pero solo 15 desde el posgrado: ha pasado poco tiempo para que se note un efecto.", "Solo 8 graduados de posgrado tienen cargos con nivel y fecha antes y después del posgrado; son muy pocos para comparar a las mismas personas.", "Inserción contada desde el posgrado (39 graduados): el 48,7 % ya trabajaba al terminarlo y el 10,3 % consiguió un nuevo empleo en ≤ 6 meses.", "Entre los 29 evaluables, el 79,3 % tiene empleo en ≤ 6 meses desde el posgrado, frente a 69 % desde el pregrado. Pero 19 de los 29 ya trabajaban al terminar el posgrado, así que la diferencia refleja sobre todo la experiencia acumulada, no necesariamente un efecto del posgrado.", "El 25,6 % termina el posgrado en 2026 y no tiene fecha exacta, así que no se puede evaluar todavía."]}, {"titulo": "Brecha laboral de quienes tuvieron cada novedad (p.p. vs quienes no)", "cab": ["Novedad académica", "Empleo actual (p.p.)", "Inserción ≤ 6 meses (p.p.)"], "filas": [["Retiro (n=33)", -6.6, -12.2], ["Reintegro (n=37)", -8.4, -6.6], ["Prueba académica (n=6)", 18.3, -17.8], ["Suspensión (n=3)", 0.9, -0.4], ["Reingreso (n=3)", 0.9, -0.4]], "nota": "Una barra a la izquierda del 0 (negativa) = a quienes tuvieron la novedad les va peor; a la derecha, mejor. Solo retiro (n=33) y reintegro (n=37) son legibles; las demás tienen tan pocos casos que una persona mueve mucho el porcentaje.", "tema": "Trayectoria académica", "tipo": "divergente", "analisis": "Qué muestra: para cada novedad, cuántos puntos porcentuales (p.p.) más o menos tienen quienes la tuvieron frente a quienes no. La barra azul es el empleo actual y la naranja la inserción en ≤ 6 meses después del grado. Base: los 149 egresados con experiencia en LinkedIn.\nCómo se interpreta: una barra a la izquierda del 0 (negativa) significa que a quienes tuvieron la novedad les va peor; a la derecha, mejor. Mientras más larga la barra, más grande la diferencia.\nLas únicas barras que se pueden leer son retiro (n=33) y reintegro (n=37). Prueba académica (6), suspensión (3) y reingreso (3) tienen tan pocos casos que una sola persona mueve el porcentaje entre 17 y 33 puntos; sus barras, aunque algunas se vean grandes, no dicen nada."}, {"titulo": "Motivos de retiro y empleo actual", "cab": ["Motivo de retiro", "Egresados", "% con empleo actual"], "filas": [["Motivos de salud", 9, 30.0], ["Motivos financieros", 6, 66.7], ["Situación académica", 4, 50.0], ["Cursos no cumplen expectativas", 2, 100.0], ["Motivos laborales", 2, 100.0], ["Intercambio / práctica", 1, 100.0]], "nota": "El motivo de retiro más frecuente es la salud; los grupos son muy pequeños, se leen como casos.", "tema": "Trayectoria académica", "tipo": "tabla", "analisis": "• Las novedades más frecuentes son los retiros (33) y los reintegros (37); ambas se asocian con indicadores más bajos.\n• Retiro (con vs sin): empleo actual 60,6 % vs 67,2 %; inserción ≤ 6 meses 57,6 % vs 69,8 %; empleo post-grado 78,8 % vs 89,7 %.\n• Reintegro (con vs sin): empleo actual 59,5 % vs 67,9 %.\n• El porcentaje en coordinación o superior es parecido (27,3 % con retiro vs 30,2 % sin): una vez insertados, la trayectoria no parece frenar el ascenso.\n• Prueba académica (6), suspensión (3) y reingreso (3) tienen muy pocos casos para concluir.\n• El motivo de retiro más frecuente es la salud (9 casos), seguido de los motivos financieros (6)."}, {"titulo": "Conclusiones — Trayectoria académica", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "Trayectoria académica", "texto": ["Quienes interrumpieron sus estudios tienen una desventaja laboral, sobre todo al salir. Con retiro, la inserción en ≤ 6 meses es 12,2 p.p. menor (57,6 % vs 69,8 %): en un grupo de 33 personas equivale a unas 4 personas menos con empleo rápido. En el empleo actual la brecha es menor (−6,6 p.p., unas 2 personas), lo que sugiere que la desventaja es mayor al inicio y se reduce con el tiempo, aunque no desaparece.", "Retiro y reintegro son casi el mismo grupo. 28 de los 33 egresados con retiro también tuvieron reintegro, por eso las dos novedades muestran el mismo patrón (reintegro: −8,4 p.p. en empleo actual y −6,6 p.p. en inserción). No son dos problemas distintos, sino una misma trayectoria: salir del programa y volver.", "La desventaja está en conseguir empleo, no en ascender. Aunque tienen menos empleo, el porcentaje de quienes tuvieron retiro que ha llegado a coordinación o superior es casi igual al de los demás (27,3 % vs 30,2 %).", "Detrás puede haber causas personales más que académicas. El motivo de retiro más frecuente es la salud (9 casos), y ese grupo tiene el empleo actual más bajo (30 %) y una inserción de 40 %. Esto apunta a que las mismas condiciones que llevaron al retiro (salud, situación económica) pueden seguir afectando la vida laboral después del grado."]}, {"titulo": "Relación del empleo con Antropología: qué se mide", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "Formación y ocupación", "texto": ["Qué se mide: la trayectoria completa. Para cada egresado se revisan todos sus empleos profesionales después del grado (actuales y pasados) y se toma el más cercano a Antropología. Así se ve cómo les ha ido en general, no solo en su empleo de hoy.", "Población: todos los 149 egresados con experiencia en LinkedIn. Quienes no han tenido empleo profesional después del grado aparecen como «Sin empleo profesional después del grado» (gris claro), así cada barra suma 100 % del grupo.", "Alguna vez (medida principal de la gráfica): % del grupo que ha tenido algún empleo profesional relacionado con Antropología después del grado. Hoy (referencia): % del grupo con un empleo actual relacionado.", "La gráfica tiene tres bloques: doble titulación (Sí / No), opción académica (Sí / No) y perfil combinado.", "El perfil combinado cruza los dos factores y ubica a cada egresado en uno solo de 4 grupos; por eso aparece 4 veces. Todos son tenido alguna vez un empleo relacionado con Antropología. La investigación es la vía más común, en todos los grupos (entre 20,7 % y 33,3 %).", "Doble titulación: el 45 % ha trabajado alguna vez en Antropología, frente a 52,2 % sin ella (p = 0,414, no concluyente). La diferencia está en los cargos directos de antropólogo, etnógrafo o arqueólogo (3,8 % vs 14,5 %); en investigación tienen incluso algo más (30 % vs 24,6 %).", "Opción académica: 56,5 % vs 44,7 % sin ella (p = 0,215, no concluyente). Solo el 6,5 % de quienes tienen opción no ha tenido empleo profesional después del grado, frente a 15,5 % sin opción. Hoy la diferencia es mayor (30,4 % vs 17,5 %, indicio, p = 0,087). La opción orienta hacia la gestión social o cultural (17,4 % vs 9,7 % alguna vez).", "Perfil combinado (cada egresado en uno solo de 4 grupos): solo opción académica (n=40) es el de mejor trayectoria (60 % alguna vez, solo 7,5 % sin empleo); solo doble titulación (n=74): 45,9 % alguna vez, 10,8 % sin empleo; solo Antropología (n=29): 41,4 % alguna vez, el grupo con más egresados sin empleo (27,6 %) pero con la mayor proporción de cargos directos (17,2 %); doble titulación + opción (n=6): 33,3 % alguna vez. Las diferencias no son significativas (p = 0,327).", "De los 46 egresados con opción académica (34 con empleo actual): hoy, 14 trabajan en Antropología (1 directo, 3 investigación, 10 gestión social o cultural); alguna vez después del grado, 26 (5 directo, 13 investigación, 8 gestión). La investigación pesa más en la trayectoria y la gestión social o cultural en el empleo de hoy. Por opción, ninguna supera los 6 egresados, así que se leen como casos."]}, {"titulo": "¿Se desempeña en Antropología? empleo de hoy y trayectoria", "cab": ["Indicador", "% con empleo actual", "% alguna vez post-grado"], "filas": [["Se desempeña en Antropología (cargo explícito + investigación + gestión social/cultural)", 32.7, 55.4], ["de ellos: cargo explícito de antropólogo, etnógrafo o arqueólogo", 4.1, 10.0]], " No", 3, 4], ["Sí", 0, 2]], "n": 7}}, "disp": [{"sum": 2}, {"pct": [1, 2]}], "n": 149, "filtrable": true}, {"titulo": "Doble titulación: ¿en qué programa se desempeñan?", "cab": ["Base", "Solo Antropología %", "Ambos, mismo cargo %", "Ambos, cargos distintos %", "Solo el otro programa %", "Ninguno de sus programas %"], "filas": [["Empleo actual (n=52)", 19.2, 3.8, 3.8, 15.4, 57.7], ["Alguna vez post-grado (n=72)", 36.1, 8.3, 5.6, 12.5, 37.5]], "nota": "Solo egresados con doble titulación. Cada barra suma 100 %. 'Ambos, mismo cargo' = un cargo vinculado a las dos disciplinas; 'ambos, cargos distintos' = un cargo de Antropología y otro del otro programa.", "tema": "¿Antropólogos o su otro programa?", "tipo": "apilada", "analisis": "• Empleo actual (n=52): 57,7 % no se desempeña en ninguno de sus dos programas; 19,2 % solo en Antropología y 15,4 % solo en el otro programa; 7,6 % combina ambos.\n• Alguna vez post-grado (n=72): 36,1 % solo en Antropología y 37,5 % en ninguno. A lo largo de la trayectoria, Antropología pesa más que el otro programa.\n• 'Ninguno' no significa desempleo: trabajan en cargos genéricos (gestión de proyectos, consultoría, administración, comercial) que no exigen ninguno de los dos títulos con el criterio estricto usado."}, {"titulo": "Desempeño en el otro programa vs en Antropología (alguna vez post-grado)", "cab": ["Otro pregrado (n≥4)", "% alguna vez en ese programa", "% alguna vez en Antropología"], "filas": [["Ciencia política (n=15)", 0, 47], ["Lenguas y cultura (n=8)", 12, 38], ["Psicología (n=8)", 38, 62], ["Economía (n=7)", 14, 43], ["Historia (n=6)", 33, 100], ["Derecho (n=5)", 100, 40], ["Narrativas digitales (n=5)", 20, 40]], "nota": "Mide si la persona ha tenido alguna vez después del grado (empleo actual o pasado) un cargo profesional en ese programa o en Antropología. Una persona puede contar en las dos barras. Con n entre 5 y 15, una sola persona mueve mucho el porcentaje: son orientaciones, no tendencias firmes.", "tema": "¿Antropólogos o su otro programa?", "tipo": "horizontal", "analisis": "• En casi todos los programas pesa más Antropología que el otro programa; la excepción es Derecho (100 % en el otro programa vs 40 % en Antropología).\n• Historia (n=6): 100 % ha tenido algún cargo en Antropología; 0 sin cargos en ninguno.\n• Ciencia política (n=15): 0 % en Ciencia Política, 47 % en Antropología; 8 (53 %) sin cargos en ninguno de los dos.\n• Psicología (n=8): 62 % en Antropología, 38 % en Psicología; solo 1 (12 %) sin cargos en ninguno."}, {"titulo": "Conclusiones — ¿Antropólogos o su otro programa?", "tipo": "texto", "cab": [], "filas": [], "nota": "", "tema": "¿Antropólogos o su otro programa?", "texto": ["Con la definición acordada, el 32,7 % se desempeña hoy en Antropología y el 55,4 % lo ha hecho alguna vez después del grado. Solo el 4,1 % tiene hoy un cargo explícito de antropólogo, etnógrafo o arqueólogo (10 % alguna vez).", "Egresados con doble titulación y empleo actual (n=52): 19,2 % solo en Antropología; 3,8 % en un mismo cargo que combina ambas disciplinas y 3,8 % en cargos distintos; 15,4 % solo en el otro programa; 57,7 % en ninguno de sus dos programas. Alguna vez después del grado: 36,1 % solo en Antropología y 37,5 % en ninguno.", "Por programa (empleo actual), ejercen su profesión del otro pregrado: Derecho (3 de 4), Arquitectura (2 de 2), Arte (2 de 3) e Historia (2 de 3). No tienen cargos que exijan ese título: Ciencia Política (0 de 10), Economía (0 de 6) y Lenguas y Cultura (0 de 5).", "Alguna vez después del grado, por programa (n ≥ 4), solo en Derecho pesa más el otro programa (100 % vs 40 % en Antropología); en los demás pesa más Antropología. En Ciencia Política (n=15), 7 han tenido cargos en Antropología, ninguno en Ciencia Política y 8 (53 %) en ninguno de los dos."]}, {"titulo": "Demanda del mercado (LinkedIn) vs. ocupación actual, por grupo de cargo", "cab": ["Grupo de cargo", "% ofertas LinkedIn", "% egresados (empleo actual)"], "filas": [["Gestión social, comunitaria y sostenibilidad", 26.3, 11.2], ["Docencia", 11.8, 10.2], ["Investigación y antropología", 10.5, 15.3], ["Gestión de proyectos", 10.5, 10.2], ["Consultoría y análisis", 9.2, 6.1], ["Administración, operaciones y coordinación", 7.9, 8.2], ["Diseño, tecnología y datos", 6.6, 7.1], ["Representación y otros", 5.3, 0.0], ["Voluntariado", 5.3, 1.0], ["Comercial y servicio al cliente", 2.6, 7.1], ["Comunicación y contenidos", 1.3, 6.1], ["Cultura, arte y patrimonio", 1.3, 3.1], ["Contratista o independiente", 0.0, 6.1], ["Emprendimiento y dirección", 0.0, 4.1], ["Jurídico", 0.0, 3.1]], "nota": "Qué piden las ofertas de LinkedIn Jobs frente a lo que hacen hoy los egresados. Mayor brecha: gestión social (26,3 % vs 11,2 %, +15,1 p.p.).", "tema": "Mercado laboral", "tipo": "horizontal", "analisis": "• La mayor brecha está en gestión social, comunitaria y sostenibilidad: 26,3 % de las ofertas de LinkedIn vs 11,2 % de los egresados con empleo actual (+15,1 p.p.); en el mercado general (LinkedIn + otras bolsas) sube a 41,9 % vs 11,2 % (+30,7 p.p.).\n• Investigación y antropología pesa más entre los egresados (15,3 %) que en LinkedIn (10,5 %); con otras bolsas queda equilibrada (14 %), sobre todo por la arqueología.\n• Cargos comerciales, de comunicación y de contratista pesan más entre los egresados que en las ofertas: reflejan empleos fuera del campo.\n• Competencias transversales más pedidas (LinkedIn): Excel 43,4 %, inglés 42,1 %, redacción de informes 31,6 %. Disciplinares: gestión social 40,8 %, investigación social 36,8 %, encuestas 22,4 %.\n• En otras bolsas pesan el trabajo con comunidades (34,8 %), la pedagogía (20,7 %) y la arqueología (17,4 %).\n• Solo el 16,5 % de las vacantes de otras bolsas es exclusiva de Antropología o Arqueología: compiten sobre todo con Sociología (70,9 %), Trabajo Social (64,1 %) y Psicología (50,5 %).\n• En Talent Insights, la formación complementaria de los egresados de Uniandes se parece mucho a la del resto del país (ninguna d
